<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#194d51"><meta name="description" content="NORMAL SPM Writing Part 3 New School Canteen review game with BM B2 and C1 meanings."><title>SPM Elaboration Builder — The New School Canteen (NORMAL)</title><style>
:root{--ink:#253943;--muted:#617580;--teal:#237f80;--deep:#194d51;--border:#dce8e9;--soft:#f2f8f8;--mint:#e6f7ed;--green:#1e7450;--red:#a3344f;--rose:#fff0f2;--gold:#b47715}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,#d8eee6,transparent 36%),radial-gradient(circle at 100% 20%,#fff0d8,transparent 36%),#f7fbfa;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.shell{max-width:790px;margin:auto;padding:18px 14px 42px}
header{text-align:center;margin:6px auto 22px}
.kicker{display:inline-block;padding:7px 14px;background:white;border-radius:100px;color:var(--teal);font-size:.76rem;font-weight:850;letter-spacing:.045em}
h1{font-size:clamp(1.8rem,5vw,2.45rem);line-height:1.12;margin:13px 0 7px;letter-spacing:-.035em;color:var(--deep)}
.subtitle{margin:0;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--border);border-radius:24px;padding:clamp(18px,4vw,31px);box-shadow:0 13px 38px #4d857e18}
h2{font-size:1.32rem;margin:0 0 12px;line-height:1.4}h3{font-size:1.05rem;margin:0 0 10px}
p,li{line-height:1.7}p{margin:9px 0}ol,ul{padding-left:23px}
.small{color:var(--muted);font-size:.9rem}.tiny{color:var(--muted);font-size:.78rem}
.exam{background:var(--soft);border:1px solid #d0e4e4;border-radius:17px;padding:16px 18px;margin:17px 0}
.exam strong{color:var(--deep)}.exam ul{margin:8px 0}.exam li{margin:5px 0}
label.name{display:block;margin-top:23px;margin-bottom:8px;font-weight:800}
input[type=text]{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid #bedbda;background:white}
textarea{width:100%;min-height:145px;resize:vertical;padding:15px;border-radius:13px;border:2px solid #bedbda;background:white;color:var(--ink);font:inherit;line-height:1.65}
.writing-tip{background:#eaf6f4;border:1px solid #d0e7e1;border-radius:14px;padding:14px 16px;margin:15px 0;line-height:1.65}
.writing-tip ul{margin:7px 0 0}
.writing-meta{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:.83rem}
.essay p{white-space:pre-wrap}
button{font:inherit;cursor:pointer;font-weight:780;border:0;border-radius:12px;padding:13px 17px}
button:focus-visible,input:focus-visible{outline:3px solid #7bc6c2;outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.primary{background:var(--teal);color:white}.primary:hover:not(:disabled){background:#176264}
.secondary{background:#e6f4f2;color:var(--deep)}.secondary:hover:not(:disabled){background:#d5eeeb}
.full{width:100%}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}.row>button{flex:1 1 180px}
.chip{display:inline-block;border-radius:99px;background:#e8f5f2;color:#286a66;font-size:.8rem;font-weight:850;padding:6px 11px}
.progress{display:flex;gap:6px;margin:12px 0 22px}.progress span{flex:1;height:8px;background:#e8f0ef;border-radius:99px}.progress .done{background:#42a58e}.progress .active{background:#d6a03b}
.point{background:#f2f8f8;border:1px solid #d6e5e4;border-radius:16px;padding:17px 18px;margin:14px 0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.065em;font-weight:850;color:#357d7a;margin-bottom:6px}
.point p{font-weight:730;font-size:1.08rem;margin:0}
.step-title{margin:20px 0 8px;font-size:1.22rem}
.choice-list{display:grid;gap:10px;margin-top:15px}
.choice{width:100%;background:white;border:2px solid #d8e5e4;display:flex;gap:12px;align-items:flex-start;text-align:left;color:var(--ink);line-height:1.55}
.choice:hover:not(:disabled){border-color:#67ada7;background:#f5fcfa}
.choice.selected{border-color:var(--teal);background:#eaf8f5}
.choice.good{border-color:#4fba83;background:#eaf9ef}
.choice.bad{border-color:#e3a1af;background:var(--rose)}
.letter{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:#e5f3f0;color:#266b68;display:grid;place-items:center;font-weight:850}
.feedback{border-radius:14px;padding:14px 16px;margin:16px 0;line-height:1.65}
.feedback.good{background:var(--mint);color:var(--green);border:1px solid #a6dcbf}
.feedback.bad{background:var(--rose);color:var(--red);border:1px solid #eec5ce}
.draft{background:#f8fbff;border:1px solid #dbe6f1;border-radius:15px;padding:13px 16px;margin:17px 0}
.draft p{margin:7px 0;font-size:.95rem}
.missing{color:#84939b;font-style:italic}
.copycheck{background:#fff3d4;border:3px solid #dfa736;border-radius:18px;padding:19px 18px;margin:18px 0}
.copycheck h2{color:#80530d;margin-bottom:5px}
.urgent-reminder{background:#fff0f0;border:3px solid #d52e3e;border-left:9px solid #d52e3e;border-radius:17px;padding:20px 19px;margin:20px 0;box-shadow:0 5px 0 #f9d7da}
.urgent-reminder .urgent-heading{display:flex;align-items:center;gap:10px;font-size:clamp(1.27rem,5.2vw,1.65rem);line-height:1.25;font-weight:950;color:#a71e30;margin:0 0 12px}
.urgent-reminder .urgent-icon{font-size:1.7rem;line-height:1}
.urgent-reminder p{font-size:clamp(1.03rem,3.9vw,1.18rem);font-weight:730;line-height:1.65;margin:9px 0;color:#79212d}
.urgent-reminder .essay-title{padding:11px 14px;background:white;border:1px solid #eeb4ba;border-radius:11px;font-size:1.12rem;font-weight:900;color:#952230;margin:13px 0}
.urgent-reminder .urgent-note{font-size:.92rem;font-weight:650;color:#863740;margin-top:10px}
.paper{background:#fff;border:1px solid #edd7a3;border-radius:14px;padding:15px 17px;margin:15px 0;line-height:1.85}
.confirm{display:flex;align-items:flex-start;gap:12px;line-height:1.55;font-weight:740;margin:20px 0 9px}
.confirm input{accent-color:var(--teal);width:21px;height:21px;flex:0 0 21px;margin:2px 0 0}
.score{font-size:clamp(2.7rem,8vw,4.1rem);font-weight:900;color:var(--teal);line-height:1.1}
.essay{background:#f8fbfa;border:1px solid #dbe9e6;border-radius:15px;padding:16px;margin:17px 0}
.essay p{margin:0 0 15px}.essay p:last-child{margin:0}
.copied{min-height:1.2em;color:var(--green);font-weight:760;font-size:.9rem}
footer{text-align:center;font-size:.77rem;color:#6a8184;margin-top:20px}
@media(max-width:480px){.shell{padding:12px 10px 30px}.panel{border-radius:18px}.choice{padding:12px}.copycheck{padding:14px}.row>button{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{body{background:white}.shell{max-width:none}header,.no-print,footer{display:none!important}.panel{border:0;box-shadow:none}.essay{border:0;padding:0}}

/* Distinct point and elaboration stages */
.segment{margin:14px 0 11px;border-radius:13px;padding:12px 14px;background:#e8f3fc;border-left:5px solid #5795c1;font-weight:820;color:#2c5878}
.segment.second{background:#fff2db;border-left-color:#d9a33d;color:#805a20}
.draft p{margin:8px 0}
.draft .built-sentence{display:block;line-height:1.7}
.essay-title{overflow-wrap:anywhere}

.vocab{position:relative;display:inline;border-bottom:2px dotted #23808b;color:#176773;font-weight:780;cursor:help;outline-offset:3px}
.vocab-tooltip{position:absolute;z-index:50;left:0;bottom:calc(100% + 7px);min-width:160px;max-width:min(230px,75vw);background:#193c49;color:white;border-radius:9px;padding:9px 11px;font:600 .81rem/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 16px #173d4930;opacity:0;visibility:hidden;pointer-events:none;text-align:left}
.vocab:hover .vocab-tooltip,.vocab:focus .vocab-tooltip,.vocab.is-open .vocab-tooltip{opacity:1;visibility:visible}
.vocab-guide{font-size:.83rem;color:#526b70;margin:7px 0 13px}
.vocab.c1{color:#7947a3;border-bottom-color:#8d63b0}.vocab.c1 .vocab-tooltip{background:#613c81}
.vocab:focus-visible{outline:2px solid #176773;border-radius:3px}
.vocab.vocab-c1{color:#74438d;border-bottom-color:#8958a9}
.vocab.vocab-c1 .vocab-tooltip{background:#49305b}
.vocab-tooltip strong{font-size:.73rem;padding:1px 5px;border-radius:4px;background:#ffffff33}
</style></head>
<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 3 · REVIEW · NORMAL</span><h1>Elaboration Builder</h1><p class="subtitle">🍱 The New School Canteen · Review Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"Best Feature of the Upgraded Canteen","bullet":"what do you like the most about the canteen?","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening previews the favourite feature?","hint":"Preview one feature you like before describing it.","correct":1,"options":[["To begin with, the school canteen offers a variety of affordable meals.","Menu variety would introduce a food-review focus, not the favourite dining-area feature."],["To begin with, there is one feature I particularly appreciate about the upgraded school canteen.","This introduces the favourite feature without combining it with Point 1."],["To begin with, our school has made several improvements to the sports facilities.","Sports facilities are outside this review of the upgraded canteen."]]},{"tag":"POINT 1 — Main point","question":"Which feature is described as the favourite?","hint":"Choose the feature concerned with space and organisation.","correct":0,"options":[["My favourite feature is its spacious and well-organised dining area.","It identifies the spacious, organised dining area, which the paragraph develops."],["My favourite feature is the wider range of snacks at recess.","Snack choices are different from the spacious dining area explained next."],["My favourite feature is the recently repainted exterior walls.","Exterior paintwork does not support the detailed layout discussion."]]},{"tag":"POINT 1 — Elaboration 1 of 4","question":"How does the layout improve movement during recess?","hint":"Think about moving between tables during crowded recess.","correct":2,"options":[["The tables have colourful decorations that make the area attractive.","Colours may improve appearance, but not movement between tables."],["The increased seating capacity means pupils never need to wait for food.","Extra seating cannot guarantee that pupils never wait for food."],["The tables are arranged with enough room between them, making it easier for pupils to move around during the busy recess period.","It explains how the arrangement makes movement easier during recess."]]},{"tag":"POINT 1 — Elaboration 2 of 4","question":"Which example supports easy movement around the seats?","hint":"Give a real example involving pupils sharing seats.","correct":1,"options":[["For instance, my friends can compare different food prices at the counter.","Food price comparisons do not illustrate moving around the seats."],["For instance, my classmates and I can find seats together without blocking the walkways or disturbing others.","It offers a concrete example of friends finding seats without blocking movement."],["For instance, my classmates can try a new menu during recess.","Trying dishes illustrates menu variety rather than the space between tables."]]},{"tag":"POINT 1 — Elaboration 3 of 4","question":"How does the seating rectify the problem of crowded walkways?","hint":"Focus on a problem caused by narrow walkways.","correct":0,"options":[["This thoughtful layout helps rectify the problem of crowded walkways, creating a calmer and more welcoming atmosphere.","It explains a specific problem that the design helps rectify."],["The layout helps rectify the problem of expensive meals at the canteen.","The layout cannot rectify expensive food prices; that needs a pricing change."],["The layout helps rectify the problem of limited healthy food options.","More space between tables does not fix the range of nutritious meals."]]},{"tag":"POINT 1 — Elaboration 4 of 4","question":"Which result logically follows from a better dining layout?","hint":"Describe a calmer mealtime without exaggeration.","correct":2,"options":[["Consequently, the new tables guarantee that no pupil will ever be late.","Better tables cannot guarantee that every pupil arrives at class punctually."],["Consequently, the canteen will no longer need a cleaning schedule.","The canteen still needs cleaning even when dining is comfortable."],["Consequently, pupils can enjoy their meals without feeling unnecessarily rushed.","It gives a realistic effect of a more comfortable layout."]]}]},{"title":"Convenience of the New Canteen","bullet":"do you think it is convenient for pupils? Why?","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces convenience?","hint":"Introduce the question of convenience, not menu quality.","correct":0,"options":[["Furthermore, there is a practical reason why I consider the upgraded canteen convenient for pupils.","This previews the convenience issue before providing the specific reason."],["Furthermore, there are various delicious meals available for pupils.","A wider food selection concerns menu quality, not how convenient the counter arrangement is."],["Furthermore, there are several improvements the school could still introduce.","Paintwork improves appearance rather than counter access."]]},{"tag":"POINT 1 — Main point","question":"Which practical improvement makes ordering easier?","hint":"Think about food and drink counter organisation.","correct":2,"options":[["One significant improvement is the brighter paintwork near the counter.","Bright paint does not make the process of ordering and collecting meals clearer."],["One significant improvement is the number of decorative posters on the walls.","Posters are decorative rather than a functional counter arrangement."],["One significant improvement is the clearer arrangement of food and drink counters.","Clearer counter arrangements offer a practical convenience improvement."]]},{"tag":"POINT 1 — Elaboration 1 of 4","question":"How does the counter layout facilitate smoother queues?","hint":"Explain where pupils order and collect meals.","correct":1,"options":[["This layout can facilitate more comfortable seating during busy recess periods.","Comfortable seating is a different feature from organised food queues."],["This layout can facilitate smoother queues because pupils know where to order and collect their meals.","The sentence explains how the counter layout facilitates orderly queues."],["This layout can facilitate better menu choices by increasing food variety.","A wider menu is not the explanation of how this arrangement speeds ordering."]]},{"tag":"POINT 1 — Elaboration 2 of 4","question":"Which example demonstrates separate food and drink counters?","hint":"Give a specific example of different queues.","correct":0,"options":[["For example, those buying rice dishes can line up separately from pupils purchasing drinks.","Separate food and drink lines illustrate how the arrangement works."],["For example, pupils can choose between rice dishes and sandwiches.","Choosing dishes does not demonstrate how separate counters work."],["For example, pupils can meet their friends at the dining tables.","Meeting friends at tables is unrelated to the arrangement of queues."]]},{"tag":"POINT 1 — Elaboration 3 of 4","question":"How do clear signs improve convenience?","hint":"Focus on avoiding confusion at a busy time.","correct":2,"options":[["The signs improve the appearance of the walls with colourful designs.","Wall decoration does not reduce confusion about ordering."],["The signs encourage pupils to choose expensive dishes over healthy ones.","Staff uniforms do not help pupils identify the food and drink counters."],["The clear signs also reduce confusion, especially when many students arrive at the same time.","Signs reduce confusion during a busy school break."]]},{"tag":"POINT 1 — Elaboration 4 of 4","question":"What realistic result follows from the organised counters?","hint":"Consider ordering speed and returning to class.","correct":1,"options":[["As a result, pupils never have to wait in a food queue again.","Faster service cannot guarantee that no pupil ever waits."],["As a result, pupils can buy their food more efficiently and return to class on time.","The effect of efficient service is more time to return to class."],["As a result, pupils have no need to return to lessons after recess.","The improvement should help pupils return to class, not skip lessons."]]}]},{"title":"Suggestions for Further Improvement","bullet":"what other improvements should be added? Give some ideas.","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces future suggestions?","hint":"Preview improvements instead of only describing existing features.","correct":2,"options":[["Finally, the school canteen now offers an enjoyable dining experience.","Praising the current dining experience does not introduce improvements to be added."],["Finally, the upgrade has already solved every problem at the canteen.","Claiming that every problem is solved leaves no reason for further suggestions."],["Finally, there are several improvements that could make the new school canteen even better.","This introduces the future improvements requested in the third bullet."]]},{"tag":"POINT 1 — Main point","question":"What is one meaningful improvement to the menu?","hint":"Suggest wholesome options at prices pupils can afford.","correct":1,"options":[["One suggestion is to remove all vegetable dishes from the menu.","Removing vegetables makes the menu less nutritious."],["One suggestion is to provide a wider selection of nutritious and affordable meals.","Nutritious and affordable food is a meaningful, specific first suggestion."],["One suggestion is to sell mainly sugary drinks and sweet snacks.","More sugary snacks do not help pupils make healthier choices."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"Why would a wider selection help pupils?","hint":"Connect the menu to healthy choices and money.","correct":0,"options":[["This would help pupils make healthier choices without spending too much money.","It explains the benefit of healthier choices within pupils' budgets."],["This would encourage pupils to choose the same dish every day.","Healthy variety should offer choice, not make everyone eat the same dish."],["This would allow pupils to spend as much money as possible on lunch.","Affordable meals help pupils manage budgets, not ignore them."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which example illustrates nutritious and affordable options?","hint":"Describe actual food choices such as fruit and vegetables.","correct":2,"options":[["For instance, the canteen could introduce expensive celebration meals.","Expensive celebration meals do not illustrate affordable options."],["For instance, the canteen could sell more fizzy drinks in larger bottles.","Larger fizzy drinks are not nutritious alternatives."],["For instance, the canteen could offer fruit, vegetable dishes and reasonably priced set meals.","Fruit and reasonably priced set meals are concrete examples."]]},{"tag":"POINT 2 — Second suggestion","question":"Which second improvement addresses a different issue?","hint":"Choose a new issue: waste disposal and recycling.","correct":1,"options":[["Another suggestion is to introduce even more healthy set meals.","More healthy meals repeat the first recommendation rather than adding a new one."],["Another suggestion is to install more rubbish and recycling bins near the dining area.","Extra rubbish and recycling bins are a distinct second suggestion."],["Another suggestion is to offer a greater variety of fruit cups.","Fruit cups are still part of the first food-variety suggestion."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"How can bin labels reinforce responsible habits?","hint":"Think about the message clear bin labels teach.","correct":0,"options":[["Clear labels on these bins could reinforce the importance of keeping shared spaces clean.","Clear labels reinforce responsibility for keeping shared areas clean."],["Clear labels on the bins could reinforce the idea that cleaning is only the workers' job.","Saying cleaning is only the workers' job undermines shared responsibility."],["Clear labels on the bins could reinforce the belief that recycling is unnecessary.","Labelling bins should encourage recycling rather than dismiss it."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What balanced result could follow from these changes?","hint":"Connect both suggestions to health and cleanliness.","correct":2,"options":[["Ultimately, the changes would permanently eliminate all litter.","Extra bins and healthy food cannot eliminate every piece of litter permanently."],["Ultimately, the canteen would never require cleaning staff again.","Public dining areas still require regular cleaning and maintenance."],["Ultimately, these changes would make the canteen healthier and more pleasant for everyone.","The result logically connects healthier food and a cleaner dining space."]]}]}];
const vocab={"rectify":["C1","membetulkan / mengatasi masalah"],"facilitate":["C1","memudahkan / melancarkan"],"reinforce":["C1","mengukuhkan / memperteguh"],"spacious":["B2","luas dan lapang"],"layout":["B2","susun atur"],"atmosphere":["B2","suasana"],"efficiently":["B2","dengan cekap"],"nutritious":["B2","berkhasiat"],"affordable":["B2","mampu milik"]};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const [level,bm]=vocab[word.toLowerCase()];return '<span class="vocab '+(level==="C1"?"c1":"b2")+'" tabindex="0" data-meaning="'+escapeHTML(bm)+'" aria-label="'+escapeHTML(word+" ("+level+"): "+bm)+'">'+word+'<span class="vocab-tooltip">'+level+' · '+escapeHTML(bm)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 3 · Review — Original Exam Task</strong><p><strong>PART 3 · REVIEW</strong></p><p><strong>THE NEW SCHOOL CANTEEN</strong></p><p>You saw this notice on the bulletin board in your class.</p><p><strong>We&#39;d like to hear from you.</strong></p><p>Our school canteen has recently been upgraded. Write and tell us your thoughts.</p><p><strong>In your review, you should include:</strong></p><ul><li>what do you like the most about the canteen?</li><li>do you think it is convenient for pupils? Why?</li><li>what other improvements should be added? Give some ideas.</li></ul><p>Write your review.</p></div>";
const titleReminder=()=>"<div class=\"urgent-reminder\" role=\"note\"><div class=\"urgent-heading\">📕 STOP! WRITE THIS FIRST!</div><p>Write the <strong>REVIEW TITLE</strong> and a <strong>FOUR-SENTENCE REVIEW INTRODUCTION</strong> in your exercise book.</p><div class=\"essay-title\">The New School Canteen</div><p class=\"urgent-note\">Review notes: past experiences → comparison → recent visit and impression → what this review will discuss.</p></div>";
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">💬 School Canteen Review · NORMAL</span><span class="small">B1–B2 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Develop a richer SPM review, one meaningful sentence at a time.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the review title and four-sentence introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over B2 vocabulary (teal) and C1 vocabulary (purple) on a computer, or tap the underlined words on your phone.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Review closing</span></div><h2>Write Your Review Closing</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR REVIEW CLOSING!</div><p>Write a <strong>FOUR-SENTENCE REVIEW CLOSING</strong>: (1) recommendation, (2) reasons, (3) personal experience and (4) a hope for improvement.</p><p class="urgent-note">✍️ Complete your review closing before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my review closing in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full review in your notebook</strong><p>It should contain your title, introduction, all three developed body paragraphs and review closing. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and review closing are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — develop it with four detailed elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Review Closing →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
