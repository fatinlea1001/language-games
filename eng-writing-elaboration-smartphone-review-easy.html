<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 3 · REVIEW · EASY</span><h1>Elaboration Builder</h1><p class="subtitle">📱 Smartphone · Gadget Review</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"What My New Gadget Is","bullet":"write what the gadget is","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the gadget being reviewed?","hint":"Begin with a general opening about reviewing one gadget.","correct":1,"options":[["To begin with, there are several reasons to spend less time outdoors.","This sentence does not support the gadget description, functions or recommendation in the original task."],["To begin with, there is one gadget I would like to review.","Correct: it opens the paragraph before naming the gadget."],["To begin with, there is one hobby I enjoy during holidays.","This sentence does not support the gadget description, functions or recommendation in the original task."]]},{"tag":"POINT 1 — Main point","question":"What gadget does the writer review?","hint":"Name a smartphone and its useful features.","correct":2,"options":[["It is a new sports bag with many pockets and strong straps.","This sentence does not support the gadget description, functions or recommendation in the original task."],["It is a camera lens that cannot make phone calls.","This sentence does not support the gadget description, functions or recommendation in the original task."],["It is a new smartphone with a clear screen and a good camera.","Correct: a smartphone is the gadget being reviewed."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"How does the writer describe the smartphone's design?","hint":"Describe the design, size or portability of the phone.","correct":0,"options":[["I chose it because it is light and easy to carry.","Correct: the sentence elaborates on design and portability."],["I chose it because I never need to carry it around.","This sentence does not support the gadget description, functions or recommendation in the original task."],["I chose it because it is too large to fit in my school bag.","This sentence does not support the gadget description, functions or recommendation in the original task."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"How has the gadget suited the writer's daily life?","hint":"Give another practical detail about using it daily.","correct":1,"options":[["I always leave it switched off at home, so it cannot help me.","This sentence does not support the gadget description, functions or recommendation in the original task."],["I can put it in my bag and use it whenever I need it.","Correct: it explains how the smartphone fits everyday activities."],["I only use it once a year during school holidays.","This sentence does not support the gadget description, functions or recommendation in the original task."]]}]},{"title":"Main Functions of the Smartphone","bullet":"describe the main functions of the gadget","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the MAIN FUNCTIONS?","hint":"Start by introducing multiple functions.","correct":2,"options":[["Furthermore, there are several reasons not to buy this gadget.","This sentence does not support the gadget description, functions or recommendation in the original task."],["Furthermore, there are many things I dislike about school.","This sentence does not support the gadget description, functions or recommendation in the original task."],["Furthermore, there are several main functions of my smartphone.","Correct: it introduces more than one practical function."]]},{"tag":"POINT 1 — Main point","question":"What is the first main function of the smartphone?","hint":"Point 1 should discuss calls, messages and communication.","correct":0,"options":[["One function is communication through calls and messages.","Correct: communication is the first main function."],["One function is helping me cook food without using electricity.","This sentence does not support the gadget description, functions or recommendation in the original task."],["One function is cleaning every room in my house.","This sentence does not support the gadget description, functions or recommendation in the original task."]]},{"tag":"POINT 1 — Elaboration 1 of 1","question":"How does the first function help the writer?","hint":"Describe a specific benefit of staying in touch.","correct":1,"options":[["For example, I use it to repair broken chairs after class.","This sentence does not support the gadget description, functions or recommendation in the original task."],["For example, I can contact my parents after school.","Correct: this explains the benefit of calls, messages or video calls."],["For example, I use it to water all the plants at school.","This sentence does not support the gadget description, functions or recommendation in the original task."]]},{"tag":"POINT 2 — Second point","question":"What different second function does the gadget offer?","hint":"Point 2 should be different: learning and educational apps.","correct":2,"options":[["Another function is keeping my shoes clean during rainy days.","This sentence does not support the gadget description, functions or recommendation in the original task."],["Another function is charging my school bus automatically.","This sentence does not support the gadget description, functions or recommendation in the original task."],["Another function is helping me with my studies.","Correct: study tools provide a different second function."]]},{"tag":"POINT 2 — One elaboration","question":"How does the second function support studying?","hint":"Explain how the phone helps organise or complete studies.","correct":0,"options":[["I can watch English lessons and check information for my homework.","Correct: it elaborates on how educational apps support learning."],["I can prepare all my meals without using any kitchen tools.","This sentence does not support the gadget description, functions or recommendation in the original task."],["I can use it to complete my homework without learning anything.","This sentence does not support the gadget description, functions or recommendation in the original task."]]}]},{"title":"My Recommendation and Reason","bullet":"explain whether you would recommend it to your friends or not and why","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the recommendation?","hint":"Introduce one strong reason for recommending the gadget.","correct":1,"options":[["Finally, there is one reason why I want to sell this gadget immediately.","This sentence does not support the gadget description, functions or recommendation in the original task."],["Finally, there is one main reason I would recommend this gadget.","Correct: it introduces the final review judgement."],["Finally, there are several reasons gadgets should never be used.","This sentence does not support the gadget description, functions or recommendation in the original task."]]},{"tag":"POINT 1 — Main point","question":"Would the writer recommend this smartphone, and why?","hint":"State clearly who should buy it and explain its benefits.","correct":2,"options":[["I would not recommend it because it has no useful features for daily life.","This sentence does not support the gadget description, functions or recommendation in the original task."],["I would recommend it because it is impossible to use for schoolwork.","This sentence does not support the gadget description, functions or recommendation in the original task."],["I would recommend it to my friends and family because it makes daily tasks easier.","Correct: the writer clearly recommends the smartphone and gives a reason."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"What details support this recommendation?","hint":"Use daily communication and studying to support the recommendation.","correct":0,"options":[["It has become indispensable to me, as I use it to study and communicate every day.","Correct: daily usefulness supports the positive recommendation."],["It has become unnecessary to me because I never use it.","This sentence does not support the gadget description, functions or recommendation in the original task."],["Its features make it harder for me to contact anyone or study.","This sentence does not support the gadget description, functions or recommendation in the original task."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"What does the writer conclude about recommending it?","hint":"Finish with a positive judgement about the smartphone.","correct":1,"options":[["Therefore, I believe my friends would be unable to benefit from it.","This sentence does not support the gadget description, functions or recommendation in the original task."],["Therefore, I believe others would find it helpful too.","Correct: the final sentence confirms that the gadget is worth recommending."],["Therefore, I think everyone should avoid using smartphones completely.","This sentence does not support the gadget description, functions or recommendation in the original task."]]}]}];
const vocab={"indispensable":["C1","sangat diperlukan / amat penting"],"gadget":["B2","alat elektronik kecil yang berguna"],"communication":["B2","komunikasi / perhubungan"],"recommend":["B2","mengesyorkan / mencadangkan"],"functions":["B2","fungsi / kegunaan"],"information":["B2","maklumat"]};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const [level,bm]=vocab[word.toLowerCase()];return '<span class="vocab '+(level==="C1"?"c1":"b2")+'" tabindex="0" data-meaning="'+escapeHTML(bm)+'" aria-label="'+escapeHTML(word+" ("+level+"): "+bm)+'">'+word+'<span class="vocab-tooltip">'+level+' · '+escapeHTML(bm)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 3 · Review — Original Exam Task</strong><p>You recently bought a new gadget to help with your daily life. Write a review for your school magazine.</p><p><strong>In your review, you should:</strong></p><ul><li>write what the gadget is</li><li>describe the main functions of the gadget</li><li>explain whether you would recommend it to your friends or not and why</li></ul><p><strong>Write your review.</strong></p></div>";
const titleReminder=()=>"<div class=\"urgent-reminder\" role=\"note\"><div class=\"urgent-heading\">📕 STOP! WRITE THIS FIRST!</div><p>Write the <strong>REVIEW TITLE</strong> and a <strong>FOUR-SENTENCE INTRODUCTION</strong> in your exercise book.</p><div class=\"essay-title\">Smartphone: A Review</div><p class=\"urgent-note\">Follow your Review lesson notes: introduce the importance of gadgets, mention their uses, describe your recent purchase, and preview the gadget, functions and recommendation.</p></div>";
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">📱 Smartphone Review · EASY</span><span class="small">A2–B1 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Build a complete SPM review in your exercise book.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the review title and four-sentence introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over underlined vocabulary on a computer, or tap the word on your phone to see its meaning.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Review closing</span></div><h2>Write Your Review Closing</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR REVIEW CLOSING!</div><p>Write a <strong>FOUR-SENTENCE REVIEW CLOSING</strong>: (1) recommend this smartphone, (2) explain why it is useful, (3) describe your own experience using it, and (4) express a hope about continued usefulness or future improvements.</p><p class="urgent-note">✍️ Complete your review closing before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my review closing in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full review in your notebook</strong><p>It should contain your title, introduction, all three body paragraphs and review closing. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and review closing are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — add ONE elaboration for each point.</p>':'<p class="small">One main point — add TWO elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Review Closing →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
