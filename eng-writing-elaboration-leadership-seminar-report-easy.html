<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#194d51"><meta name="description" content="SPM Part 3 EASY Leadership Seminar report builder: 15 guided choices with BM vocabulary and notebook-copy checkpoints."><title>SPM Elaboration Builder — Report on the Leadership Seminar (EASY)</title><style>
:root{--ink:#253943;--muted:#617580;--teal:#237f80;--deep:#194d51;--border:#dce8e9;--soft:#f2f8f8;--mint:#e6f7ed;--green:#1e7450;--red:#a3344f;--rose:#fff0f2;--gold:#b47715}

p,li{line-height:1.7}p{margin:9px 0}ol,ul{padding-left:23px}

.urgent-reminder .essay-title{padding:11px 14px;background:white;border:1px solid #eeb4ba;border-radius:11px;font-size:1.12rem;font-weight:900;color:#952230;margin:13px 0}

.confirm input{accent-color:var(--teal);width:21px;height:21px;flex:0 0 21px;margin:2px 0 0}
.score{font-size:clamp(2.7rem,8vw,4.1rem);font-weight:900;color:var(--teal);line-height:1.1}
.essay{background:#f8fbfa;border:1px solid #dbe9e6;border-radius:15px;padding:16px;margin:17px 0}
.essay p{margin:0 0 15px}.essay p:last-child{margin:0}
.copied{min-height:1.2em;color:var(--green);font-weight:760;font-size:.9rem}
footer{text-align:center;font-size:.77rem;color:#6a8184;margin-top:20px}
@media(max-width:480px){.shell{padding:12px 10px 30px}.panel{border-radius:18px}.choice{padding:12px}.copycheck{padding:14px}.row>button{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{body{background:white}.shell{max-width:none}header,.no-print,footer{display:none!important}.panel{border:0;box-shadow:none}.essay{border:0;padding:0}}

<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 3 · REPORT · EASY</span><h1>Elaboration Builder</h1><p class="subtitle">🎓 Leadership Seminar · Report Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"Activities During the Seminar","bullet":"what activities were carried out during the seminar","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the activities during the seminar?","hint":"Use a separate opening sentence to introduce multiple activities.","correct":1,"options":[["To begin with, there were no learning activities during the seminar.","This does not correctly develop the required seminar report section. Try again."],["To begin with, there were several activities during the seminar.","Correct: this sentence introduces the activities."],["Furthermore, there were several reasons the seminar was successful.","This does not correctly develop the required seminar report section. Try again."]]},{"tag":"POINT 1 — Main point","question":"What was the first activity?","hint":"Name the team-building activity.","correct":2,"options":[["One activity was a shopping trip without any teamwork.","This does not correctly develop the required seminar report section. Try again."],["One reason was that students worked well together.","This does not correctly develop the required seminar report section. Try again."],["One activity was a team-building game.","Correct: this is the first activity."]]},{"tag":"POINT 1 — One elaboration","question":"What did prefects do in the first activity?","hint":"Explain teamwork or problem-solving.","correct":0,"options":[["We worked in groups to solve simple challenges.","Correct: it develops the team-building activity."],["We refused to work together or solve any group challenges.","This does not correctly develop the required seminar report section. Try again."],["Everyone helped their group members finish the tasks.","This does not correctly develop the required seminar report section. Try again."]]},{"tag":"POINT 2 — Second point","question":"What different second activity took place?","hint":"Use a different public-speaking activity.","correct":1,"options":[["Another activity was attending an examination alone.","This does not correctly develop the required seminar report section. Try again."],["Another activity was a public-speaking session.","Correct: this introduces a different second activity."],["Another reason was that the teachers gave clear instructions.","This does not correctly develop the required seminar report section. Try again."]]},{"tag":"POINT 2 — One elaboration","question":"How was the public-speaking activity carried out?","hint":"Explain the speech or presentation practice.","correct":2,"options":[["Each prefect avoided speaking in front of others.","This does not correctly develop the required seminar report section. Try again."],["As a result, all prefects could take part in the activities easily.","This does not correctly develop the required seminar report section. Try again."],["Each prefect gave a short speech to practise speaking confidently.","Correct: it develops the public-speaking activity."]]}]},{"title":"Reasons for Success","bullet":"why it was successful / unsuccessful","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the reasons for success?","hint":"Introduce more than one reason for the seminar's success.","correct":0,"options":[["Furthermore, there were several reasons the seminar was successful.","Correct: this opening introduces reasons for success."],["Furthermore, there were several reasons the seminar was unsuccessful.","This does not correctly develop the required seminar report section. Try again."],["Finally, there are several ways to improve the seminar.","This does not correctly develop the required seminar report section. Try again."]]},{"tag":"POINT 1 — Main point","question":"What was the first reason for success?","hint":"Focus on teamwork or teacher guidance.","correct":1,"options":[["One reason was that the students refused to work together.","This does not correctly develop the required seminar report section. Try again."],["One reason was that students worked well together.","Correct: this is one reason for success."],["One suggestion is to allow more time for team-building games.","This does not correctly develop the required seminar report section. Try again."]]},{"tag":"POINT 1 — One elaboration","question":"How did this first reason help participants?","hint":"Explain how the first reason helped prefects finish the tasks.","correct":2,"options":[["Everyone ignored group members who needed help.","This does not correctly develop the required seminar report section. Try again."],["This would give every student a chance to join.","This does not correctly develop the required seminar report section. Try again."],["Everyone helped their group members finish the tasks.","Correct: this explains the first reason."]]},{"tag":"POINT 2 — Second point","question":"What different second reason made the seminar successful?","hint":"Describe a second different reason for success.","correct":0,"options":[["Another reason was that the teachers gave clear instructions.","Correct: this identifies a second reason."],["Another reason was that teachers provided no instructions.","This does not correctly develop the required seminar report section. Try again."],["Another suggestion is to rectify the shortage of drinking water.","This does not correctly develop the required seminar report section. Try again."]]},{"tag":"POINT 2 — One elaboration","question":"How did this second factor contribute to success?","hint":"Explain how the second reason increased involvement or support.","correct":1,"options":[["As a result, none of the prefects could take part in the activities.","This does not correctly develop the required seminar report section. Try again."],["As a result, all prefects could take part in the activities easily.","Correct: this develops the second reason."],["The organisers should prepare enough bottles for all participants.","This does not correctly develop the required seminar report section. Try again."]]}]},{"title":"Suggestions for Improvement","bullet":"how to improve the event in the future","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces ways to improve the seminar?","hint":"Introduce two ways to improve future seminars.","correct":2,"options":[["Finally, there are several ways to cancel the seminar.","This does not correctly develop the required seminar report section. Try again."],["To begin with, there were several activities during the seminar.","This does not correctly develop the required seminar report section. Try again."],["Finally, there are several ways to improve the seminar.","Correct: this introduces the suggestions."]]},{"tag":"POINT 1 — Main point","question":"What is the first suggestion for improvement?","hint":"Suggest allowing more time for practice or games.","correct":0,"options":[["One suggestion is to allow more time for team-building games.","Correct: this is the first improvement."],["One suggestion is to remove all the team-building games.","This does not correctly develop the required seminar report section. Try again."],["One activity was a team-building game.","This does not correctly develop the required seminar report section. Try again."]]},{"tag":"POINT 1 — One elaboration","question":"How would the first suggestion help prefects?","hint":"Explain what additional time would achieve.","correct":1,"options":[["This would prevent students from participating in activities.","This does not correctly develop the required seminar report section. Try again."],["This would give every student a chance to join.","Correct: this explains how the first improvement helps."],["We worked in groups to solve simple challenges.","This does not correctly develop the required seminar report section. Try again."]]},{"tag":"POINT 2 — Second point","question":"What other issue should the organisers address?","hint":"Discuss the shortage of drinking water.","correct":2,"options":[["Another suggestion is to stop giving drinking water to prefects.","This does not correctly develop the required seminar report section. Try again."],["Another activity was a public-speaking session.","This does not correctly develop the required seminar report section. Try again."],["Another suggestion is to rectify the shortage of drinking water.","Correct: this identifies the water shortage."]]},{"tag":"POINT 2 — One elaboration","question":"How would extra water provision help the participants?","hint":"Explain how enough water improves comfort and concentration.","correct":0,"options":[["The organisers should prepare enough bottles for all participants.","Correct: this explains how the second improvement benefits the prefects."],["The organisers should provide fewer water bottles than the number of participants.","This does not correctly develop the required seminar report section. Try again."],["Each prefect gave a short speech to practise speaking confidently.","This does not correctly develop the required seminar report section. Try again."]]}]}];
const vocab={"rectify":["C1","membetulkan / memperbaiki sesuatu masalah"],"seminar":["B2","seminar / perjumpaan pembelajaran"],"confidently":["B2","dengan yakin"],"participants":["B2","peserta"],"organisers":["B2","penganjur"],"instructions":["B2","arahan"]};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const [level,bm]=vocab[word.toLowerCase()];return '<span class="vocab '+(level==="C1"?"c1":"b2")+'" tabindex="0" data-meaning="'+escapeHTML(bm)+'" aria-label="'+escapeHTML(word+" ("+level+"): "+bm)+'">'+word+'<span class="vocab-tooltip">'+level+' · '+escapeHTML(bm)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 3 · Report — Original Exam Task</strong><p>You recently attended a Leadership Seminar organised by your school.</p><p>As the Secretary of the Prefects&#39; Board, write a report to your principal about the event.</p><p><strong>In your report, you should include:</strong></p><ul><li>what activities were carried out during the seminar</li><li>why it was successful / unsuccessful</li><li>how to improve the event in the future</li></ul><p><strong>Write your report.</strong></p></div>";
const titleReminder=()=>"<div class=\"urgent-reminder\" role=\"note\"><div class=\"urgent-heading\">📕 STOP! WRITE THIS FIRST!</div><p>Write the <strong>REPORT HEADER</strong> (To / From / Subject), <strong>Introduction</strong> heading and a <strong>TWO-SENTENCE INTRODUCTION</strong> in your exercise book.</p><div class=\"essay-title\" style=\"font-size:1rem;text-align:left\">To: Nur Aisyah Rahman, Principal of SMK Tun Sri Lanang<br>From: Tan Mei Ling, Secretary of the Prefects' Board of SMK Tun Sri Lanang<br>Subject: Report on the Leadership Seminar<br><br>Introduction</div><p class=\"urgent-note\">Introduce the Leadership Seminar and preview its activities, reasons for success and suggestions to improve future events.</p></div>";
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">🎓 Leadership Seminar Report · EASY</span><span class="small">A2–B1 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Build a complete SPM report in your exercise book.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the report header, Introduction heading and introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over underlined vocabulary on a computer, or tap the word on your phone to see its meaning.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Report conclusion</span></div><h2>Write Your Report Conclusion</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR REPORT CONCLUSION!</div><p>Write a <strong>TWO-SENTENCE REPORT CONCLUSION</strong>: (1) summarise the success of the Leadership Seminar, and (2) recommend future seminars with the suggested improvements.</p><p class="urgent-note">✍️ Complete your report conclusion under the Conclusion heading before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my report conclusion in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full report in your notebook</strong><p>It should contain your To/From/Subject header, introduction, three body paragraphs and report conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and report conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — give ONE elaboration for each point.</p>':'<p class="small">One main point — add TWO elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Report Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
