<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 2 · NORMAL</span><h1>Elaboration Builder</h1><p class="subtitle">🎬 English-Language Movies · Guided Essay</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"A Useful Entertainment Medium","bullet":"state one type of entertainment media that helps your learning","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which topic sentence introduces ONE useful entertainment medium?","hint":"Preview the question's first bullet without giving the point yet.","correct":0,"options":[["To begin with, there is one form of entertainment media that I find particularly useful for learning.","The opening presents the exact media-and-learning focus before naming Point 1."],["To begin with, there are countless films available online for teenagers.","The option does not develop the specific idea required at this step."],["To begin with, there are many ways teenagers can communicate online.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 1 — Main point","question":"Which specific form of media is selected for learning?","hint":"Keep the same entertainment medium throughout the whole essay.","correct":2,"options":[["My preferred choice is short social-media advertisements for new products.","The option does not develop the specific idea required at this step."],["My preferred choice is printed examination practice books from the school library.","This repeats the wrong point, changes the topic, or makes an unsupported claim."],["My preferred choice is English-language movies, especially films with clear dialogue.","The main point clearly identifies English-language films with dialogue."]]},{"tag":"POINT 1 — Elaboration 1 of 4","question":"HOW do the selected movies support learning?","hint":"Focus on natural conversations and engaging storylines.","correct":1,"options":[["These movies expose me to interesting backgrounds but not to spoken English.","The option does not develop the specific idea required at this step."],["These movies expose me to natural conversations while keeping me interested through engaging storylines.","Natural dialogue and storylines explain why these films are useful."],["These movies expose me to the latest film reviews and celebrity gossip.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 1 — Elaboration 2 of 4","question":"Which example shows useful viewing with subtitles?","hint":"Connect animated films, subtitles and completed homework.","correct":0,"options":[["For instance, I sometimes watch animated films with English subtitles after completing my homework.","Animated films with subtitles provide a concrete example of purposeful viewing."],["For instance, I sometimes collect movie posters to decorate my room.","The option does not develop the specific idea required at this step."],["For instance, I sometimes compare cinema ticket discounts after school.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 1 — Elaboration 3 of 4","question":"HOW can an unfamiliar expression become a learning opportunity?","hint":"Think about pausing and recording an unfamiliar expression.","correct":2,"options":[["Whenever I hear an unfamiliar expression, I ignore the dialogue and continue watching.","The option does not develop the specific idea required at this step."],["Whenever I hear an unfamiliar expression, I turn off the sound to avoid listening.","This repeats the wrong point, changes the topic, or makes an unsupported claim."],["Whenever a character uses an unfamiliar expression, I pause the scene to note its meaning and pronunciation.","Pausing to note meaning and pronunciation actively develops learning."]]},{"tag":"POINT 1 — Elaboration 4 of 4","question":"Which result follows from purposeful movie-watching?","hint":"Show that entertainment also supports English development.","correct":1,"options":[["Consequently, I will never need to study English in school again.","The option does not develop the specific idea required at this step."],["Consequently, watching movies becomes an enjoyable activity that also supports my English learning.","The outcome connects entertainment with English learning."],["Consequently, my English learning will never require any effort.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]}]},{"title":"How Movies Support My Academic Progress","bullet":"explain how this media helps you in your studies","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening previews movies' contribution to studying?","hint":"Preview several academic benefits before naming one.","correct":0,"options":[["Furthermore, there are various ways English-language movies contribute to my academic progress.","The opening previews academic benefits rather than just enjoyment."],["Furthermore, English-language movies have many famous actors and directors.","The option does not develop the specific idea required at this step."],["Furthermore, my classmates and I enjoy spending weekends at the cinema.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 1 — Main point","question":"What is the FIRST academic benefit of these films?","hint":"Explain both expansion and consolidation of vocabulary.","correct":2,"options":[["One major benefit is that films help me choose the most popular actors.","The option does not develop the specific idea required at this step."],["One major benefit is that I can learn about cinema ticket prices.","This repeats the wrong point, changes the topic, or makes an unsupported claim."],["One major benefit is that they help me expand and consolidate my vocabulary.","Vocabulary growth and consolidation are clear study benefits."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"How can listening to expressions CONSOLIDATE vocabulary?","hint":"Focus on words used in context rather than rote memorisation.","correct":1,"options":[["By hearing expressions, I should memorise them without considering their meanings.","The option does not develop the specific idea required at this step."],["By hearing expressions used in different situations, I can understand their meanings instead of simply memorising definitions.","Learning meanings in context explains the vocabulary improvement."],["By hearing expressions, I can focus on the actors' appearance rather than language.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which example shows applying new phrases actively?","hint":"Think about writing useful phrases and making your own sentences.","correct":0,"options":[["For example, I keep a notebook of useful phrases and practise using them in my own sentences.","Writing phrases and using them in sentences shows active practice."],["For example, I record the prices of cinema snacks in my notebook.","The option does not develop the specific idea required at this step."],["For example, I write the film title in my notebook without new phrases.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 2 — Different benefit or method","question":"Which SECOND benefit is separate from vocabulary development?","hint":"Choose listening comprehension, not another vocabulary benefit.","correct":2,"options":[["Another benefit is expanding my vocabulary through new dialogue.","The option does not develop the specific idea required at this step."],["Another benefit is learning more new vocabulary from the subtitles.","This repeats the wrong point, changes the topic, or makes an unsupported claim."],["Another benefit is the improvement of my listening comprehension.","Listening comprehension is a distinct second benefit."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"How can listening help a learner DISCERN details?","hint":"Think about accents, speed and understanding details.","correct":1,"options":[["Listening to different accents helps me memorise the name of every actor.","The option does not develop the specific idea required at this step."],["Listening to different accents and speaking speeds helps me discern important details during conversations.","Listening to accents and pace helps the student discern important details."],["Listening to different accents helps me ignore important details.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"Which result is reasonable for classroom listening?","hint":"Connect listening practice to greater confidence.","correct":0,"options":[["As a result, I can follow classroom listening exercises more confidently.","The result relates directly to classroom listening tasks."],["As a result, English listening examinations will never be challenging again.","The option does not develop the specific idea required at this step."],["As a result, I will never need to listen to my teacher again.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]}]},{"title":"Measures to Manage Screen Time","bullet":"suggest ways students can control their screen time","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces responsible screen-time measures?","hint":"Preview measures to manage screen time.","correct":2,"options":[["Finally, there are numerous entertaining movies students can stream.","The option does not develop the specific idea required at this step."],["Finally, there are several kinds of entertainment that teenagers enjoy.","This repeats the wrong point, changes the topic, or makes an unsupported claim."],["Finally, there are several practical measures students can take to manage screen time responsibly.","The opening previews responsible viewing strategies."]]},{"tag":"POINT 1 — Main point","question":"What is the FIRST method of managing viewing time?","hint":"Think about establishing a daily viewing schedule.","correct":1,"options":[["One useful method is to watch films continuously until midnight.","The option does not develop the specific idea required at this step."],["One useful method is to establish a daily viewing schedule.","A daily viewing schedule is a practical first point."],["One useful method is to watch every newly released movie immediately.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"WHY should students finish their assignments before watching?","hint":"Explain how completing assignments first protects learning.","correct":0,"options":[["By completing assignments before watching films, students can prevent entertainment from interfering with their studies.","Completing assignments first avoids disruption to study."],["By watching films before homework, students can avoid difficult assignments.","The option does not develop the specific idea required at this step."],["By ignoring homework until late at night, students can spend more time online.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which example shows a balanced schedule?","hint":"Choose a sensible school-night limit and weekends for full films.","correct":2,"options":[["For example, they may watch films for several hours on school nights.","The option does not develop the specific idea required at this step."],["For example, they may watch a full film during a school lesson.","This repeats the wrong point, changes the topic, or makes an unsupported claim."],["For example, they may limit movie-watching to 30 minutes on school nights and save full films for weekends.","Short school-night sessions and weekend films give a concrete rule."]]},{"tag":"POINT 2 — Different benefit or method","question":"Which SECOND method differs from scheduling?","hint":"Pick a device setting rather than repeating the schedule.","correct":1,"options":[["Another method is to establish a separate viewing timetable.","The option does not develop the specific idea required at this step."],["Another method is to activate screen-time limits on their devices.","Device screen-time limits are a different second method."],["Another method is to finish all homework before watching any film.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW do the device settings control entertainment apps?","hint":"Think about reminders or limits that block apps.","correct":0,"options":[["These settings provide reminders or block entertainment apps once the chosen time has been reached.","Automated reminders or blocks explain how the setting works."],["These settings encourage pupils to watch more episodes without stopping.","The option does not develop the specific idea required at this step."],["These settings display advertisements for new movie releases.","This repeats the wrong point, changes the topic, or makes an unsupported claim."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"Which result of curtailing viewing is realistic?","hint":"Show how less unnecessary viewing leaves time for other priorities.","correct":2,"options":[["Accordingly, students can ignore homework and focus entirely on movies.","The option does not develop the specific idea required at this step."],["Accordingly, students will no longer require revision, exercise or sleep.","This repeats the wrong point, changes the topic, or makes an unsupported claim."],["Accordingly, students can curtail unnecessary viewing and make more time for revision, exercise and rest.","Curtailing unnecessary viewing creates time for revision, exercise and rest."]]}]}];
const vocab={"consolidate":["C1","mengukuhkan / memantapkan"],"discern":["C1","mengenal pasti / membezakan dengan teliti"],"curtail":["C1","mengehadkan / mengurangkan"],"comprehension":["B2","kefahaman"],"pronunciation":["B2","sebutan"],"storylines":["B2","jalan cerita"],"subtitles":["B2","sari kata"],"responsibly":["B2","secara bertanggungjawab"],"interfering":["B2","mengganggu"],"efficiently":["B2","dengan cekap"]};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const [level,bm]=vocab[word.toLowerCase()];return '<span class="vocab '+(level==="C1"?"c1":"b2")+'" tabindex="0" data-meaning="'+escapeHTML(bm)+'" aria-label="'+escapeHTML(word+" ("+level+"): "+bm)+'">'+word+'<span class="vocab-tooltip">'+level+' · '+escapeHTML(bm)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 2 · Guided Essay — Original Exam Task</strong><p>Your class has been discussing how entertainment media affects students&#39; learning. Your teacher has asked you to write an essay about it.</p><p><strong>In your essay, you should:</strong></p><ul><li>state one type of entertainment media that helps your learning</li><li>explain how this media helps you in your studies</li><li>suggest ways students can control their screen time</li></ul></div>";

const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">🎬 Entertainment & Learning · NORMAL</span><span class="small">B1–B2 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Develop a richer SPM guided essay, one meaningful sentence at a time.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the essay title and introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over B2 vocabulary (teal) and C1 vocabulary (purple) on a computer, or tap the underlined words on your phone.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';

}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Conclusion</span></div><h2>Write Your Conclusion</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR CONCLUSION!</div><p>Write a <strong>THREE-SENTENCE CONCLUSION</strong>: (1) summarise how films support learning, (2) a hope about balance, and (3) a practical suggestion to students, parents or teachers.</p><p class="urgent-note">✍️ Complete your conclusion before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my conclusion in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';

}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full essay in your notebook</strong><p>It should contain your title, introduction, all three developed body paragraphs and conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — develop it with four detailed elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
