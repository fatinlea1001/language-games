const tasks=[{"title":"One Entertainment Medium That Helps Learning","bullet":"state one of entertainment media that helps your learning","plural":false,"steps":[{"tag":"POINT — One entertainment medium","question":"Which opening directly answers the FIRST bullet?","hint":"Name one entertainment medium that you use for learning.","correct":1,"options":[["To begin with, YouTube is popular because teenagers enjoy watching funny videos.","Popularity and fun do not identify a medium's learning benefit."],["To begin with, one entertainment medium that helps my learning is YouTube.","This directly develops the required idea with a clear, relevant detail."],["To begin with, television helps students relax after their lessons at school.","Television is a different medium from the chosen YouTube example."]]},{"tag":"ELABORATION 1 — Description","question":"What do you use YouTube to watch?","hint":"Choose an action that involves educational content.","correct":0,"options":[["I watch lessons online.","This directly develops the required idea with a clear, relevant detail."],["I watch cartoons for fun.","Cartoons for fun do not explain using videos for learning."],["I play exciting online games.","Online gaming does not develop the selected study medium."]]},{"tag":"ELABORATION 2 — Example","question":"Which EXAMPLE shows what you learn?","hint":"Look for a realistic example from a school subject.","correct":2,"options":[["For example, science clips feature famous actors discussing their favourite movies.","Actors discussing movies are not a science experiment example."],["For example, funny videos show teenagers dancing during their school holidays.","Dancing videos do not illustrate science learning."],["For example, science clips show simple experiments.","This directly develops the required idea with a clear, relevant detail."]]},{"tag":"ELABORATION 3 — Additional detail","question":"Which detail makes the videos more engaging?","hint":"Explain what helps you focus on the lesson.","correct":1,"options":[["Besides, pictures make my phone colourful.","Phone colours are not a benefit for understanding lessons."],["Besides, pictures hold my attention.","This directly develops the required idea with a clear, relevant detail."],["Besides, pictures help my camera work.","Camera performance is unrelated to studying."]]},{"tag":"ELABORATION 4 — Result","question":"Which RESULT is connected to learning?","hint":"Think of a positive feeling about studying.","correct":0,"options":[["Therefore, studying feels enjoyable.","This directly develops the required idea with a clear, relevant detail."],["Therefore, my phone becomes more useful.","Phone usefulness does not describe enjoyment of studying."],["Therefore, watching videos feels exciting.","The point is learning, not entertainment alone."]]}]},{"title":"How This Media Helps My Studies","bullet":"explain how this media helps you in your studies","plural":false,"steps":[{"tag":"POINT — How it helps studies","question":"Which opening addresses the SECOND bullet?","hint":"Explain how the video makes difficult learning easier.","correct":2,"options":[["Furthermore, this media helps my studies because videos are always available online.","Being available online does not explain how difficult lessons become clearer."],["Furthermore, this media makes me happy when I watch my favourite entertainers.","Enjoying entertainers is not the educational effect requested."],["Furthermore, this media helps me in my studies by explaining difficult topics.","This directly develops the required idea with a clear, relevant detail."]]},{"tag":"ELABORATION 1 — Explanation","question":"What can you do when a video is difficult?","hint":"What can a student do when they do not understand?","correct":0,"options":[["I can pause videos when confused.","This directly develops the required idea with a clear, relevant detail."],["I pause videos to answer messages.","Answering messages does not help understand a difficult explanation."],["I pause videos to change songs.","Changing songs does not assist revision."]]},{"tag":"ELABORATION 2 — Additional action","question":"What is a useful NEXT step?","hint":"Consider what to repeat during revision.","correct":1,"options":[["Then, I replay funny moments.","Funny moments do not help students review confusing lesson content."],["Then, I replay difficult parts.","This directly develops the required idea with a clear, relevant detail."],["Then, I replay the advertisements.","Advertisements do not explain the school topic."]]},{"tag":"ELABORATION 3 — Example","question":"Which example supports revision before tests?","hint":"Choose a practical examination-preparation example.","correct":2,"options":[["For instance, I watch comedy shows before exams.","Comedy shows do not give an example of revising grammar."],["For instance, I discuss movies during my breaks.","Movie conversations are not specific revision for a test."],["For instance, I revise grammar before tests.","This directly develops the required idea with a clear, relevant detail."]]},{"tag":"ELABORATION 4 — Result","question":"What learning RESULT follows?","hint":"Think of remembering lesson content.","correct":0,"options":[["As a result, I remember important ideas better.","This directly develops the required idea with a clear, relevant detail."],["As a result, I can watch videos more often.","Watching more videos is not the same as remembering information."],["As a result, my phone uses more data.","Using data is not a positive study result."]]}]},{"title":"Ways Students Can Control Screen Time","bullet":"suggest ways students can control their screen time","plural":true,"steps":[{"tag":"POINT 1 — Daily limits","question":"Which FIRST way helps control screen time?","hint":"Choose a limit that prevents spending too long online.","correct":1,"options":[["Finally, students can control their screen time by buying better phones.","Buying a better phone does not limit time spent on screens."],["Finally, students can control their screen time by setting daily limits.","This directly develops the required idea with a clear, relevant detail."],["Finally, students can control their screen time by watching shorter movies.","Watching shorter films does not establish a clear daily limit."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"How can phone timers help?","hint":"Look for a reminder that encourages stopping.","correct":0,"options":[["Phone timers remind them to stop watching.","This directly develops the required idea with a clear, relevant detail."],["Phone timers help them choose videos.","Choosing videos is not the same as stopping when the limit is reached."],["Phone timers show the current time.","A clock alone does not remind students to stop."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"What RESULT can a timer achieve?","hint":"Why are time limits helpful?","correct":2,"options":[["This helps them finish more videos.","Finishing more videos is not the goal of screen-time control."],["This makes their devices run smoothly.","Device performance is not a reason to limit browsing."],["This prevents hours of unnecessary browsing.","This directly develops the required idea with a clear, relevant detail."]]},{"tag":"POINT 2 — Timetable","question":"Which SECOND way is different from daily limits?","hint":"Find a second method that is different from timers.","correct":1,"options":[["Another way is to watch videos together.","Watching together does not necessarily manage time."],["Another way is to follow a timetable.","This directly develops the required idea with a clear, relevant detail."],["Another way is to use brighter screens.","Screen brightness does not establish a schedule."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"How should students use the timetable?","hint":"How should homework fit into the routine?","correct":0,"options":[["They should finish homework before watching videos.","This directly develops the required idea with a clear, relevant detail."],["They should watch television while doing homework.","Multitasking with television may distract students from homework."],["They should change their wallpapers before studying.","Wallpaper changes do not create a study routine."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What benefit may follow from this routine?","hint":"What is a positive result of managing study and rest?","correct":2,"options":[["Consequently, they can watch more videos.","Watching more videos contradicts the aim of reducing screen time."],["Consequently, they will use newer apps.","Newer apps do not demonstrate better balance."],["Consequently, they have enough time to rest.","This directly develops the required idea with a clear, relevant detail."]]}]}];
const vocab={"entertainment":{"level":"B2","meaning":"hiburan"},"medium":{"level":"B2","meaning":"saluran atau bahan perantaraan"},"educational":{"level":"B2","meaning":"berkaitan pendidikan"},"experiments":{"level":"B2","meaning":"uji kaji"},"attention":{"level":"B2","meaning":"perhatian"},"confused":{"level":"B2","meaning":"keliru"},"revise":{"level":"B2","meaning":"mengulang kaji"},"screen time":{"level":"B2","meaning":"masa penggunaan skrin"},"limits":{"level":"B2","meaning":"had atau batas"},"unnecessary":{"level":"B2","meaning":"tidak perlu"},"timetable":{"level":"B2","meaning":"jadual waktu"},"consequently":{"level":"B2","meaning":"oleh itu atau akibatnya"},"balance":{"level":"B2","meaning":"keseimbangan"}};
const root=document.getElementById("app");

const examTask=()=>"<div class=\"exam\"><strong>Question 2 · Kedah</strong><p>Your class has been discussing how entertainment media affects students’ learning. Your teacher has asked you to write an essay about it.</p><p><strong>In your essay, you should:</strong></p><ul><li>state one of entertainment media that helps your learning</li><li>explain how this media helps you in your studies</li><li>suggest ways students can control their screen time</li></ul><p><strong>Use all the notes above and give reasons for your point of view.</strong></p><p><strong>Write your essay in 125 - 150 words in an appropriate style.</strong></p></div>";

const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — add four elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<div class="choice-card '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" data-choice="'+i+'"><button type="button" class="choice-pick" data-action="choose" data-choice="'+i+'" aria-label="Select option '+String.fromCharCode(65+i)+': '+escapeHTML(o[0])+'" aria-pressed="'+(selected===i)+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span></button><div class="choice-text">'+withVocab(o[0])+'</div></div>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT "),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(isPoint?'Choose a new point':'Develop the point')+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const card=e.target.closest(".choice-card");if(card&&!state.checked){state.selected=Number(card.dataset.choice);render();return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
document.addEventListener("click",e=>{if(!e.target.closest(".vocab"))root.querySelectorAll(".vocab.is-open").forEach(el=>el.classList.remove("is-open"));});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
