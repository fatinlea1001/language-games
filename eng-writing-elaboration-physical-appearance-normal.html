rmine examination scores."],["Moreover, personal grooming reveals someone's complete personality.","Appearance cannot reveal someone's entire personality."],["Moreover, personal grooming demonstrates self-discipline.","This is relevant, logical and develops the requested idea appropriately."]]},{"tag":"ELABORATION 4 — Result","question":"What realistic RESULT ends this paragraph?","hint":"Think about feeling ready to meet others.","correct":0,"options":[["Consequently, they may seem more approachable.","This is relevant, logical and develops the requested idea appropriately."],["Consequently, they become popular with everyone.","Appearance cannot make everyone popular."],["Consequently, they no longer face negative comments.","Grooming cannot prevent every negative comment."]]}]},{"title":"Effects on Self-Confidence","bullet":"explain how appearance can affect self-confidence","plural":false,"steps":[{"tag":"POINT — Self-confidence","question":"Which opening addresses self-confidence directly?","hint":"Mention the second bullet and its effect.","correct":1,"options":[["Furthermore, appearance determines whether teenagers will excel in all school examinations.","Appearance does not determine examination outcomes."],["Furthermore, appearance can affect self-confidence, especially among teenagers.","This is relevant, logical and develops the requested idea appropriately."],["Furthermore, self-confidence depends entirely on owning costly clothing and designer accessories.","Confidence depends on much more than clothes."]]},{"tag":"ELABORATION 1 — Effect","question":"What emotional EFFECT is realistic?","hint":"Consider how someone feels when tidy.","correct":0,"options":[["Feeling presentable may reduce social anxiety.","This is relevant, logical and develops the requested idea appropriately."],["Feeling fashionable guarantees lasting personal happiness.","Fashion cannot guarantee happiness."],["Feeling attractive removes the need for friendships.","Confidence does not remove the need for friendships."]]},{"tag":"ELABORATION 2 — Example","question":"Which example demonstrates growing self-confidence?","hint":"Think about classroom participation.","correct":2,"options":[["For instance, students may earn perfect examination results.","Looking confident does not promise top marks."],["For instance, students might avoid talking during discussions.","Avoiding discussions does not show self-confidence."],["For instance, students may contribute more during discussions.","This is relevant, logical and develops the requested idea appropriately."]]},{"tag":"ELABORATION 3 — Contrast","question":"What contrasting effect can appearance-related comments have?","hint":"Not all remarks about looks are kind.","correct":1,"options":[["Nevertheless, fashionable outfits prevent all cruel remarks.","Fashion cannot stop all hurtful comments."],["Nevertheless, hurtful remarks can undermine their confidence.","This is relevant, logical and develops the requested idea appropriately."],["Nevertheless, compliments always increase everyone's confidence.","People respond differently to compliments."]]},{"tag":"ELABORATION 4 — Result","question":"Which lesson concludes this explanation?","hint":"Think of treating people fairly.","correct":0,"options":[["Therefore, self-worth should not depend on looks.","This is relevant, logical and develops the requested idea appropriately."],["Therefore, classmates should constantly compare their looks.","Constant comparisons may undermine confidence."],["Therefore, outward beauty should determine genuine friendships.","Friendship should not be based on appearance."]]}]},{"title":"Ways to Maintain Physical Appearance","bullet":"suggest ways to maintain physical appearance","plural":true,"steps":[{"tag":"POINT 1 — Hygiene","question":"Which FIRST way supports physical appearance safely?","hint":"Think of cleanliness rather than fashion trends.","correct":2,"options":[["Finally, people can maintain physical appearance by copying every fashion trend they encounter.","Fashion trends do not ensure good hygiene."],["Finally, people can maintain physical appearance by applying digital filters to every photograph.","Digital filters cannot improve real hygiene."],["Finally, people can maintain physical appearance through consistent hygiene.","This is relevant, logical and develops the requested idea appropriately."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"Which example illustrates good hygiene?","hint":"Think of a regular personal-care activity.","correct":0,"options":[["For example, clean clothing creates a good impression.","This is relevant, logical and develops the requested idea appropriately."],["For example, luxury outfits guarantee good personal hygiene.","Expensive clothing does not ensure cleanliness."],["For example, expensive accessories keep skin completely clean.","Accessories cannot replace hygiene."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which SECOND hygiene detail develops this method?","hint":"Consider clean clothing.","correct":1,"options":[["Similarly, luxurious perfumes make regular washing unnecessary.","Perfume cannot replace washing regularly."],["Similarly, regular washing helps them feel presentable.","This is relevant, logical and develops the requested idea appropriately."],["Similarly, expensive cosmetics replace ordinary daily cleanliness.","Cosmetics cannot replace personal cleanliness."]]},{"tag":"POINT 2 — Healthy habits","question":"Which SECOND method is different from hygiene?","hint":"Think of everyday physical well-being.","correct":2,"options":[["Another way is to compare everyone's looks online.","Comparing looks does not develop a healthy routine."],["Another way is to follow seasonal clothing trends.","Seasonal fashion trends are not health habits."],["Another way is to adopt healthy routines.","This is relevant, logical and develops the requested idea appropriately."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"Which const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — develop it with four detailed elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<div class="choice-card '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" data-choice="'+i+'"><button type="button" class="choice-pick" data-action="choose" data-choice="'+i+'" aria-label="Select option '+String.fromCharCode(65+i)+': '+escapeHTML(o[0])+'" aria-pressed="'+(selected===i)+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span></button><div class="choice-text">'+withVocab(o[0])+'</div></div>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT "),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(isPoint?'Choose a new point':'Develop the point')+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const card=e.target.closest(".choice-card");if(card&&!state.checked){state.selected=Number(card.dataset.choice);render();return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
document.addEventListener("click",e=>{if(!e.target.closest(".vocab"))root.querySelectorAll(".vocab.is-open").forEach(el=>el.classList.remove("is-open"));});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
