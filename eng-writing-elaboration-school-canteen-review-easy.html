const tasks=[{"title":"Favourite Canteen Feature","bullet":"what do you like the most about the canteen?","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which sentence opens the favourite-feature paragraph?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":1,"options":[["To begin with, there are many different shops near our school.","Nearby eateries are outside the review's focus on the upgraded school canteen."],["To begin with, there is one thing I like the most about the new school canteen.","This directly develops the favourite feature and its benefit in the intended sentence order."],["To begin with, pupils can visit the canteen before their first lesson.","Opening hours do not explain what the writer likes most about the canteen."]]},{"tag":"POINT 1 — First point","question":"Which sentence gives one favourite feature?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":2,"options":[["My favourite feature is the new colour of the walls.","Wall colour is a possible feature, but the next sentences develop the seating area."],["My favourite feature is the range of cold drinks.","Drinks would lead to a menu discussion rather than the seating-area explanation."],["My favourite feature is its new seating area.","This directly develops the favourite feature and its benefit in the intended sentence order."]]},{"tag":"POINT 1 — Elaboration 1 of 4","question":"Why are the new tables useful?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":0,"options":[["This is because the tables are bigger and pupils can sit comfortably.","This directly develops the favourite feature and its benefit in the intended sentence order."],["This is because the new tables have bright colours.","Bright table colours explain appearance, not comfort or seating space."],["This is because the counters are close to the school entrance.","Counter placement addresses the second bullet about convenience."]]},{"tag":"POINT 1 — Elaboration 2 of 4","question":"Which example supports the seating area?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":1,"options":[["For example, I can try several types of noodles at recess.","Types of noodles illustrate menu variety, not the seating area."],["For example, I can have lunch with four of my friends at one table.","This directly develops the favourite feature and its benefit in the intended sentence order."],["For example, I can buy a drink before my next class.","Buying a drink does not show how pupils benefit from bigger tables."]]},{"tag":"POINT 1 — Elaboration 3 of 4","question":"Which sentence explains how wider spaces help?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":2,"options":[["The spaces between the tables help students read the menu.","Reading the menu has no connection with preventing collisions between tables."],["The space near the tables helps workers sell more drinks.","Space between tables would not directly affect drink sales."],["The wide spaces between the tables also help rectify the problem of pupils bumping into one another.","This directly develops the favourite feature and its benefit in the intended sentence order."]]},{"tag":"POINT 1 — Elaboration 4 of 4","question":"Which sentence gives a realistic result?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":0,"options":[["As a result, eating at the canteen is more enjoyable.","This directly develops the favourite feature and its benefit in the intended sentence order."],["As a result, nobody will need to queue for meals again.","Improved seating does not mean food queues will disappear."],["As a result, all students can eat without paying.","Bigger tables do not make meals free."]]}]},{"title":"Convenience for Pupils","bullet":"do you think it is convenient for pupils? Why?","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening addresses the question about convenience?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":0,"options":[["Furthermore, there is one main reason why I think the upgraded canteen is convenient for pupils.","This directly develops the convenience of the counters in the intended sentence order."],["Furthermore, there are many delicious foods at school.","Food taste does not directly introduce the question about convenience."],["Furthermore, the canteen needs a few improvements.","This belongs to the suggestions bullet rather than the convenience evaluation."]]},{"tag":"POINT 1 — First point","question":"Which reason makes buying food convenient?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":1,"options":[["One reason is that the canteen walls are brighter.","Brighter walls concern appearance, not how pupils reach counters."],["One reason is that the food counters are easier to reach.","This directly develops the convenience of the counters in the intended sentence order."],["One reason is that the new seats are more colourful.","Seat decoration does not explain the practical counter arrangement."]]},{"tag":"POINT 1 — Elaboration 1 of 4","question":"How do the food counters help pupils?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":2,"options":[["Pupils can look at the menu while waiting for their turns.","Reading the menu does not demonstrate how clear lines prevent pushing."],["Pupils can sit at the tables before they buy their food.","Sitting down before buying food is not an explanation of organised queues."],["Pupils can stand in clear lines to buy food without pushing one another.","This directly develops the convenience of the counters in the intended sentence order."]]},{"tag":"POINT 1 — Elaboration 2 of 4","question":"Which example explains different counters?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":0,"options":[["For example, I can order noodles while my friends buy drinks at another counter.","This directly develops the convenience of the counters in the intended sentence order."],["For example, I can sit beside my friends while eating.","Sitting with friends describes the dining area, not separate counters."],["For example, I can see new posters beside the entrance.","Photos near the entrance do not illustrate convenient food ordering."]]},{"tag":"POINT 1 — Elaboration 3 of 4","question":"Why are signs above the counters helpful?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":1,"options":[["The signs make the walls look more colourful.","Attractive wall colours do not help pupils locate their desired counters."],["The signs above the counters also help us find what we want quickly.","This directly develops the convenience of the counters in the intended sentence order."],["The signs explain the school's rules about uniforms.","Uniform rules do not guide pupils to food and drink counters."]]},{"tag":"POINT 1 — Elaboration 4 of 4","question":"What result follows from easier ordering?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":2,"options":[["Therefore, pupils can eat for the whole lesson.","Spending lessons at the canteen is not a benefit of convenient service."],["Therefore, every pupil receives a free lunch.","Better organisation does not guarantee free meals."],["Therefore, we have enough time to finish our meals before class.","This directly develops the convenience of the counters in the intended sentence order."]]}]},{"title":"Suggested Canteen Improvements","bullet":"what other improvements should be added? Give some ideas.","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces new improvements?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":2,"options":[["Finally, the canteen already has some useful features.","Existing features do not suggest what could be added in future."],["Finally, many pupils enjoy visiting the canteen.","Pupils' enjoyment is an opinion, not an opening about improvements."],["Finally, there are several improvements that should be added to the new school canteen.","This directly develops the proposed improvements in the intended sentence order."]]},{"tag":"POINT 1 — First point","question":"Which first change should the school make?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":0,"options":[["One improvement is to offer more healthy food.","This directly develops the proposed improvements in the intended sentence order."],["One improvement is to sell only sweet drinks.","Only sweet drinks would weaken, rather than improve, healthy choices."],["One improvement is to remove all vegetable dishes.","Removing vegetables would make balanced meals less available."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"Why do pupils need healthier food?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":1,"options":[["This is because colourful food packaging looks attractive.","Colourful packaging does not explain the need for balanced meals."],["This is because pupils need balanced meals to stay active at school.","This directly develops the proposed improvements in the intended sentence order."],["This is because all pupils like exactly the same snacks.","Different pupils have different food preferences; this overgeneralises."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which example shows a balanced food menu?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":2,"options":[["For example, the canteen could sell more sugary snacks.","More sugary snacks do not support the suggested healthy-food improvement."],["For example, the canteen could offer cheap stationery.","School stationery is unrelated to nutritious canteen meals."],["For example, the canteen could sell fruit cups and vegetable dishes at reasonable prices.","This directly develops the proposed improvements in the intended sentence order."]]},{"tag":"POINT 2 — Another improvement","question":"Which second improvement is DIFFERENT?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":0,"options":[["Another improvement is to provide more rubbish bins.","This directly develops the proposed improvements in the intended sentence order."],["Another improvement is to sell more fruit cups.","More fruit cups repeat the first suggestion about food choices."],["Another improvement is to make vegetables cheaper.","Cheaper vegetables also remain within the first food suggestion."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"How will more bins help pupils?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":1,"options":[["Pupils could leave food wrappers on tables for staff.","Leaving wrappers on tables does not make good use of the new bins."],["Pupils could throw away their waste easily instead of leaving it on the tables.","This directly develops the proposed improvements in the intended sentence order."],["Pupils could place waste on the floor beside the bins.","Waste beside bins would still make the dining area messy."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What is the expected result of extra bins?","hint":"Consider the exam bullet and the sentence immediately before this one. Choose a specific and relevant detail.","correct":2,"options":[["As a result, no rubbish would ever be produced.","Extra bins can reduce litter but cannot stop waste being produced."],["As a result, classrooms would not need cleaning.","Canteen bins do not replace classroom cleaning responsibilities."],["As a result, the canteen would stay cleaner for everyone.","This directly develops the proposed improvements in the intended sentence order."]]}]}];
const vocab={"rectify":["C1","membetulkan / mengatasi sesuatu masalah"],"upgraded":["B2","dinaik taraf"],"reasonable":["B2","berpatutan"],"balanced":["B2","seimbang"]};
const root=document.getElementById("app");

const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");

const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 3 · Review — Original Exam Task</strong><p><strong>PART 3 · REVIEW</strong></p><p><strong>THE NEW SCHOOL CANTEEN</strong></p><p>You saw this notice on the bulletin board in your class.</p><p><strong>We&#39;d like to hear from you.</strong></p><p>Our school canteen has recently been upgraded. Write and tell us your thoughts.</p><p><strong>In your review, you should include:</strong></p><ul><li>what do you like the most about the canteen?</li><li>do you think it is convenient for pupils? Why?</li><li>what other improvements should be added? Give some ideas.</li></ul><p>Write your review.</p></div>";

}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — add four elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Review Closing →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
