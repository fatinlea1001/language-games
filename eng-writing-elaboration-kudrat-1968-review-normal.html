<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#194d51"><meta name="description" content="SPM Part 3 NORMAL Kudrat 1968: High Council review builder: shortened paragraphs, B2/C1 vocabulary meanings, notebook checkpoints."><title>SPM Elaboration Builder — Kudrat 1968: High Council (NORMAL)</title><style>
:root{--ink:#253943;--muted:#617580;--teal:#237f80;--deep:#194d51;--border:#dce8e9;--soft:#f2f8f8;--mint:#e6f7ed;--green:#1e7450;--red:#a3344f;--rose:#fff0f2;--gold:#b47715}
*{box-sizing:border-box}

.shell{max-width:790px;margin:auto;padding:18px 14px 42px}

.subtitle{margin:0;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--border);border-radius:24px;padding:clamp(18px,4vw,31px);box-shadow:0 13px 38px #4d857e18}
h2{font-size:1.32rem;margin:0 0 12px;line-height:1.4}h3{font-size:1.05rem;margin:0 0 10px}
p,li{line-height:1.7}p{margin:9px 0}ol,ul{padding-left:23px}
.small{color:var(--muted);font-size:.9rem}.tiny{color:var(--muted);font-size:.78rem}
.exam{background:var(--soft);border:1px solid #d0e4e4;border-radius:17px;padding:16px 18px;margin:17px 0}
.exam strong{color:var(--deep)}.exam ul{margin:8px 0}.exam li{margin:5px 0}
label.name{display:block;margin-top:23px;margin-bottom:8px;font-weight:800}
input[type=text]{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid #bedbda;background:white}
textarea{width:100%;min-height:145px;resize:vertical;padding:15px;border-radius:13px;border:2px solid #bedbda;background:white;color:var(--ink);font:inherit;line-height:1.65}

.essay p{white-space:pre-wrap}
button{font:inherit;cursor:pointer;font-weight:780;border:0;border-radius:12px;padding:13px 17px}

button:disabled{cursor:not-allowed;opacity:.45}
.primary{background:var(--teal);color:white}.primary:hover:not(:disabled){background:#176264}
.secondary{background:#e6f4f2;color:var(--deep)}.secondary:hover:not(:disabled){background:#d5eeeb}
.full{width:100%}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}.row>button{flex:1 1 180px}
.chip{display:inline-block;border-radius:99px;background:#e8f5f2;color:#286a66;font-size:.8rem;font-weight:850;padding:6px 11px}
.progress{display:flex;gap:6px;margin:12px 0 22px}.progress span{flex:1;height:8px;background:#e8f0ef;border-radius:99px}.progress .done{background:#42a58e}.progress .active{background:#d6a03b}
.point{background:#f2f8f8;border:1px solid #d6e5e4;border-radius:16px;padding:17px 18px;margin:14px 0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.065em;font-weight:850;color:#357d7a;margin-bottom:6px}
.point p{font-weight:730;font-size:1.08rem;margin:0}

.choice:hover:not(:disabled){border-color:#67ada7;background:#f5fcfa}
.choice.selected{border-color:var(--teal);background:#eaf8f5}

.choice.bad{border-color:#e3a1af;background:var(--rose)}
.letter{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:#e5f3f0;color:#266b68;display:grid;place-items:center;font-weight:850}

.copycheck h2{color:#80530d;margin-bottom:5px}

.urgent-reminder .essay-title{padding:11px 14px;background:white;border:1px solid #eeb4ba;border-radius:11px;font-size:1.12rem;font-weight:900;color:#952230;margin:13px 0}
.urgent-reminder .urgent-note{font-size:.92rem;font-weight:650;color:#863740;margin-top:10px}
.paper{background:#fff;border:1px solid #edd7a3;border-radius:14px;padding:15px 17px;margin:15px 0;line-height:1.85}
.confirm{display:flex;align-items:flex-start;gap:12px;line-height:1.55;font-weight:740;margin:20px 0 9px}
.confirm input{accent-color:var(--teal);width:21px;height:21px;flex:0 0 21px;margin:2px 0 0}
.score{font-size:clamp(2.7rem,8vw,4.1rem);font-weight:900;color:var(--teal);line-height:1.1}
.essay{background:#f8fbfa;border:1px solid #dbe9e6;border-radius:15px;padding:16px;margin:17px 0}
.essay p{margin:0 0 15px}.essay p:last-child{margin:0}
.copied{min-height:1.2em;color:var(--green);font-weight:760;font-size:.9rem}
footer{text-align:center;font-size:.77rem;color:#6a8184;margin-top:20px}
@media(max-width:480px){.shell{padding:12px 10px 30px}.panel{border-radius:18px}.choice{padding:12px}.copycheck{padding:14px}.row>button{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{body{background:white}.shell{max-width:none}header,.no-print,footer{display:none!important}.panel{border:0;box-shadow:none}.essay{border:0;padding:0}}

/* Distinct point and elaboration stages */
.segment{margin:14px 0 11px;border-radius:13px;padding:12px 14px;background:#e8f3fc;border-left:5px solid #5795c1;font-weight:820;color:#2c5878}
.segment.second{background:#fff2db;border-left-color:#d9a33d;color:#805a20}
.draft p{margin:8px 0}
.draft .built-sentence{display:block;line-height:1.7}
.essay-title{overflow-wrap:anywhere}

.vocab{position:relative;display:inline;border-bottom:2px dotted #23808b;color:#176773;font-weight:780;cursor:help;outline-offset:3px}
.vocab-tooltip{position:absolute;z-index:50;left:0;bottom:calc(100% + 7px);min-width:160px;max-width:min(230px,75vw);background:#193c49;color:white;border-radius:9px;padding:9px 11px;font:600 .81rem/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 16px #173d4930;opacity:0;visibility:hidden;pointer-events:none;text-align:left}
.vocab:hover .vocab-tooltip,.vocab:focus .vocab-tooltip,.vocab.is-open .vocab-tooltip{opacity:1;visibility:visible}
.vocab-guide{font-size:.83rem;color:#526b70;margin:7px 0 13px}
.vocab.c1{color:#7947a3;border-bottom-color:#8d63b0}.vocab.c1 .vocab-tooltip{background:#613c81}
.vocab:focus-visible{outline:2px solid #176773;border-radius:3px}
.vocab.vocab-c1{color:#74438d;border-bottom-color:#8958a9}
.vocab.vocab-c1 .vocab-tooltip{background:#49305b}
.vocab-tooltip strong{font-size:.73rem;padding:1px 5px;border-radius:4px;background:#ffffff33}
</style></head>
<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 3 · REVIEW · NORMAL</span><h1>Elaboration Builder</h1><p class="subtitle">🎬 Kudrat 1968: High Council · Movie Review</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"Movie Title and Genre","bullet":"what is the title and the genre of the movie?","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the film's TITLE and GENRE?","hint":"Open the paragraph broadly before giving details.","correct":1,"options":[["To begin with, I enjoy watching local movies with my family.","This is not the approved film detail or does not answer this part of the task."],["To begin with, two features of this film deserve attention.","Correct! This sentence fits the title and genre paragraph and develops the review logically."],["To begin with, the movie has many talented actors.","This does not support the required idea and is inconsistent with the review."]]},{"tag":"POINT 1 — Movie title","question":"Which sentence names the local movie?","hint":"The title should match the film named in the sample review.","correct":0,"options":[["One is its title, Kudrat 1968: High Council, which introduces a troubled school.","Correct! This sentence fits the title and genre paragraph and develops the review logically."],["One is its title, Ola Bola.","This is not the approved film detail or does not answer this part of the task."],["One is its title, 5 Bomoh.","This does not support the required idea and is inconsistent with the review."]]},{"tag":"POINT 1 — One elaboration","question":"What is the film's storyline or setting?","hint":"Think about Abbas and unfair treatment at a boarding school.","correct":2,"options":[["It tells the story of a football team preparing for a big match.","This is not the approved film detail or does not answer this part of the task."],["It follows a family enjoying a peaceful holiday in a seaside village.","This does not support the required idea and is inconsistent with the review."],["The story follows Abbas as conflicts between elite students and scholarship students grow.","Correct! This sentence fits the title and genre paragraph and develops the review logically."]]},{"tag":"POINT 2 — Genre","question":"Which sentence tells the film's genre?","hint":"The verified genre is action and drama.","correct":1,"options":[["Another thing is its genre, which is romantic comedy.","This is not the approved film detail or does not answer this part of the task."],["Another feature is its genre, a combination of action and drama.","Correct! This sentence fits the title and genre paragraph and develops the review logically."],["Another thing is its genre, which is horror and mystery.","This does not support the required idea and is inconsistent with the review."]]},{"tag":"POINT 2 — One elaboration","question":"How does its action-drama style affect your viewing experience?","hint":"Connect school conflicts to excitement and emotional tension.","correct":0,"options":[["Intense confrontations and emotional struggles make the storyline engaging.","Correct! This sentence fits the title and genre paragraph and develops the review logically."],["The funny love scenes and cheerful music made everyone laugh.","This is not the approved film detail or does not answer this part of the task."],["The frightening ghosts and supernatural events created suspense.","This does not support the required idea and is inconsistent with the review."]]}]},{"title":"Lesson Learnt from the Film","bullet":"explain what you learnt from the movie.","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces a lesson from the film?","hint":"Introduce the lesson before naming it.","correct":2,"options":[["Furthermore, I enjoyed the interesting costumes and music in the film.","This is not the approved film detail or does not answer this part of the task."],["Furthermore, this movie is available for older audiences.","This does not support the required idea and is inconsistent with the review."],["Furthermore, the film taught me an important lesson about fairness.","Correct! This sentence fits the lesson learnt paragraph and develops the review logically."]]},{"tag":"POINT 1 — Main point","question":"What important value did the writer learn?","hint":"Focus on respect, fairness and making ethical decisions.","correct":1,"options":[["One lesson is that wealthy students deserve more respect than others.","This is not the approved film detail or does not answer this part of the task."],["One lesson is that we must discern right from wrong, even when powerful people act unfairly.","Correct! This sentence fits the lesson learnt paragraph and develops the review logically."],["One lesson is that pupils should keep quiet when they see bullying.","This does not support the required idea and is inconsistent with the review."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"Which detail from the film illustrates the lesson?","hint":"Use the contrast between elite and scholarship students.","correct":0,"options":[["The students' unequal treatment reminded me to show solidarity with those who face discrimination.","Correct! This sentence fits the lesson learnt paragraph and develops the review logically."],["In the story, all the students are treated equally and never face conflict.","This is not the approved film detail or does not answer this part of the task."],["In the story, students never argue because everyone has the same background.","This does not support the required idea and is inconsistent with the review."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"How could this lesson influence students' behaviour?","hint":"Explain how the lesson encourages supporting others.","correct":2,"options":[["This reminded me to ignore friends who suffer unfair treatment.","This is not the approved film detail or does not answer this part of the task."],["Consequently, I decided that bullying should never be reported.","This does not support the required idea and is inconsistent with the review."],["Consequently, I realised that remaining silent can allow bullying to continue.","Correct! This sentence fits the lesson learnt paragraph and develops the review logically."]]}]},{"title":"Would I Recommend It?","bullet":"Would you recommend the movie to your friends? Why?","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the recommendation?","hint":"Signal that you are evaluating the film for friends.","correct":0,"options":[["Finally, there are good reasons to recommend this film to friends aged 16 and above.","Correct! This sentence fits the recommendation and reason paragraph and develops the review logically."],["Finally, there are many ways to watch movies with friends.","This is not the approved film detail or does not answer this part of the task."],["Finally, the soundtrack and costumes look impressive.","This does not support the required idea and is inconsistent with the review."]]},{"tag":"POINT 1 — Main point","question":"What reason supports recommending this movie?","hint":"Choose a meaningful reason connected to bullying and injustice.","correct":2,"options":[["One reason is that the film encourages students to bully others.","This is not the approved film detail or does not answer this part of the task."],["One reason is that the film teaches viewers to accept unfair treatment.","This does not support the required idea and is inconsistent with the review."],["One reason is its powerful message about challenging injustice.","Correct! This sentence fits the recommendation and reason paragraph and develops the review logically."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"How does the film make that reason convincing?","hint":"Explain how school conflicts develop that message.","correct":1,"options":[["The school conflicts make bullying seem harmless and enjoyable.","This is not the approved film detail or does not answer this part of the task."],["Watching the characters try to rectify unfair treatment made the story meaningful.","Correct! This sentence fits the recommendation and reason paragraph and develops the review logically."],["The storyline suggests that students should never question injustice.","This does not support the required idea and is inconsistent with the review."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"What important age-related warning should be included?","hint":"Keep the age-16 classification in mind when recommending it.","correct":0,"options":[["Nevertheless, its scenes of violence may be disturbing for younger viewers.","Correct! This sentence fits the recommendation and reason paragraph and develops the review logically."],["However, I would suggest it to children of every age because it is gentle.","This is not the approved film detail or does not answer this part of the task."],["Nevertheless, the movie contains no violence and suits very young viewers.","This does not support the required idea and is inconsistent with the review."]]}]}];
const vocab={"discern":["C1","membezakan / mengenal pasti dengan teliti"],"solidarity":["C1","perpaduan / semangat setia kawan"],"rectify":["C1","membetulkan / memperbaiki keadaan yang salah"],"confrontations":["B2","pertembungan / pertelingkahan"],"discrimination":["B2","diskriminasi / layanan tidak adil"],"injustice":["B2","ketidakadilan"],"elite":["B2","golongan berstatus tinggi"],"scholarship":["B2","biasiswa"],"disturbing":["B2","mengganggu emosi / meresahkan"]};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const [level,bm]=vocab[word.toLowerCase()];return '<span class="vocab '+(level==="C1"?"c1":"b2")+'" tabindex="0" data-meaning="'+escapeHTML(bm)+'" aria-label="'+escapeHTML(word+" ("+level+"): "+bm)+'">'+word+'<span class="vocab-tooltip">'+level+' · '+escapeHTML(bm)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 3 · Review — Original Exam Task</strong><p><strong>MUST GO OR AVOID GOING?</strong></p><p>Your teacher has asked you to write a review for your school English Club bulletin board.</p><p>Have you watched any local movie recently? Share your experience with us.</p><p><strong>In your review, you must answer these questions:</strong></p><ul><li>what is the title and the genre of the movie?</li><li>explain what you learnt from the movie.</li><li>Would you recommend the movie to your friends? Why?</li></ul></div>";
const titleReminder=()=>"<div class=\"urgent-reminder\" role=\"note\"><div class=\"urgent-heading\">📕 STOP! WRITE THIS FIRST!</div><p>Write the <strong>REVIEW TITLE</strong> and a <strong>FOUR-SENTENCE INTRODUCTION</strong> in your exercise book.</p><div class=\"essay-title\">Kudrat 1968: High Council — Worth Watching?</div><p class=\"urgent-note\">Follow your Review lesson notes: past movie experiences, a comparison, this film, then a preview of its genre, lesson and recommendation.</p></div>";
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">🎬 Kudrat 1968 Review · NORMAL</span><span class="small">B1–B2 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Develop a richer SPM review, one meaningful sentence at a time.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the review title and four-sentence introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over B2 vocabulary (teal) and C1 vocabulary (purple) on a computer, or tap the underlined words on your phone.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Review closing</span></div><h2>Write Your Review Closing</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR REVIEW CLOSING!</div><p>Write a <strong>FOUR-SENTENCE REVIEW CLOSING</strong>: (1) recommendation to viewers aged 16 and above, (2) reason, (3) personal experience and (4) a hope about standing against bullying.</p><p class="urgent-note">✍️ Complete your review closing before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my review closing in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full review in your notebook</strong><p>It should contain your title, introduction, all three developed body paragraphs and review closing. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and review closing are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — add ONE elaboration for each point.</p>':'<p class="small">One main point — add TWO meaningful elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Review Closing →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
