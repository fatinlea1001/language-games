<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N4 Verb Garden — Feelings & Personal Growth (Set 4)</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff0f4;color:#593b4a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:750px;margin:auto;padding:22px 18px 40px}
header,.stats{display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:18px}
.tag{font-size:11px;letter-spacing:2px;color:#a1647d;font-weight:800}
h1{font-size:clamp(30px,6vw,43px);letter-spacing:-1.5px;margin:23px 0 6px}
p{line-height:1.6}
.intro{margin:0 0 22px;color:#956e81;font-size:14px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #a94574;outline-offset:4px}
.pill{border:1px solid #e7c2d0;border-radius:30px;background:#fff9fb;color:#784b60;padding:9px 12px;font-size:12px;white-space:nowrap}
.stats{font-size:13px;font-weight:700}
.track{height:7px;border-radius:20px;overflow:hidden;background:#efd5df;margin:12px 0 18px}
.fill{width:0;height:100%;background:#cc7c9b;transition:width .3s}
.card{padding:24px;background:#fffdfd;border:1px solid #efd6df;border-radius:26px;box-shadow:0 12px 35px #a65e7810}
.art{height:185px;border-radius:19px;background:#fff3f6;overflow:hidden}
.art svg{display:block;width:100%;height:100%}
.instruction{font-size:10px;letter-spacing:2px;color:#ad7d90;font-weight:800;margin:20px 0 5px}
.sentence{font-size:clamp(21px,4.5vw,27px);line-height:2.2;font-weight:600;margin:12px 0 20px}
rt{font-size:.48em;font-weight:400;color:#9c7185}
.off rt{visibility:hidden}
.blank{display:inline-block;min-width:100px;text-align:center;color:#b95e86;border-bottom:3px solid #dfa3bd;line-height:1.6}
.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.option{min-height:79px;border:2px solid #efdce4;background:#fff;border-radius:15px;color:#633f52;display:flex;align-items:center;gap:11px;text-align:left;padding:12px;font-size:21px}
.option:hover:not(:disabled){background:#fff0f6;border-color:#d191ac}
.letter{font-size:11px;background:#f9edf2;min-width:25px;height:25px;border-radius:8px;display:grid;place-items:center;color:#a16c85}
.option:disabled{cursor:default;opacity:1}
.option.correct{background:#edf7ee;border-color:#77a77e}
.option.wrong{background:#fff0e9;border-color:#d39176}
.option.dim{opacity:.5}
.feedback{background:#fff0f6;padding:16px;border-radius:14px;margin-top:17px;font-size:14px;line-height:1.7}
.feedback strong{display:block;font-size:17px}
.feedback p{margin:6px 0}
.primary{background:#ac557c;color:white;border:0;border-radius:14px;padding:15px;width:100%;font-weight:700;margin-top:16px}
.primary:hover{background:#934366}
.footer{text-align:center;color:#9b7587;font-size:12px;margin-top:18px;line-height:1.8}
.hidden{display:none!important}
.result{text-align:center}
.big{font-size:65px;font-weight:800;color:#ad557d}
.big small{font-size:24px;color:#ac8b9b}
.flowers{max-width:330px;margin:16px auto;line-height:1.8;font-size:25px;letter-spacing:5px}
.review{text-align:left}
.review article{padding:17px 0;border-top:1px solid #efdae3;font-size:14px;line-height:1.8}
.review .jp{font-size:19px;line-height:2.1}
.muted{color:#916c7e;font-size:13px}
@media(max-width:450px){
.card{padding:17px}
.art{height:160px}
.option{font-size:18px;padding:10px;gap:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.setlinks{display:flex;gap:6px;flex-wrap:wrap;margin:-5px 0 17px}.setlinks a{font-size:12px;border:1px solid #eed0df;border-radius:999px;padding:7px 13px;color:#8d5b78;background:#fff9fb;text-decoration:none;font-weight:750}.setlinks a.current{background:#ba7398;color:#fff;border-color:#ba7398}.setlinks a:focus-visible{outline:3px solid #a94574}</style>
</head>
<body>
<main>
<header>
<div>
<div class="tag">JAPANESE PRACTICE</div>
<b>🌸 N4 Verb Garden</b>
</div>
<button class="pill" id="furigana" aria-pressed="true">Furigana: ON</button>
</header>

<h1>Set 4 — Feelings & Personal Growth</h1>
<p class="intro">20 illustrated N4 verb questions · No timer, no rush.</p>

<nav class="setlinks" aria-label="N4 verb quiz sets"><a  href="n4-verb-1.html">Set 1</a><a  href="n4-verb-2.html">Set 2</a><a  href="n4-verb-3.html">Set 3</a><a class="current" aria-current="page" href="n4-verb-4.html">Set 4</a><a  href="n4-verb-5.html">Set 5</a></nav><section id="game">
<div class="stats">
<span id="counter"></span>
<span id="points"></span>
</div>

<div class="track" id="progress" role="progressbar"
aria-label="Questions completed" aria-valuemin="0"
aria-valuemax="20" aria-valuenow="0">
<div class="fill" id="fill"></div>
</div>

<div class="card">
<div class="art" id="art"></div>
<div class="instruction">CHOOSE THE VERB THAT FITS</div>
<div class="sentence" lang="ja" id="sentence"></div>
<div class="options" id="options"></div>
<div class="feedback hidden" id="feedback" aria-live="polite"></div>
<button id="next" class="primary hidden">Next question →</button>
</div>

<p class="footer">
Choose the action that makes sense in the sentence.<br>
Replay reshuffles all 20 questions and their answer choices.
</p>
</section>

<section id="results" class="card result hidden"></section>
</main>

<script>
/*
Format:
illustration, sentence, correct answer, distractors,
dictionary form, meaning, translation, note
*/
const questions=[["🎉","{試験|しけん}に{合格|ごうかく}したら、{両親|りょうしん}はきっと（　）。","{喜|よろこ}びます",["{心配|しんぱい}します","{続|つづ}けます","{感|かん}じます"],"{喜|よろこ}ぶ","to be delighted","If I pass the exam, my parents will surely be delighted.","喜ぶ expresses happiness or delight."],["😮","{突然|とつぜん}{大|おお}きな{音|おと}がしたら、だれでも（　）。","{驚|おどろ}きます",["{安心|あんしん}します","{諦|あきら}めます","{信|しん}じます"],"{驚|おどろ}く","to be surprised","Anyone would be surprised by a sudden loud noise.","驚く means to react with surprise."],["😂","この{映画|えいが}はとてもおもしろいので、みんな（　）。","{笑|わら}います",["{緊張|きんちょう}します","{慣|な}れます","{願|ねが}います"],"{笑|わら}う","to laugh","This film is so funny that everyone laughs.","笑う describes laughing or smiling."],["😭","{悲|かな}しい{映画|えいが}を{見|み}ると、よく（　）。","{泣|な}きます",["{疲|つか}れます","{困|こま}ります","{助|たす}けます"],"{泣|な}く","to cry","When I watch sad films, I often cry.","泣く is the verb for crying."],["😠","{弟|おとうと}が{約束|やくそく}を{破|やぶ}ると、{母|はは}は（　）。","{怒|おこ}ります",["{頑張|がんば}ります","{考|かんが}えます","{育|そだ}てます"],"{怒|おこ}る","to get angry","When my younger brother breaks a promise, my mother gets angry.","怒る means to become angry."],["😟","{娘|むすめ}が{夜遅|よるおそ}くまで{帰|かえ}らないと、{父|ちち}は（　）。","{心配|しんぱい}します",["{続|つづ}けます","{感|かん}じます","{喜|よろこ}びます"],"{心配|しんぱい}する","to worry","When his daughter does not come home until late, her father worries.","心配する means to feel worried about someone or something."],["😌","{医者|いしゃ}が「{大丈夫|だいじょうぶ}です」と{言|い}ったら、きっと（　）。","{安心|あんしん}します",["{諦|あきら}めます","{信|しん}じます","{驚|おどろ}きます"],"{安心|あんしん}する","to feel relieved","I will feel relieved if the doctor says everything is fine.","安心する means to become free from worry."],["🎤","{大勢|おおぜい}の{前|まえ}で{話|はな}すと、いつも（　）。","{緊張|きんちょう}します",["{慣|な}れます","{願|ねが}います","{笑|わら}います"],"{緊張|きんちょう}する","to feel nervous","I always feel nervous when speaking in front of many people.","緊張する means to feel tense or nervous."],["🥾","{山|やま}を{長|なが}い{時間|じかん}{歩|ある}いたら、（　）。","{疲|つか}れます",["{困|こま}ります","{助|たす}けます","{泣|な}きます"],"{疲|つか}れる","to get tired","If I hike in the mountains for hours, I get tired.","疲れる expresses becoming physically or mentally tired."],["🏆","{難|むずか}しい{試験|しけん}ですが、{合格|ごうかく}するために（　）。","{頑張|がんば}ります",["{考|かんが}えます","{育|そだ}てます","{怒|おこ}ります"],"{頑張|がんば}る","to do one's best","The exam is difficult, but I will do my best to pass.","頑張る means to make an effort and persevere."],["📖","{日本語|にほんご}が{上手|じょうず}になるまで、{毎日|まいにち}{勉強|べんきょう}を（　）。","{続|つづ}けます",["{感|かん}じます","{喜|よろこ}びます","{心配|しんぱい}します"],"{続|つづ}ける","to continue","I will keep studying every day until my Japanese improves.","続ける means to continue an activity."],["🚫","この{計画|けいかく}は{危険|きけん}すぎるので、（　）。","{諦|あきら}めます",["{信|しん}じます","{驚|おどろ}きます","{安心|あんしん}します"],"{諦|あきら}める","to give up","This plan is too dangerous, so I will give it up.","諦める means to stop pursuing something."],["🌱","{新|あたら}しい{生活|せいかつ}にも、{少|すこ}しずつ（　）。","{慣|な}れます",["{願|ねが}います","{笑|わら}います","{緊張|きんちょう}します"],"{慣|な}れる","to get used to","Little by little, I will get used to my new life.","慣れる uses に for what you become accustomed to."],["🆘","パスポートをなくしたら、とても（　）。","{困|こま}ります",["{助|たす}けます","{泣|な}きます","{疲|つか}れます"],"{困|こま}る","to be troubled","If I lose my passport, I will be in serious trouble.","困る describes being in a difficult situation."],["🤔","{大切|たいせつ}な{問題|もんだい}なので、{答|こた}える{前|まえ}によく（　）。","{考|かんが}えます",["{育|そだ}てます","{怒|おこ}ります","{頑張|がんば}ります"],"{考|かんが}える","to think","It is an important question, so I will think carefully before answering.","よく考える means to think carefully."],["🎶","この{音楽|おんがく}を{聞|き}くと、{心|こころ}が{温|あたた}かくなるのを（　）。","{感|かん}じます",["{喜|よろこ}びます","{心配|しんぱい}します","{続|つづ}けます"],"{感|かん}じる","to feel; to sense","When I hear this music, I feel a warmth in my heart.","感じる describes sensing an emotion or impression."],["🤞","{友達|ともだち}が「{本当|ほんとう}だ」と{言|い}うので、その{言葉|ことば}を（　）。","{信|しん}じます",["{驚|おどろ}きます","{安心|あんしん}します","{諦|あきら}めます"],"{信|しん}じる","to believe","My friend says it is true, so I will believe their words.","信じる takes を for what is believed."],["🌟","{家族|かぞく}の{健康|けんこう}をいつも（　）。","{願|ねが}います",["{笑|わら}います","{緊張|きんちょう}します","{慣|な}れます"],"{願|ねが}う","to wish; to hope","I always wish for my family's good health.","健康を願う means to wish for someone's health."],["🫶","{重|おも}い{荷物|にもつ}を{持|も}っているお{年寄|としよ}りを（　）。","{助|たす}けます",["{泣|な}きます","{疲|つか}れます","{困|こま}ります"],"{助|たす}ける","to help; to rescue","I will help an elderly person carrying heavy luggage.","助ける means to help someone in trouble."],["🌻","{毎日|まいにち}{水|みず}をやって、{小|ちい}さな{花|はな}を（　）。","{育|そだ}てます",["{怒|おこ}ります","{頑張|がんば}ります","{考|かんが}えます"],"{育|そだ}てる","to raise; to grow","I water a small flower every day and grow it.","育てる is transitive: to raise plants, animals or children."]];

function art(icon){
return `<svg viewBox="135 0 340 195" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pastel illustration for this Japanese verb question">
<rect x="135" y="0" width="340" height="195" fill="#fff2f6"/>
<circle cx="418" cy="39" r="49" fill="#fce3ad" opacity=".6"/>
<circle cx="182" cy="26" r="55" fill="#e9dff6" opacity=".65"/>
<ellipse cx="303" cy="175" rx="149" ry="10" fill="#f0d6e2"/>
<path d="M167 167q45-38 88-9t95-2t96 6v33H167Z" fill="#e9e2ee"/>
<g stroke="#ad7a97" stroke-width="3" stroke-linecap="round">
<path d="M218 129v40m-15-31-15 13m31-14 16 13" fill="none"/>
<path d="M218 128q-24-35 0-44q23-3 0 44Z" fill="#cba7c7"/>
<path d="M205 161l-14 17m26-17 15 17" fill="none"/>
</g>
<circle cx="218" cy="72" r="23" fill="#f5d7c1"/>
<path d="M196 69q-4-30 23-26q27 2 22 30q-11-9-15-17q-11 11-30 13Z" fill="#9e7994"/>
<circle cx="209" cy="75" r="2" fill="#715364"/><circle cx="227" cy="75" r="2" fill="#715364"/>
<path d="M214 86q5 6 11 0" stroke="#aa7282" stroke-width="2" fill="none"/>
<rect x="270" y="34" width="143" height="118" rx="25" fill="#ffffff" stroke="#efd3e0" stroke-width="3"/>
<path d="M270 119l-16 20 32-6" fill="#fff" stroke="#efd3e0" stroke-width="3"/>
<text x="341" y="112" font-size="64" text-anchor="middle" font-family="Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif">${icon}</text>
<path d="M401 18v12m-6-6h12m-223 88v10m-5-5h10" stroke="#e4b781" stroke-width="3" stroke-linecap="round"/>
</svg>`;
}
/* Furigana and game functions */
const $=id=>document.getElementById(id);
const jp=s=>s.replace(/\{([^|{}]+)\|([^{}]+)\}/g,
"<ruby>$1<rt>$2</rt></ruby>");
const plain=s=>s.replace(/\{([^|{}]+)\|([^{}]+)\}/g,"$1");

function shuffle(array){
const a=[...array];
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

let deck=[],position=0,score=0,locked=false,mistakes=[];
let lastOrder="",lastChoices={};

function start(){
const order=shuffle(questions.map((_,i)=>i));
if(order.join()===lastOrder)order.push(order.shift());
lastOrder=order.join();

deck=order.map(id=>{
const [image,sentence,answer,wrong,dictionary,meaning,translation,note]=questions[id];
const choices=shuffle([answer,...wrong]);
if(choices.join("|")===lastChoices[id])choices.push(choices.shift());
lastChoices[id]=choices.join("|");
return {image,sentence,answer,dictionary,meaning,translation,note,choices};
});

position=0;
score=0;
locked=false;
mistakes=[];
$("results").classList.add("hidden");
$("game").classList.remove("hidden");
render();
}

function render(){
locked=false;
const q=deck[position];
$("counter").textContent=`Question ${position+1} / 20`;
$("points").textContent=`🌸 ${score} correct`;
$("fill").style.width=`${position*5}%`;
$("progress").setAttribute("aria-valuenow",position);
$("art").innerHTML=art(q.image);
$("sentence").innerHTML=jp(q.sentence).replace(
"（　）",'<span class="blank">?</span>'
);
$("feedback").classList.add("hidden");
$("next").classList.add("hidden");
$("options").replaceChildren();

q.choices.forEach((choice,i)=>{
const button=document.createElement("button");
button.className="option";
button.lang="ja";
button.innerHTML=`<span class="letter">${"ABCD"[i]}</span>
<span>${jp(choice)}</span>`;
button.onclick=()=>choose(choice);
$("options").appendChild(button);
});
}

function choose(choice){
if(locked)return;
locked=true;
const q=deck[position];
const right=choice===q.answer;
if(right)score++;
else mistakes.push({...q,chosen:choice});

[...$("options").children].forEach((button,i)=>{
button.disabled=true;
button.classList.add(
q.choices[i]===q.answer?"correct":
q.choices[i]===choice?"wrong":"dim"
);
});

$("sentence").innerHTML=jp(q.sentence).replace(
"（　）",`<span class="blank">${jp(q.answer)}</span>`
);
$("points").textContent=`🌸 ${score} correct`;
$("fill").style.width=`${(position+1)*5}%`;
$("progress").setAttribute("aria-valuenow",position+1);
$("feedback").innerHTML=`
<strong>${right?"🌷 Lovely! That’s correct.":"🌱 A new verb to grow."}</strong>
<p>${jp(q.dictionary)} → ${jp(q.answer)} <b>· ${q.meaning}</b></p>
<p>${q.translation}</p>
<p class="muted">${q.note}</p>
`;
$("feedback").classList.remove("hidden");
$("next").textContent=position===19?"See my results 🌸":"Next question →";
$("next").classList.remove("hidden");
}

function finish(){
$("game").classList.add("hidden");
$("results").classList.remove("hidden");
$("results").innerHTML=`
<div class="tag">ROUND COMPLETE</div>
<h2>${score===20?"Your verbs are in full bloom!":"Your Japanese is growing."}</h2>
<div class="big">${score}<small> / 20</small></div>
<div class="flowers" aria-hidden="true">${"🌸".repeat(score)}${"🌱".repeat(20-score)}</div>
<p class="muted">One blossom for every correct answer.</p>
<button class="primary" id="replay">↻ Replay — shuffle all 20</button>
<p class="muted">New question order · New answer positions · Fresh score</p>
<div class="review">
<h3>${mistakes.length?"Verbs to practise":"All 20 correct. Beautiful work! 🌷"}</h3>
${mistakes.map(q=>`
<article>
<div class="jp" lang="ja">${jp(q.sentence.replace("（　）",q.answer))}</div>
<div>You chose ${plain(q.chosen)} → <b>${plain(q.answer)}</b></div>
<div>${jp(q.dictionary)} · ${q.meaning}</div>
<div class="muted">${q.translation}</div>
</article>
`).join("")}
</div>`;

$("replay").onclick=()=>{
start();
window.scrollTo(0,0);
};
window.scrollTo(0,0);
}

$("next").onclick=()=>{
if(!locked)return;
position++;
if(position===20)finish();
else{
render();
$("options").firstElementChild.focus({preventScroll:true});
}
};

$("furigana").onclick=()=>{
const off=document.body.classList.toggle("off");
$("furigana").textContent="Furigana: "+(off?"OFF":"ON");
$("furigana").setAttribute("aria-pressed",String(!off));
};

start();
</script>
</body>
</html>
