name: Update Game Directory

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/workflows/update-game-directory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-game-directory
  cancel-in-progress: false

jobs:
  update-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build game list
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import quote

          owner, repo = os.environ['GITHUB_REPOSITORY'].split('/')
          base = f'https://{owner}.github.io/{repo}/'
          start = '<!-- AUTO-GAMES:START -->'
          end = '<!-- AUTO-GAMES:END -->'
          malaysia_time = timezone(timedelta(hours=8))

          names = {
              'eng-speakingpart2': 'SPM Speaking Part 2',
              'eng-speakingpart3': 'SPM Speaking Part 3',
              'eng-jumble-environment': 'Sentence Jumble — Environment',
              'eng-preposition': 'Prepositions',
              'eng-spell-environment': 'Environment Spelling',
              'eng-spell-technology': 'Technology Spelling',
              'eng-verbtonoun': 'Verb to Noun',
              'eng-missing-ai-education': 'Missing Sentence Challenge — AI in Education',
              'eng-missing-true-crime': 'Missing Sentence Challenge — True Crime Podcasts',
              'eng-vocab-environment': 'Environment Vocabulary',
              'eng-vocab-technology': 'Technology Vocabulary',
              'eng-matchvocab-onlineaddiction': 'Vocabulary Match-Up — Online Addiction',
              'eng-matchvocab-onlinegaming': 'Vocabulary Match-Up — Online Gaming',
              'eng-matchvocab-recycling': 'Vocabulary Match-Up — Recycling',
              'eng-elaboration-socialmedia': 'Elaboration — Social Media',
              'eng-elaboration-mentalhealth': 'Elaboration — Mental Health',
              'eng-elaboration-sports': 'Elaboration — Playing Sports',
              'eng-elaboration-bullying': 'Elaboration — Bullying',
              'eng-elaboration-finance': 'Elaboration — Finance',
              'eng-elaboration-ai': 'Elaboration — AI',
              'jpn-spelling-kanji-katakana': 'Kanji & Katakana Spell-Off',
              'jpn-cafe-dialogue': 'Japanese Café Conversations — N5/N4',
              'jpn-reading-n5': 'Japanese Reading Garden — N5',
              'n5-adj': 'N5 Adjectives',
              'n5-sentence': 'N5 Sentence Jumble',
              'n5-verb': 'N5 Verbs',
              'n5-vocabulary': 'N5 Vocabulary',
              'teform': 'て-form Builder',
          }

          def title(path):
              stem = path.stem
              match = re.fullmatch(r'(.+)-(\d+)', stem)
              key = match.group(1) if match else stem
              if key == 'jpn-reading-n5' and match:
                  reading_topics = {
                      '1': 'Five Short Stories',
                      '2': 'A Busy Saturday',
                      '3': 'Shopping for Dinner',
                      '4': 'A Rainy Day Trip',
                      '5': 'A Birthday Surprise',
                      '6': 'Our School Festival',
                      '7': 'An Afternoon at the Library',
                      '8': 'A Day at the Zoo',
                      '9': 'Moving into a New Home',
                      '10': 'A Neighbourhood Clean-up',
                  }
                  if match.group(2) in reading_topics:
                      topic = reading_topics[match.group(2)]
                      return f'Japanese Reading Garden — {topic} (N5 Set {match.group(2)})'
              if key == 'jpn-reading-n5n4' and match:
                  mixed_topics = {
                      '11': 'A New Café in Town',
                      '12': 'The Forgotten Umbrella',
                      '13': 'My First Cooking Class',
                      '14': 'A Saturday Without My Phone',
                      '15': 'A Day Trip to Kyoto',
                  }
                  if match.group(2) in mixed_topics:
                      topic = mixed_topics[match.group(2)]
                      return f'Japanese Reading Garden — {topic} (N5/N4 Set {match.group(2)})'
              if key == 'eng-lexis-article' and match:
                  article_topics = {
                      '1': 'Caring Communities',
                      '2': 'Our Traditions',
                      '3': 'Better Well-being',
                      '4': 'Protecting Nature',
                      '5': 'Smarter Learning',
                      '6': 'Digital Life',
                      '7': 'Wise Spending',
                      '8': 'Smart Consumers',
                      '9': 'Making a Difference',
                      '10': 'Taking Action',
                  }
                  if match.group(2) in article_topics:
                      return f'Less Common Lexis Class — {article_topics[match.group(2)]} (Set {match.group(2)})'
              label = names.get(key, key.replace('-', ' ').title())
              if key.startswith('eng-') and key not in names:
                  label = label.removeprefix('Eng ')
              if key.startswith('jpn-') and key not in names:
                  label = label.removeprefix('Jpn ')
              if match:
                  label += f' (Set {match.group(2)})'
              return label

          def last_updated(path):
              result = subprocess.run(
                  ['git', 'log', '-1', '--format=%ct', '--', str(path)],
                  capture_output=True, text=True, check=True
              ).stdout.strip()
              return int(result) if result else 0

          groups = {'English': [], 'Japanese': [], 'Other': []}

          for path in Path('.').rglob('*.html'):
              if path.name.lower() in {'index.html', '404.html'}:
                  continue
              if '.git' in path.parts:
                  continue

              filename = path.name.lower()
              if filename.startswith('eng-'):
                  group = 'English'
              elif filename.startswith(('jp-', 'jpn-', 'n5-', 'teform-')):
                  group = 'Japanese'
              else:
                  group = 'Other'

              groups[group].append((last_updated(path), path))

          total = sum(map(len, groups.values()))
          lines = [
              start,
              '## 🎮 Play My Language Games',
              f'**{total} games** — automatically updated when an HTML game is added or changed.',
              'Recently updated games appear first in each category.'
          ]

          for group, emoji in [
              ('English', '🇬🇧'),
              ('Japanese', '🇯🇵'),
              ('Other', '🎲')
          ]:
              items = sorted(
                  groups[group],
                  key=lambda x: (x[0], str(x[1])),
                  reverse=True
              )
              if not items:
                  continue

              lines += ['', f'### {emoji} {group} Games']

              for updated, path in items:
                  url = base + quote(path.as_posix(), safe='/')
                  date = (
                      datetime.fromtimestamp(updated, malaysia_time).strftime('%d %b %Y')
                      if updated else ''
                  )
                  lines.append(
                      f'- [{title(path)}]({url})' +
                      (f' — updated {date}' if date else '')
                  )

          lines += [
              '',
              '_This directory is maintained by GitHub Actions._',
              end
          ]

          directory = '\n'.join(lines)
          readme = Path('README.md')
          old = readme.read_text(encoding='utf-8') if readme.exists() else ''

          if start in old and end in old:
              before = old.split(start, 1)[0].rstrip()
              after = old.split(end, 1)[1].lstrip('\n')
              new = (before + '\n\n' if before else '') + directory + '\n' + after
          else:
              new = (old.rstrip() + '\n\n' if old.strip() else '') + directory + '\n'

          readme.write_text(new, encoding='utf-8')
          PY

      - name: Save updated README
        run: |
          if git diff --quiet -- README.md; then
            echo 'Directory already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Automatically update game directory'
          git push
