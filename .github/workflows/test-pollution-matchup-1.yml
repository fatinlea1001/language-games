name: One-Time Pollution Match-Up Browser Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-pollution-matchup-1.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Test matching game on desktop and phone
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          
          URL = (Path.cwd() / "eng-matchvocab-pollution-1.html").as_uri()
          COUNT = [0]
          
          def check(value, label):
              if not value:
                  raise AssertionError(label)
              COUNT[0] += 1
              print("PASS:", label, flush=True)
          
          def pair(page, number):
              left = page.locator(f'#english .word[data-id="{number}"]')
              right = page.locator(f'#malay .word[data-id="{number}"]')
              left.click()
              right.click()
          
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
          
              page = browser.new_page(viewport={"width": 1280, "height": 900})
              errors = []
              page.on("pageerror", lambda e: errors.append(str(e)))
              page.goto(URL, wait_until="load")
              check("Pollution Vocabulary Match-Up" in page.title(), "Desktop: page title and game load")
              check(page.locator("#start").is_visible(), "Desktop: name-entry screen")
              check(page.locator("#name").get_attribute("required") is not None, "Desktop: name is required")
              page.locator("#name").fill("Vocabulary Tester")
              page.locator("#startForm button").click()
              check(page.locator("#player").inner_text().endswith("Vocabulary Tester"), "Desktop: entered name displayed")
              check(page.locator("#english .word").count()==10 and page.locator("#malay .word").count()==10, "Desktop: level one has 10 items on each side")
              check("Level 1 / 3" in page.locator("#level").inner_text(), "Desktop: level indicator")
              check("B1" in page.locator("#level").inner_text(), "Desktop: correct B1 CEFR badge shown")
              check("0 / 30" in page.locator("#score").inner_text(), "Desktop: score initially zero")
              check(page.evaluate("document.documentElement.scrollWidth <= innerWidth + 3"), "Desktop: no horizontal overflow")
          
              page.locator('#english .word[data-id="0"]').click()
              check("selected" in (page.locator('#english .word[data-id="0"]').get_attribute("class") or ""), "Desktop: selected state highlighted")
              page.locator('#malay .word[data-id="1"]').click()
              check("can no longer earn a mark" in page.locator("#feedback").inner_text(), "Desktop: incorrect feedback and first-try penalty")
              page.wait_for_timeout(620)
              pair(page,0)
              check("0 / 30" in page.locator("#score").inner_text(), "Desktop: corrected pair does not regain mark")
              check(page.locator("#ropes path").count()==1, "Desktop: correct match draws green connection")
              check(page.locator('#english .word[data-id="0"]').is_disabled(), "Desktop: matched item locks")
          
              for k in range(1,10):
                  pair(page,k)
              check("9 / 30" in page.locator("#score").inner_text(), "Desktop: level 1 score is 9/10")
              check("Matched 10 / 10" in page.locator("#progress").inner_text(), "Desktop: progress shows all ten matches")
              check(page.locator("#ropes path").count()==10, "Desktop: ten curved connecting lines")
              page.locator("#between").wait_for(state="visible",timeout=3000)
              check("9 / 10" in page.locator("#levelResult").inner_text(), "Desktop: level completion displays first-try score")
              page.locator("#nextLevel").click()
          
              check("Level 2 / 3" in page.locator("#level").inner_text(), "Desktop: reached level 2")
              check("B1" in page.locator("#level").inner_text(), "Desktop: correct B1 CEFR badge shown")
              check("noise pollution" in page.locator("#english").inner_text(), "Desktop: level 2 vocabulary loaded")
              for k in range(10):
                  pair(page,k)
              page.locator("#between").wait_for(state="visible",timeout=3000)
              check("19 / 30" in page.locator("#levelResult").inner_text(), "Desktop: cumulative score from levels 1-2")
              page.locator("#nextLevel").click()
          
              check("Level 3 / 3" in page.locator("#level").inner_text(), "Desktop: reached level 3")
              check("B2" in page.locator("#level").inner_text(), "Desktop: correct B2 CEFR badge shown")
              check("particulate matter" in page.locator("#english").inner_text(), "Desktop: level 3 vocabulary loaded")
              for k in range(10):
                  pair(page,k)
              page.locator("#end").wait_for(state="visible",timeout=3000)
              check(page.locator("#finalScore").inner_text()=="29 / 30", "Desktop: final first-try score is 29/30")
              check(page.locator("#percentage").inner_text()=="97%", "Desktop: percentage rounded correctly")
              check(page.locator("#winner").inner_text()=="Vocabulary Tester", "Desktop: name shown on final screen")
              check("Screenshot your result" in page.locator("#end").inner_text(), "Desktop: screenshot reminder present")
              check(not errors, "Desktop: no JavaScript errors")
              page.screenshot(path="pollution-desktop-test.png",full_page=True)
          
              page.locator("#replay").click()
              check("Level 1 / 3" in page.locator("#level").inner_text(), "Desktop: replay resets to level 1")
              check("0 / 30" in page.locator("#score").inner_text(), "Desktop: replay resets score")
              pair(page,0)
              check("1 / 30" in page.locator("#score").inner_text(), "Desktop: can earn score after replay")
              page.locator("#restart").click()
              check("0 / 30" in page.locator("#score").inner_text(), "Desktop: restart level subtracts current level score")
              check("Matched 0 / 10" in page.locator("#progress").inner_text(), "Desktop: restart clears matches")
              page.locator("#changeName").click() if page.locator("#changeName").is_visible() else None
              check(not errors, "Desktop: no JS errors after replay and restart")
          
              phone = browser.new_page(viewport={"width": 375, "height": 812}, is_mobile=True, has_touch=True)
              phone_errors = []
              phone.on("pageerror", lambda e: phone_errors.append(str(e)))
              phone.goto(URL, wait_until="load")
              check(phone.evaluate("document.documentElement.scrollWidth <= innerWidth + 3"), "Mobile: no horizontal overflow on intro")
              phone.locator("#name").fill("Phone Student")
              phone.locator("#startForm button").click()
              check(phone.locator("#english .word").count()==10 and phone.locator("#malay .word").count()==10, "Mobile: tap-target cards render")
              check(phone.evaluate("document.documentElement.scrollWidth <= innerWidth + 3"), "Mobile: no horizontal overflow during game")
              for scene in range(3):
                  for k in range(10):
                      pair(phone,k)
                  if scene<2:
                      phone.locator("#between").wait_for(state="visible",timeout=3000)
                      phone.locator("#nextLevel").click()
                      check(phone.evaluate("document.documentElement.scrollWidth <= innerWidth + 3"), f"Mobile: no horizontal overflow at level {scene+2}")
              phone.locator("#end").wait_for(state="visible",timeout=3000)
              check(phone.locator("#finalScore").inner_text()=="30 / 30", "Mobile: 30 correct matches yield perfect score")
              check(phone.locator("#percentage").inner_text()=="100%", "Mobile: correct percentage")
              check(phone.locator("#winner").inner_text()=="Phone Student", "Mobile: name on final screen")
              check(phone.evaluate("document.documentElement.scrollWidth <= innerWidth + 3"), "Mobile: no horizontal overflow on results")
              check(not phone_errors, "Mobile: no JS errors")
              phone.screenshot(path="pollution-mobile-test.png",full_page=True)
              browser.close()
          
          print(f"POLLUTION MATCH-UP FULL BROWSER TEST PASSED: {COUNT[0]} CHECKS",flush=True)
          PY
