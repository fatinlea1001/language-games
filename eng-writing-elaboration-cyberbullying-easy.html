<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 2 · EASY</span><h1>Elaboration Builder</h1><p class="subtitle">💻 Cyberbullying &amp; Online Safety · Guided Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"One Example of Cyberbullying on Social Media","bullet":"one example of cyberbullying on social media","plural":false,"steps":[{"tag":"POINT — Choose an example","question":"Which sentence introduces ONE example of cyberbullying?","hint":"Choose a specific harmful action on social media.","correct":0,"options":[["Firstly, one example of cyberbullying on social media is posting cruel comments under a student's photo.","The correct sentence gives a specific incident and reuses the exam bullet."],["Firstly, one example of online behaviour is leaving a friendly comment to praise a classmate's new photograph.","A friendly compliment does not illustrate cyberbullying."],["Firstly, one example of online behaviour is sharing a classmate's school project after asking for permission.","Sharing work with permission is not an example of online harassment."]]},{"tag":"Explanation 1 of 4","question":"HOW do the bullies hurt the student?","hint":"Explain what they say and why it hurts.","correct":1,"options":[["Some students comment on their friends' photographs to offer useful advice about lighting and camera angles.","Offering respectful photography advice is not hurtful bullying."],["Some bullies write hurtful words about the student's appearance to embarrass them in front of others.","The answer explains the hurtful words and their purpose."],["Some classmates write kind messages under a student's photograph to congratulate them on their recent achievement.","Congratulating a classmate does not explain harmful comments."]]},{"tag":"Explanation 2 of 4","question":"Which realistic EXAMPLE shows the cruel comments?","hint":"Think of a public comment under a photograph.","correct":2,"options":[["For example, classmates may ask the student whether the photo was taken during a school trip.","An ordinary question is not a cruel comment."],["For example, friends may praise the photograph and ask the student to upload more pictures from the event.","Friendly praise does not show an instance of cyberbullying."],["For example, they may call the student ugly in the comments on a public Instagram post.","The correct answer gives a believable public Instagram example."]]},{"tag":"Explanation 3 of 4","question":"What happens when OTHER people see the comments?","hint":"Connect public insults to other users' reactions.","correct":0,"options":[["As a result, other users might join in and make the student feel ashamed.","The correct sentence connects spreading comments to embarrassment."],["As a result, other users might talk about the school event shown in the student's photograph.","Discussing the event does not show the harm caused by insults."],["As a result, classmates could discuss the app's new features.","App features do not explain the effect of public cyberbullying."]]},{"tag":"Explanation 4 of 4","question":"What LONGER-TERM effect could the bullying have?","hint":"Think about confidence and sharing photos again.","correct":1,"options":[["This can help the student improve their photo-editing skills before posting.","Photo-editing interest is not the lasting emotional harm requested."],["This can hurt the student's confidence and make them afraid to share photos again.","The answer develops the impact on confidence and future behaviour."],["This can teach the bully how to change account settings and use different filters on photographs.","App settings do not develop the impact on the bullied student."]]}]},{"title":"Why Online Bullying Happens","bullet":"why online bullying happens","plural":true,"steps":[{"tag":"POINT 1 — Choose a reason","question":"What is the FIRST reason online bullying happens?","hint":"Why might someone want friends to notice them?","correct":1,"options":[["Furthermore, online bullying happens because teenagers use social media daily.","Frequent phone use alone does not explain why someone bullies."],["Furthermore, online bullying happens because some students want attention from their friends.","The answer gives peer attention as a reason for bullying."],["Furthermore, online bullying happens because students use phones for homework.","Using devices for schoolwork is not a reason for harassment."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"HOW might a bully try to get attention?","hint":"Describe a post meant to make others laugh.","correct":2,"options":[["They may post funny videos about school activities because classmates enjoy watching them during breaks.","A friendly school video does not illustrate insulting a classmate."],["They may write encouraging messages to their friends because they want everyone to feel welcome online.","Encouragement is different from bullying for attention."],["They may post rude jokes about a classmate because they think other people will laugh.","The answer describes a realistic action intended to entertain friends."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"WHY might the bully continue?","hint":"Think about likes or shares from friends.","correct":0,"options":[["When friends like or share those jokes, the bully may feel encouraged to continue.","This connects positive reactions from friends to repeated bullying."],["When friends like the jokes, the bully may apologise and remove them.","Removing the post is not the reason peer approval may prolong bullying."],["When classmates share the jokes, teachers might receive news about a school competition happening that week.","School competition news does not explain repeated harassment."]]},{"tag":"POINT 2 — Choose another reason","question":"What is a DIFFERENT reason for online bullying?","hint":"Think about hiding a person's real name.","correct":1,"options":[["Another reason is that bullies want attention from classmates.","Seeking attention repeats the first reason."],["Another reason is that bullies can hide behind fake accounts.","Fake accounts introduce a distinct reason: feeling hidden."],["Another reason is that teenagers enjoy editing photos online.","Photo editing does not explain why someone chooses to bully."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"WHY could fake accounts encourage a bully?","hint":"What might bullies believe about being identified?","correct":2,"options":[["This makes them think changing usernames makes hurtful comments harmless.","Changing usernames does not make cruel comments harmless."],["This makes them believe privacy settings can improve their schoolwork.","School assignments do not explain the bully's sense of anonymity."],["This makes them think that teachers and parents will not discover who they are.","The answer explains the mistaken belief that adults cannot identify them."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What may happen as a RESULT?","hint":"Connect feeling hidden with careless behaviour.","correct":0,"options":[["Consequently, they may send mean messages without thinking about the harm they cause.","The correct result shows how feeling hidden may lead to mean messages."],["Consequently, they may change their profile pictures without asking friends for advice.","Changing a profile picture is not the harmful result of feeling hidden."],["Consequently, they may share ordinary school announcements using their anonymous social media profiles.","School announcements do not show increased cruel behaviour."]]}]},{"title":"Ways Students Can Stop Cyberbullying","bullet":"ways students can stop cyberbullying","plural":true,"steps":[{"tag":"POINT 1 — Choose a way","question":"Which is the FIRST way to stop cyberbullying?","hint":"Choose a safe, useful action on the platform.","correct":2,"options":[["Lastly, one of the ways students can stop cyberbullying is to forward hurtful comments to every classmate.","Forwarding insults can spread the harm rather than reduce it."],["Lastly, one of the ways students can stop cyberbullying is to post angry replies that publicly shame the offender.","Public retaliation may escalate conflict instead of protecting the victim."],["Lastly, one of the ways students can stop cyberbullying is by reporting harmful comments to the social media platform.","Reporting harmful comments is a specific, constructive first method."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"HOW can a student report the incident?","hint":"Think of screenshots and the report button.","correct":0,"options":[["For example, they can save a screenshot and use the report button when someone is bullied.","Saving a screenshot and using the report button are practical steps."],["For example, they can share cruel screenshots with classmates.","Sharing evidence widely can spread humiliation."],["For example, they can delete the comments before telling teachers.","Deleting all evidence makes it harder to report the incident."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"What useful RESULT can reporting have?","hint":"Think about how a platform deals with complaints.","correct":1,"options":[["This allows the student to warn classmates by forwarding the cruel comments to large groups online.","Forwarding insults is not the benefit of making a report."],["This allows the platform to review the comments and may stop them from spreading.","The platform may review the comment and reduce its spread."],["This allows the student to delete their own account while the harmful post continues to spread.","Deleting one's own account does not explain how platform reporting helps."]]},{"tag":"POINT 2 — Choose another way","question":"What is a SECOND, DIFFERENT way to help?","hint":"Think about caring for the person being bullied.","correct":2,"options":[["Another way is to submit the same report repeatedly without supporting the bullied student.","Repeated reporting is not a different support strategy."],["Another way is to share jokes about the victim so classmates understand the incident.","Joking about the victim adds harm instead of providing support."],["Another way is to support students who are being bullied.","Supporting the bullied student is a different strategy."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW can classmates offer support?","hint":"Think about kindness and a trusted teacher.","correct":0,"options":[["They can send a kind message and encourage the victim to speak to a trusted teacher.","A kind message and help from a trusted adult are practical support."],["They can encourage the victim to ignore every message and hide the problem from all adults.","Keeping harassment secret may prevent the victim from obtaining help."],["They can copy the cruel comments into a public group chat so other classmates can read them.","Publicly sharing insults can increase the victim's distress."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What positive EFFECT may follow?","hint":"Think about the victim's feelings and access to help.","correct":1,"options":[["As a result, the bully may change usernames and continue sending harmful messages to classmates.","Continued harassment is not a positive effect of support."],["As a result, the victim may feel less alone and get help sooner.","The answer links support to feeling less isolated and finding help."],["As a result, students may share more screenshots of the incident instead of offering private support.","Sharing screenshots widely is not the helpful outcome requested."]]}]}];
const vocab={"appearance":{"level":"B2","meaning":"rupa atau penampilan"},"embarrass":{"level":"B2","meaning":"memalukan"},"public":{"level":"B2","meaning":"terbuka kepada orang ramai"},"ashamed":{"level":"B2","meaning":"berasa malu atau aib"},"confidence":{"level":"B2","meaning":"keyakinan diri"},"encouraged":{"level":"B2","meaning":"terdorong atau digalakkan"},"fake accounts":{"level":"B2","meaning":"akaun palsu"},"harmful":{"level":"B2","meaning":"memudaratkan atau menyakitkan hati"},"platform":{"level":"B2","meaning":"perkhidmatan atau tempat dalam talian"},"victim":{"level":"B2","meaning":"mangsa"},"consequently":{"level":"B2","meaning":"akibatnya"},"support":{"level":"B2","meaning":"memberi sokongan"},"reporting":{"level":"B2","meaning":"membuat laporan"}};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const info=vocab[word.toLowerCase()],level=info.level,meaning=info.meaning;return '<span class="vocab vocab-'+level.toLowerCase()+'" role="button" tabindex="0" aria-label="'+escapeHTML(word+' ('+level+'): '+meaning)+'">'+word+'<span class="vocab-tooltip"><strong>'+level+'</strong> · '+escapeHTML(meaning)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>Question 2 · Original Exam Task</strong><p>Your class has been talking about cyberbullying and your teacher has asked you to write an essay about it.</p><p><strong>In your essay, you should write about:</strong></p><ul><li>one example of cyberbullying on social media</li><li>why online bullying happens</li><li>ways students can stop cyberbullying</li></ul><p><strong>Use all the notes above and give reasons for your point of view.</strong></p></div>";
const titleReminder=()=>"<div class=\"urgent-reminder\" role=\"note\"><div class=\"urgent-heading\"><span class=\"urgent-icon\" aria-hidden=\"true\">📕</span><span>STOP! WRITE THIS FIRST!</span></div><p>Write the <strong>ESSAY TITLE</strong> and your <strong>INTRODUCTION PARAGRAPH</strong> in your exercise book.</p><div class=\"essay-title\">SUGGESTED TITLE: Cyberbullying on Social Media</div><p class=\"urgent-note\">✍️ Complete both in your notebook before starting Body Paragraph 1.</p></div>";
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">📚 Cyberbullying · EASY</span><span class="small">A2–B1 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Build a complete SPM essay in your exercise book.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the essay title AND my introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over underlined vocabulary on a computer, or tap the word on your phone to see its meaning.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Conclusion</span></div><h2>Write Your Conclusion</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR CONCLUSION!</div><p>Write a <strong>CONCLUSION PARAGRAPH</strong> in your exercise book about cyberbullying and online safety. End with your opinion or hope.</p><p class="urgent-note">✍️ Complete your conclusion before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my conclusion in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full essay in your notebook</strong><p>It should contain your title, introduction, all three developed body paragraphs and conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — add four elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<div class="choice-card '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" data-choice="'+i+'"><button type="button" class="choice-pick" data-action="choose" data-choice="'+i+'" aria-label="Select option '+String.fromCharCode(65+i)+': '+escapeHTML(o[0])+'" aria-pressed="'+(selected===i)+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span></button><div class="choice-text">'+withVocab(o[0])+'</div></div>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT "),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(isPoint?'Choose a new point':'Develop the point')+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const card=e.target.closest(".choice-card");if(card&&!state.checked){state.selected=Number(card.dataset.choice);render();return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
document.addEventListener("click",e=>{if(!e.target.closest(".vocab"))root.querySelectorAll(".vocab.is-open").forEach(el=>el.classList.remove("is-open"));});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
