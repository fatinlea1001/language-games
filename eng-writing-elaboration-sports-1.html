<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#194d51">
<meta name="description" content="SPM Writing Part 2 Elaboration Builder: The Popularity of Sports. Three guided paragraphs, hints, feedback, and copy checkpoints.">
<title>SPM Elaboration Builder — The Popularity of Sports (Set 1)</title>
<style>
:root{--ink:#253943;--muted:#617580;--teal:#237f80;--deep:#194d51;--border:#dce8e9;--soft:#f2f8f8;--mint:#e6f7ed;--green:#1e7450;--red:#a3344f;--rose:#fff0f2;--gold:#b47715}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,#d8eee6,transparent 36%),radial-gradient(circle at 100% 20%,#fff0d8,transparent 36%),#f7fbfa;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.shell{max-width:790px;margin:auto;padding:18px 14px 42px}
header{text-align:center;margin:6px auto 22px}
.kicker{display:inline-block;padding:7px 14px;background:white;border-radius:100px;color:var(--teal);font-size:.76rem;font-weight:850;letter-spacing:.045em}
h1{font-size:clamp(1.8rem,5vw,2.45rem);line-height:1.12;margin:13px 0 7px;letter-spacing:-.035em;color:var(--deep)}
.subtitle{margin:0;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--border);border-radius:24px;padding:clamp(18px,4vw,31px);box-shadow:0 13px 38px #4d857e18}
h2{font-size:1.32rem;margin:0 0 12px;line-height:1.4}h3{font-size:1.05rem;margin:0 0 10px}
p,li{line-height:1.7}p{margin:9px 0}ol,ul{padding-left:23px}
.small{color:var(--muted);font-size:.9rem}.tiny{color:var(--muted);font-size:.78rem}
.exam{background:var(--soft);border:1px solid #d0e4e4;border-radius:17px;padding:16px 18px;margin:17px 0}
.exam strong{color:var(--deep)}.exam ul{margin:8px 0}.exam li{margin:5px 0}
label.name{display:block;margin-top:23px;margin-bottom:8px;font-weight:800}
input[type=text]{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid #bedbda;background:white}
textarea{width:100%;min-height:145px;resize:vertical;padding:15px;border-radius:13px;border:2px solid #bedbda;background:white;color:var(--ink);font:inherit;line-height:1.65}
.writing-tip{background:#eaf6f4;border:1px solid #d0e7e1;border-radius:14px;padding:14px 16px;margin:15px 0;line-height:1.65}
.writing-tip ul{margin:7px 0 0}
.writing-meta{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:.83rem}
.essay p{white-space:pre-wrap}
button{font:inherit;cursor:pointer;font-weight:780;border:0;border-radius:12px;padding:13px 17px}
button:focus-visible,input:focus-visible{outline:3px solid #7bc6c2;outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.primary{background:var(--teal);color:white}.primary:hover:not(:disabled){background:#176264}
.secondary{background:#e6f4f2;color:var(--deep)}.secondary:hover:not(:disabled){background:#d5eeeb}
.full{width:100%}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}.row>button{flex:1 1 180px}
.chip{display:inline-block;border-radius:99px;background:#e8f5f2;color:#286a66;font-size:.8rem;font-weight:850;padding:6px 11px}
.progress{display:flex;gap:6px;margin:12px 0 22px}.progress span{flex:1;height:8px;background:#e8f0ef;border-radius:99px}.progress .done{background:#42a58e}.progress .active{background:#d6a03b}
.point{background:#f2f8f8;border:1px solid #d6e5e4;border-radius:16px;padding:17px 18px;margin:14px 0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.065em;font-weight:850;color:#357d7a;margin-bottom:6px}
.point p{font-weight:730;font-size:1.08rem;margin:0}
.step-title{margin:20px 0 8px;font-size:1.22rem}
.choice-list{display:grid;gap:10px;margin-top:15px}
.choice{width:100%;background:white;border:2px solid #d8e5e4;display:flex;gap:12px;align-items:flex-start;text-align:left;color:var(--ink);line-height:1.55}
.choice:hover:not(:disabled){border-color:#67ada7;background:#f5fcfa}
.choice.selected{border-color:var(--teal);background:#eaf8f5}
.choice.good{border-color:#4fba83;background:#eaf9ef}
.choice.bad{border-color:#e3a1af;background:var(--rose)}
.letter{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:#e5f3f0;color:#266b68;display:grid;place-items:center;font-weight:850}
.feedback{border-radius:14px;padding:14px 16px;margin:16px 0;line-height:1.65}
.feedback.good{background:var(--mint);color:var(--green);border:1px solid #a6dcbf}
.feedback.bad{background:var(--rose);color:var(--red);border:1px solid #eec5ce}
.draft{background:#f8fbff;border:1px solid #dbe6f1;border-radius:15px;padding:13px 16px;margin:17px 0}
.draft p{margin:7px 0;font-size:.95rem}
.missing{color:#84939b;font-style:italic}
.copycheck{background:#fff3d4;border:3px solid #dfa736;border-radius:18px;padding:19px 18px;margin:18px 0}
.copycheck h2{color:#80530d;margin-bottom:5px}
.paper{background:#fff;border:1px solid #edd7a3;border-radius:14px;padding:15px 17px;margin:15px 0;line-height:1.85}
.confirm{display:flex;align-items:flex-start;gap:12px;line-height:1.55;font-weight:740;margin:20px 0 9px}
.confirm input{accent-color:var(--teal);width:21px;height:21px;flex:0 0 21px;margin:2px 0 0}
.score{font-size:clamp(2.7rem,8vw,4.1rem);font-weight:900;color:var(--teal);line-height:1.1}
.essay{background:#f8fbfa;border:1px solid #dbe9e6;border-radius:15px;padding:16px;margin:17px 0}
.essay p{margin:0 0 15px}.essay p:last-child{margin:0}
.copied{min-height:1.2em;color:var(--green);font-weight:760;font-size:.9rem}
footer{text-align:center;font-size:.77rem;color:#6a8184;margin-top:20px}
@media(max-width:480px){.shell{padding:12px 10px 30px}.panel{border-radius:18px}.choice{padding:12px}.copycheck{padding:14px}.row>button{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{body{background:white}.shell{max-width:none}header,.no-print,footer{display:none!important}.panel{border:0;box-shadow:none}.essay{border:0;padding:0}}
</style>
</head>
<body>
<main class="shell">
<header><span class="kicker">✍️ SPM WRITING PAPER 2 · SET 1</span><h1>Elaboration Builder</h1><p class="subtitle">🏸 The Popularity of Sports · Guided Writing</p></header>
<section class="panel" id="app" aria-live="polite"></section>
<footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer>
</main>
<script>
"use strict";
const tasks=[
{title:"Describe the Sport",bullet:"Describe a sport that you enjoy watching",point:"First of all, my favourite sport to watch is badminton, especially singles matches.",parts:[
{title:"Describe the sport",question:"Which sentence helps the reader picture the sport?",hint:"Think about what players do during a match.",options:[
["Badminton is an enjoyable and interesting sport to watch.","This repeats your opinion, but does not describe the sport."],
["Players move quickly across the court and hit a shuttlecock over the net.","Yes. This adds clear, observable details about the sport."],
["Many Malaysians support badminton during international tournaments.","This discusses popularity instead of describing the sport."]],correct:1},
{title:"Develop your personal response",question:"Which sentence explains why watching it appeals to you?",hint:"Link the fast action to your feelings as a spectator.",options:[
["The fast rallies make every point exciting, so I rarely lose interest.","Yes. This explains why the action makes the sport enjoyable to watch."],
["This shows that badminton is one of the most popular sports in Malaysia.","This describes popularity rather than your personal enjoyment."],
["Therefore, I enjoy badminton because it is very enjoyable to watch.","This repeats the original opinion without adding information."]],correct:0}]},
{title:"Explain Its Popularity",bullet:"Explain why the sport is popular",point:"Furthermore, badminton is popular because people can understand the rules easily.",parts:[
{title:"Explain why",question:"Which sentence develops the reason given in the point?",hint:"Consider a person watching their first badminton match.",options:[
["Many Malaysians watch badminton because it is a famous national sport.","This repeats the idea of popularity instead of explaining the simple rules."],
["Badminton athletes work hard and practise regularly for competitions.","This describes training, not why the sport is easy for viewers to follow."],
["Even new spectators can follow the action and know when someone scores.","Yes. This shows how simple rules make the sport accessible."]],correct:2},
{title:"Show a consequence",question:"What logically follows when the sport is easy to understand?",hint:"Think about family members watching an exciting match together.",options:[
["As a result, professional badminton players can train more effectively.","Spectators understanding the rules does not directly improve professional training."],
["Therefore, families can enjoy close matches together without learning complicated instructions.","Yes. This connects easy rules to wider enjoyment among spectators."],
["Consequently, badminton is a famous and well-loved sport.","This only repeats the point about popularity."]],correct:1}]},
{title:"Discuss Being Active",bullet:"Discuss whether watching sports can inspire people to be active",point:"Most importantly, watching badminton can encourage people to become more active.",parts:[
{title:"Explain how",question:"How might watching badminton influence a teenager's behaviour?",hint:"Imagine someone watching skilled players in an exciting match.",options:[
["Seeing skilled players practise and compete may inspire teenagers to try the sport themselves.","Yes. This shows how watching can lead to a desire to participate."],
["People can enjoy badminton highlights whenever they have free time.","This explains watching habits, not a reason to become active."],
["Professional badminton players often compete in important international tournaments.","This is information about athletes, not the impact on spectators."]],correct:0},
{title:"Show a practical result",question:"What might teenagers do after being inspired by a match?",hint:"Choose something involving physical participation.",options:[
["As a result, they may spend more time watching their favourite athletes online.","This describes watching more, not becoming physically active."],
["As a result, they might play with friends after school instead of staying indoors.","Yes. This gives a realistic example of becoming more active."],
["As a result, professional badminton players might gain more online followers.","This concerns athlete popularity, not teenagers' activities."]],correct:1}]}];
const state={stage:"welcome",name:"",intro:"",closing:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const root=document.getElementById("app");
const countWords=text=>text.trim().split(/\s+/).filter(Boolean).length;
const escapeHTML=text=>String(text).replace(/[&<>"\']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\'":"&#39;"}[c]));
const current=()=>tasks[state.index];
const question=()=>current().parts[state.step];
const paragraph=i=>[tasks[i].point,tasks[i].parts[0].options[tasks[i].parts[0].correct][0],tasks[i].parts[1].options[tasks[i].parts[1].correct][0]].join(" ");
const wholeEssay=()=>[state.intro.trim(),...state.finished,state.closing.trim()].join("\n\n");
const progress=()=>'<div class="progress" aria-label="Paragraph '+(state.index+1)+' of 3">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>'<div class="exam"><strong>Original SPM task</strong><p>Your class has been discussing the popularity of sports. Your teacher has asked you to write an essay about the topic.</p><p>In your essay, you should:</p><ul><li>describe a sport that you enjoy watching</li><li>explain why the sport is popular</li><li>discuss whether watching sports can inspire people to be active</li></ul><p><strong>Use all the notes above and give reasons for your point of view.</strong></p><p>Write your essay in <strong>125–150 words</strong> in an appropriate style.</p></div>';
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">🏸 Sports Edition</span><span class="small">B1–B2 · 6 questions</span></div><h2 style="margin-top:17px">Write your own introduction, develop three body paragraphs and finish with a conclusion.</h2>'+examTask()+'<p>First, write your introduction. Next, build each body paragraph with guided choices and <strong>copy it into your exercise book</strong>. Finally, write your own conclusion.</p><label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><p class="tiny">6 first-attempt marks for the guided challenges · Unlimited retries · Free and no AI marking</p><button type="button" class="primary full" data-action="start">Begin: Write My Introduction →</button><p id="nameError" class="tiny" role="alert"></p>';
return;
}
if(state.stage==="intro"||state.stage==="conclusion"){
const isIntro=state.stage==="intro",kind=isIntro?"introduction":"conclusion";
const value=isIntro?state.intro:state.closing;
const confirmed=isIntro?state.introConfirmed:state.closingConfirmed;
const heading=isIntro?"Write Your Introduction":"Write Your Conclusion";
const extra=isIntro?examTask():'<div class="exam"><strong>Your three body paragraphs are complete.</strong><p>You have described badminton, explained its popularity and discussed how watching it might inspire physical activity.</p><p>Now finish the essay with your overall opinion or hope.</p></div>';
const tips=isIntro?'<li>Introduce sports and the topic of watching them.</li><li>Give readers a brief idea of what your essay will discuss.</li><li>Avoid copying the exam question word for word.</li>':'<li>Summarise your overall view about watching sports.</li><li>End with your opinion, hope or suggestion.</li><li>Avoid introducing a completely new main point.</li>';
root.innerHTML='<div class="row between"><span class="chip">'+(isIntro?'✏️ BEFORE THE ACTIVITIES':'✏️ FINAL WRITING TASK')+'</span><span class="small">'+(isIntro?'Introduction':'Conclusion')+'</span></div><h2 style="margin-top:19px">'+heading+'</h2>'+extra+'<div class="writing-tip"><strong>Writing tips (suggested length: 15–25 words)</strong><ul>'+tips+'</ul></div><label class="name" for="writingArea">Type your own '+kind+' paragraph here:</label><textarea id="writingArea" maxlength="500" placeholder="Write your own '+kind+' in complete sentences...">'+escapeHTML(value)+'</textarea><div class="writing-meta"><span id="writingCount">'+countWords(value)+' words written</span><span>Not AI-marked — check your own work</span></div><div class="copycheck"><h3>✍️ Write it in your exercise book</h3><p>Read your paragraph once more, then write or copy it into your exercise book before confirming.</p><label class="confirm"><input type="checkbox" id="confirmWriting" '+(confirmed?'checked':'')+'><span>I have written my '+kind+' in my exercise book.</span></label><button class="primary full" type="button" data-action="'+(isIntro?'finishIntro':'finishConclusion')+'" '+(confirmed&&value.trim()?'':'disabled')+'>'+(isIntro?'Start Elaboration Activities →':'Complete My Essay →')+'</button><p class="tiny">🔒 Write your paragraph and tick the confirmation box to continue.</p></div>';
return;
}
if(state.stage==="finished"){
const essay=wholeEssay(),wc=countWords(essay);
root.innerHTML='<div style="text-align:center"><div style="font-size:44px">🏆</div><h2>Essay Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / 6</div><p class="small">First-attempt marks on guided challenges</p><span class="chip">'+wc+' words · '+(wc>=125&&wc<=150?'Within the SPM word range':'Review your word count (target: 125–150)')+'</span></div><h2 style="margin-top:25px">Your Complete Essay</h2><div class="essay">'+[state.intro,...state.finished,state.closing].map((x,i)=>'<p><span class="label" style="display:block">'+(i===0?'INTRODUCTION':i===4?'CONCLUSION':'BODY PARAGRAPH '+i)+'</span>'+escapeHTML(x)+'</p>').join("")+'</div><p class="small">Your own introduction and conclusion are included above. The game scores only the six guided choices; it cannot check whether your independent writing is grammatically correct.</p><div class="row no-print"><button type="button" class="primary" data-action="copyEssay">📋 Copy Full Essay</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=current(),p=question();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/6</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong></div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Copy the complete paragraph into your exercise book before you move to the next part.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+paragraph(state.index)+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Complete My Essay →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm after copying to unlock the next part.</p></div>';
return;
}
const chosen=state.selected;
const choices=p.options.map((option,i)=>'<button type="button" class="choice '+(chosen===i?(state.checked?(i===p.correct?'good':'bad'):'selected'):'')+'" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+option[0]+'</span></button>').join("");
let suffix='';
if(state.checked){
const good=chosen===p.correct;
suffix='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Good elaboration!':'↻ This needs improvement.')+'</strong><p>'+p.options[chosen][1]+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===0?'Continue to Step 2 →':'View & Copy My Paragraph →'):'Try Again ↻')+'</button>';
}else{
suffix='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+p.hint+'</div>':'')+'<button class="primary full" data-action="check" type="button" '+(chosen===-1?'disabled':'')+'>Check My Answer ✓</button>';
}
root.innerHTML=head+'<div class="point"><div class="label">GIVEN POINT</div><p>'+t.point+'</p></div>'+(state.step===1?'<div class="draft"><div class="label">YOUR EXPLANATION SO FAR</div><p>'+t.parts[0].options[t.parts[0].correct][0]+'</p></div>':'')+'<div class="row between"><span class="chip">STEP '+(state.step+1)+' OF 2</span><span class="tiny">'+p.title+'</span></div><h3 class="step-title">'+p.question+'</h3><div class="choice-list">'+choices+'</div>'+suffix;
}
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function start(){
const v=document.getElementById("student").value.trim();
if(!v){document.getElementById("nameError").textContent="Please enter your name to begin. / Sila masukkan nama.";document.getElementById("student").focus();return;}
state.name=v;state.stage="intro";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===question().correct)state.score++;
state.tries++;state.checked=true;render();
}
function next(){
if(!state.confirmed)return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===2){state.stage="conclusion";}else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const field=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}
else{
const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw new Error("Copy unavailable");
}
if(field)field.textContent="✓ Copied! You can paste it into your notes.";
}catch(err){if(field)field.textContent="Automatic copying is unavailable here. You can select and copy the paragraph text manually.";}
}
root.addEventListener("click",event=>{
const b=event.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start"){start();return;}
if(action==="finishIntro"){if(state.intro.trim()&&state.introConfirmed){state.stage="play";render();}return;}
if(action==="finishConclusion"){if(state.closing.trim()&&state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check"){check();return;}
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance"){
if(!state.checked||state.selected!==question().correct)return;
if(state.step===0){state.step=1;resetChoice();}else{state.stage="copy";state.confirmed=false;}
render();return;
}
if(action==="next"){next();return;}
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyEssay"){copyText(wholeEssay());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",intro:"",closing:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("input",event=>{
if(event.target.id!=="writingArea")return;
const isIntro=state.stage==="intro";
if(!isIntro&&state.stage!=="conclusion")return;
if(isIntro){state.intro=event.target.value;state.introConfirmed=false;}else{state.closing=event.target.value;state.closingConfirmed=false;}
const check=root.querySelector("#confirmWriting");if(check)check.checked=false;
const button=root.querySelector('[data-action="finishIntro"],[data-action="finishConclusion"]');if(button)button.disabled=true;
const count=root.querySelector("#writingCount");if(count)count.textContent=countWords(event.target.value)+" words written";
});
root.addEventListener("change",event=>{
if(event.target.id==="confirmCopy"){state.confirmed=event.target.checked;const button=root.querySelector('[data-action="next"]');if(button)button.disabled=!state.confirmed;}
if(event.target.id==="confirmWriting"){
const isIntro=state.stage==="intro";const hasText=(isIntro?state.intro:state.closing).trim().length>0;
const yes=event.target.checked&&hasText;
if(isIntro)state.introConfirmed=yes;else state.closingConfirmed=yes;
const button=root.querySelector('[data-action="finishIntro"],[data-action="finishConclusion"]');if(button)button.disabled=!yes;
}
});
render();
</script>
</body>
</html>
