<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 3 · ARTICLE · EASY</span><h1>Elaboration Builder</h1><p class="subtitle">🤖 Teenagers and AI · Article Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"Why Teenagers Use AI Tools","bullet":"What influences teenagers to use AI tools?","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the influences on teenagers?","hint":"Mention several reasons in general, without naming the first one.","correct":1,"options":[["To begin with, teenagers should stop using the Internet.","This gives an unrelated command rather than previewing influences."],["To begin with, there are several reasons why teenagers use AI tools.","This introduces the exam bullet as a separate topic sentence."],["To begin with, some pupils enjoy joining technology clubs.","Clubs do not introduce the question about what influences teenagers to use AI."]]},{"tag":"POINT 1 — Main point","question":"Which FIRST reason explains why teenagers use AI?","hint":"Consider schoolwork and learning.","correct":2,"options":[["One reason is that AI helps pupils buy snacks at the canteen.","Canteen shopping is unrelated to why pupils use AI."],["One reason is that students spend time playing traditional sports.","Sports do not explain the decision to use AI tools."],["One reason is that AI helps them with schoolwork.","This is a relevant first main point answering the question."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"WHY can AI help with schoolwork?","hint":"Develop the point with a clear learning benefit.","correct":0,"options":[["This is because they can get simple explanations when they do not understand a lesson.","This develops the point with a clear reason."],["This is because AI always gives completely correct answers to every question.","AI responses are not always accurate, so the statement overclaims."],["This is because most pupils need new schoolbags during lessons.","Schoolbags do not explain how AI assists with learning."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which example illustrates help with a school task?","hint":"Think of a difficult question and a clear chatbot request.","correct":2,"options":[["For example, a student can ask a chatbot to choose a new phone wallpaper.","Personalising wallpapers is not a schoolwork explanation."],["For example, a student can use AI to avoid attending every lesson.","Avoiding lessons does not illustrate learning support."],["For example, a student can ask an AI chatbot to explain a difficult maths question.","This provides a concrete example of the stated point."]]},{"tag":"POINT 2 — Another influence or safety step","question":"Which SECOND influence is different from schoolwork?","hint":"Think about seeing friends use AI on social media.","correct":1,"options":[["Another reason is that pupils ask AI to explain their homework.","This repeats the first schoolwork reason."],["Another reason is that teenagers often see AI tools on social media.","This introduces a distinct second point, as required."],["Another reason is that AI can give simple lesson explanations.","This also repeats the schoolwork benefit instead of a new influence."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW does social media encourage AI use?","hint":"Name a specific type of AI content shared by friends.","correct":0,"options":[["Their friends may share AI pictures or videos that make these tools look interesting.","This adds a relevant elaboration or result."],["Their friends may share ordinary classroom timetables on paper.","Paper timetables are not social-media examples of AI content."],["Their friends may share pictures of their lunch with no AI features.","Ordinary food photographs do not demonstrate exposure to AI tools."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What is a realistic RESULT of seeing AI content online?","hint":"Focus on curiosity and pupils wanting to experiment.","correct":0,"options":[["As a result, more teenagers want to try AI for themselves.","This follows logically from the preceding sentences."],["As a result, all teenagers stop talking to their teachers forever.","Trying AI does not mean pupils will abandon teachers."],["As a result, nobody will ever want to watch online videos again.","Interesting AI content does not imply online videos will become unpopular."]]}]},{"title":"Efficiency or Responsibility?","bullet":"Which is more important – being efficient or responsible? Why?","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the comparison in the exam question?","hint":"Preview both efficiency and responsibility before choosing one.","correct":2,"options":[["Furthermore, AI is the only useful technology in the modern world.","The claim is exaggerated and does not introduce the required comparison."],["Furthermore, the price of smartphones is very important to teenagers.","Phone prices are not the choice between efficiency and responsibility."],["Furthermore, there are two things to consider when using AI: being efficient and being responsible.","This introduces the exam bullet as a separate topic sentence."]]},{"tag":"POINT 1 — Main point","question":"Which position answers 'Which is more important?'","hint":"Make a direct judgement, not an unrelated statement.","correct":1,"options":[["I believe finishing every task quickly is the only thing that matters.","This ignores responsible use and gives an unreasonable absolute position."],["I believe being responsible is more important.","This is a relevant first main point answering the question."],["I believe all teenagers should avoid technology completely.","A complete ban is not a comparison of efficient and responsible use."]]},{"tag":"POINT 1 — Elaboration 1 of 4","question":"WHY is responsibility more important than speed?","hint":"Explain a risk of accepting fast AI answers uncritically.","correct":1,"options":[["AI may give answers quickly, so all the answers must be correct.","Speed does not guarantee accuracy, so this is false reasoning."],["AI may give answers quickly, but some answers can be wrong.","This develops the point with a clear reason."],["AI may give answers slowly because every device has a broken screen.","A broken screen is unrelated to the comparison of responsible AI use."]]},{"tag":"POINT 1 — Elaboration 2 of 4","question":"Which example shows careless AI use?","hint":"Think of unchecked facts being copied into schoolwork.","correct":2,"options":[["For example, a student may check a fact carefully before using it.","Checking a fact illustrates responsibility, not the danger of careless copying."],["For example, a student may ask a teacher to check an AI answer.","Asking a teacher to verify information is a safe habit, not this problem."],["For example, a student may copy incorrect facts from AI into a school assignment.","This provides a concrete example of the stated point."]]},{"tag":"POINT 1 — Elaboration 3 of 4","question":"What happens if students never verify AI information?","hint":"Connect unchecked information to a realistic problem.","correct":0,"options":[["This can cause problems because the student has not checked the information.","This introduces a distinct second point, as required."],["This can make every school assignment perfect without effort.","Unverified information does not guarantee an excellent assignment."],["This can help all pupils learn new facts accurately every time.","Unchecked answers can be wrong, so accuracy is not guaranteed."]]},{"tag":"POINT 1 — Elaboration 4 of 4","question":"Which sentence CONCLUDES the comparison?","hint":"Recommend careful use instead of pursuing speed alone.","correct":2,"options":[["Therefore, teenagers should copy everything from AI without reading it.","Copying without checking contradicts the argument for responsibility."],["Therefore, teenagers should only use AI when they want to play games.","The conclusion should address responsible AI use, not restrict AI to entertainment."],["Therefore, teenagers should use AI carefully instead of thinking only about speed.","This adds a relevant elaboration or result."]]}]},{"title":"Safe AI Use","bullet":"Explain how teenagers can use AI safely.","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the final safety bullet?","hint":"Introduce several ways to use AI safely.","correct":1,"options":[["Finally, AI is becoming more popular in many countries.","Popularity does not preview safety strategies."],["Finally, there are several ways teenagers can use AI safely.","This introduces the exam bullet as a separate topic sentence."],["Finally, pupils enjoy using different social-media apps.","Enjoyment of apps does not introduce safe AI use."]]},{"tag":"POINT 1 — Main point","question":"What is ONE way to use AI safely?","hint":"Think about checking accuracy.","correct":0,"options":[["One way is to check information before using it.","This is a relevant first main point answering the question."],["One way is to accept all AI answers without reading them.","Blind acceptance makes errors more likely and is unsafe."],["One way is to copy every AI response into homework immediately.","Copying without verification is the opposite of safe use."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"WHY should teenagers check AI information?","hint":"Show how checking prevents errors.","correct":0,"options":[["This helps them avoid mistakes in their homework and projects.","This develops the point with a clear reason."],["This helps them finish tasks without learning anything.","Avoiding learning does not explain the value of checking information."],["This helps them buy more expensive school supplies.","Buying supplies has no connection to verifying AI output."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which example shows fact-checking?","hint":"Choose a school source to compare against an AI response.","correct":2,"options":[["For example, they can compare the colour of two phone cases.","Phone case colours do not help verify information."],["For example, they can ask AI to repeat the same answer five times.","Repeating an AI answer does not independently verify its accuracy."],["For example, they can compare an AI answer with a school textbook.","This provides a concrete example of the stated point."]]},{"tag":"POINT 2 — Another influence or safety step","question":"Which SECOND safety practice is different from checking facts?","hint":"Focus on protecting privacy.","correct":1,"options":[["Another way is to read the AI answer twice without checking other sources.","This repeats the first verification point instead of introducing privacy."],["Another way is to keep personal information private.","This introduces a distinct second point, as required."],["Another way is to check spelling in the AI answer.","Spelling checks still concern answer accuracy rather than privacy."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW can teenagers protect their personal data?","hint":"Use specific examples of private details that should not be shared.","correct":1,"options":[["Teenagers should send their passwords to unfamiliar AI websites.","Exposing passwords would create a privacy and account-security risk."],["Teenagers should never share passwords, home addresses or private photos with AI tools.","This adds a relevant elaboration or result."],["Teenagers should upload private family photographs to every chatbot.","Sharing private images widely can compromise personal privacy."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What risk might follow careless sharing?","hint":"Use the one C1 word in a logical warning about online safety.","correct":2,"options":[["Otherwise, their smartphones will immediately stop working forever.","Sharing information does not mean devices will permanently fail."],["Otherwise, all teenagers will certainly lose every social-media account.","This exaggerates the risk as a certainty rather than a possibility."],["Otherwise, they may jeopardise their safety online.","This follows logically from the preceding sentences."]]}]}];
const vocab={"jeopardise":["C1","membahayakan / meletakkan dalam risiko"],"chatbot":["B2","program perbualan AI"],"responsible":["B2","bertanggungjawab"],"efficient":["B2","cekap / efisien"],"information":["B2","maklumat"],"personal":["B2","peribadi"],"private":["B2","sulit / peribadi"]};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const [level,bm]=vocab[word.toLowerCase()];return '<span class="vocab '+(level==="C1"?"c1":"b2")+'" tabindex="0" data-meaning="'+escapeHTML(bm)+'" aria-label="'+escapeHTML(word+" ("+level+"): "+bm)+'">'+word+'<span class="vocab-tooltip">'+level+' · '+escapeHTML(bm)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 3 · Article — Original Exam Task</strong><p>You recently saw this notice in an English-language magazine.</p><p><strong>ARTICLES WANTED!</strong></p><p><strong>Teenagers and the Use of AI</strong></p><ul><li>What influences teenagers to use AI tools?</li><li>Which is more important – being efficient or responsible? Why?</li><li>Explain how teenagers can use AI safely.</li></ul><p><strong>Write your article.</strong></p></div>";
const titleReminder=()=>"<div class=\"urgent-reminder\" role=\"note\"><div class=\"urgent-heading\">📕 STOP! WRITE THIS FIRST!</div><p>Write the <strong>ARTICLE TITLE</strong>, <strong>BYLINE</strong> (Written by: Your Name) and a <strong>THREE-SENTENCE INTRODUCTION</strong> in your exercise book.</p><div class=\"essay-title\">Teenagers and the Use of AI<br><small>Written by: Your Name</small></div><p class=\"urgent-note\">Follow the Article notes: (1) introduce AI and teenagers, (2) a general statement, (3) preview influences, responsibility and safety.</p></div>";
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">🤖 Teenagers and AI · EASY</span><span class="small">A2–B1 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Build a complete SPM article in your exercise book.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the article title, byline and three-sentence introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over underlined vocabulary on a computer, or tap the word on your phone to see its meaning.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Conclusion</span></div><h2>Write Your Conclusion</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR CONCLUSION!</div><p>Write a <strong>TWO-SENTENCE CONCLUSION</strong>: (1) summarise why AI can help but must be used responsibly, (2) suggest a realistic action for parents or teachers.</p><p class="urgent-note">✍️ Complete your conclusion before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my conclusion in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full article in your notebook</strong><p>It should contain your title, byline, introduction, all three body paragraphs and conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — add four elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
