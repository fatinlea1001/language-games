2","question":"Which EXAMPLE supports the first activity?","hint":"Give a real situation when pupils sing national songs.","correct":1,"options":[["For example, pupils can watch a cooking video during assembly.","Watching cooking videos does not illustrate patriotic singing."],["For example, classes may sing traditional patriotic songs and present short performances about Malaysia's history.","It gives a specific singing example relevant to school."],["For example, pupils can read their maths textbooks during recess.","Reading textbooks is not a singing example."]]},{"tag":"POINT 2 — Second point","question":"What is a DIFFERENT second activity?","hint":"Move from singing to a different hands-on activity.","correct":0,"options":[["Another common activity is decorating classrooms with flags and creative displays.","Decorating classrooms is different from singing."],["Another activity is singing the same songs again after school.","This repeats the first activity."],["Another activity is listening to patriotic songs with headphones.","Listening to the same songs repeats the first point."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW do pupils decorate classrooms?","hint":"Say what pupils do with flags and posters.","correct":2,"options":[["Pupils buy decorations but never use them at school.","Buying and never using materials does not show decorating."],["Pupils spend the preparation period playing video games.","Playing games does not develop the decoration activity."],["By working together on these displays, pupils learn to share responsibilities and appreciate one another's contributions.","This describes how flags and posters are prepared."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What is a reasonable RESULT of decorating?","hint":"Think about the school's atmosphere.","correct":1,"options":[["As a result, pupils never need to attend assembly again.","Decorations do not end school assemblies."],["As a result, the celebration becomes more engaging and helps create a stronger sense of belonging at school.","A cheerful school is a realistic outcome."],["As a result, everyone will get full marks in every exam.","Decorations cannot guarantee exam results."]]}]},{"title":"Why Independence Day Is Important","bullet":"why it is important to celebrate Independence Day","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"How should we OPEN the paragraph about importance?","hint":"Introduce several reasons for the celebration.","correct":0,"options":[["Furthermore, there are several reasons why celebrating Independence Day is important for young Malaysians.","The opener announces the reasons without naming Point 1."],["Furthermore, there are different kinds of food sold at school.","Food sales do not address the importance of independence."],["Furthermore, Independence Day matters only to teachers.","The celebration is intended for pupils too."]]},{"tag":"POINT 1 — First point","question":"What is one reason to celebrate Independence Day?","hint":"Think about people who helped bring independence.","correct":2,"options":[["One reason is that everyone can spend money at a shopping centre.","Shopping does not explain the value of independence."],["One reason is that pupils can avoid all homework forever.","Celebrating cannot mean avoiding schoolwork forever."],["One key reason is that it strengthens awareness of the country's struggle for independence.","Remembering independence efforts explains national importance."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"HOW do pupils learn about independence?","hint":"Mention the stories teachers share about the past.","correct":1,"options":[["During the celebration, teachers only discuss new smartphones.","Phones are unrelated to national history."],["Learning about the efforts of national leaders helps pupils understand that freedom was achieved through determination and cooperation.","Teachers' stories describe how pupils learn history."],["During the celebration, teachers ask pupils to forget history.","Forgetting history contradicts the point."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which EXAMPLE relates to Malaysian independence?","hint":"Use a figure or event associated with 1957.","correct":0,"options":[["For instance, a school exhibition about 1957 can make historical events more meaningful than simply reading dates in a textbook.","Tunku Abdul Rahman and 1957 make the explanation concrete."],["For example, pupils can compare prices at a bookshop.","Bookshop prices do not illustrate national independence."],["For example, pupils can play an online racing game.","An online game is irrelevant to the historical example."]]},{"tag":"POINT 2 — Second point","question":"What is a SECOND reason for celebrating?","hint":"Move from history to relationships among Malaysians.","correct":2,"options":[["Another reason is to memorise the same historical facts again.","This repeats the first reason."],["Another reason is to eat more snacks during recess.","Snacks are not a meaningful reason for national celebrations."],["Another important reason is that the celebration encourages solidarity among people from different communities.","Bringing people together is distinct from remembering history."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW does celebrating together build unity?","hint":"Think of friendship across different backgrounds.","correct":1,"options":[["Celebrating together means only pupils from one background can join.","Excluding others contradicts unity."],["When pupils take part in the same activities, they develop respect for one another despite differences in culture or language.","Joining across backgrounds supports unity and solidarity."],["Celebrating together means everyone must stop speaking other languages.","Forbidding home languages does not show respect."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What is the RESULT of sharing the celebration?","hint":"Focus on respect and national pride.","correct":0,"options":[["Consequently, such experiences can reinforce the belief that unity is essential for Malaysia's future.","Respect and pride are plausible effects."],["Therefore, everybody will agree on everything forever.","A celebration cannot remove all disagreement."],["Therefore, all pupils will become famous performers.","National unity does not guarantee performance fame."]]}]},{"title":"Ways to Show Love for Malaysia","bullet":"suggest ways to show our love for the country","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"How should the paragraph about patriotism OPEN?","hint":"Preview different ways to show love for Malaysia.","correct":2,"options":[["Finally, there are many famous buildings in Malaysia.","Buildings are not a suggestion for patriotic action."],["Finally, pupils often enjoy celebrating holidays.","Enjoying holidays does not identify a way to show love."],["Finally, there are various practical ways we can show our love for the country.","The opener uses the bullet's requested ways."]]},{"tag":"POINT 1 — First point","question":"What is one way to love the country?","hint":"Think of how pupils should treat national symbols.","correct":1,"options":[["One way is to throw the national flag on the ground.","Throwing down flags is disrespectful."],["One meaningful way is to care for public places and the environment.","Respect for national symbols is a practical action."],["One way is to talk loudly during the national anthem.","Talking during the anthem is disrespectful."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"HOW do pupils respect national symbols?","hint":"Describe respectful conduct during the anthem.","correct":0,"options":[["Keeping schools, parks and neighbourhoods clean demonstrates respect for the country we share.","This explains proper behaviour around the anthem and flag."],["We should continue chatting loudly while the anthem plays.","Loud conversation does not show respect."],["We should use the flag to cover our lunch tables.","Using flags as tablecloths is not respectful conduct."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which EXAMPLE demonstrates that respect?","hint":"Use a school flag ceremony as an example.","correct":2,"options":[["For example, pupils can leave flags on the floor after class.","Leaving flags on the floor is disrespectful."],["For example, pupils can skip the school ceremony entirely.","Skipping ceremonies is the opposite of participation."],["For example, pupils can organise a weekend clean-up programme and encourage neighbours to participate.","Flag-raising is a relevant school ceremony."]]},{"tag":"POINT 2 — Second point","question":"What is a DIFFERENT way to show love?","hint":"Think beyond flags towards a daily responsibility.","correct":1,"options":[["Another way is to buy flags without ever displaying them.","Buying unused flags repeats the first point rather than adding action."],["Another way is to support activities that benefit the local community.","Keeping shared places clean adds a genuinely different action."],["Another way is to sing the anthem louder than everyone else.","Singing loudly repeats the earlier national-symbol action."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW can pupils protect public spaces?","hint":"Mention collecting litter and protecting shared places.","correct":0,"options":[["Volunteering at community events can facilitate cooperation between people of different ages and backgrounds.","These are concrete actions to care for public spaces."],["We can drop litter on the ground and wait for others to collect it.","Littering damages public places."],["We can ignore broken public facilities and tell no one.","Ignoring public damage does not care for the country."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What is the likely RESULT of keeping places clean?","hint":"Show a believable improvement to public spaces.","correct":2,"options":[["As a result, the country will never need road repairs.","Clean surroundings cannot prevent all road repairs."],["As a result, nobody will ever visit public parks.","Cleaner parks are more likely to welcome visitors."],["Ultimately, these everyday actions show that patriotism involves responsibility, not just celebrations.","A cleaner, pleasant environment is a reasonable outcome."]]}]}];

}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — develop it with four detailed elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
