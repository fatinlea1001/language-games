<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#194d51"><meta name="description" content="SPM Part 3 NORMAL Eco-friendly Lifestyle Article Elaboration Builder with 14 steps, BM vocabulary, and notebook-copy gates."><title>SPM Elaboration Builder — Adapting an Eco-friendly Lifestyle (NORMAL)</title><style>
:root{--ink:#253943;--muted:#617580;--teal:#237f80;--deep:#194d51;--border:#dce8e9;--soft:#f2f8f8;--mint:#e6f7ed;--green:#1e7450;--red:#a3344f;--rose:#fff0f2;--gold:#b47715}

h2{font-size:1.32rem;margin:0 0 12px;line-height:1.4}h3{font-size:1.05rem;margin:0 0 10px}
p,li{line-height:1.7}p{margin:9px 0}ol,ul{padding-left:23px}
.small{color:var(--muted);font-size:.9rem}.tiny{color:var(--muted);font-size:.78rem}
.exam{background:var(--soft);border:1px solid #d0e4e4;border-radius:17px;padding:16px 18px;margin:17px 0}
.exam strong{color:var(--deep)}.exam ul{margin:8px 0}.exam li{margin:5px 0}
label.name{display:block;margin-top:23px;margin-bottom:8px;font-weight:800}
input[type=text]{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid #bedbda;background:white}

.secondary{background:#e6f4f2;color:var(--deep)}.secondary:hover:not(:disabled){background:#d5eeeb}

.row.between{justify-content:space-between}.row>button{flex:1 1 180px}
.chip{display:inline-block;border-radius:99px;background:#e8f5f2;color:#286a66;font-size:.8rem;font-weight:850;padding:6px 11px}

.choice:hover:not(:disabled){border-color:#67ada7;background:#f5fcfa}

.urgent-reminder .essay-title{padding:11px 14px;background:white;border:1px solid #eeb4ba;border-radius:11px;font-size:1.12rem;font-weight:900;color:#952230;margin:13px 0}
.urgent-reminder .urgent-note{font-size:.92rem;font-weight:650;color:#863740;margin-top:10px}
.paper{background:#fff;border:1px solid #edd7a3;border-radius:14px;padding:15px 17px;margin:15px 0;line-height:1.85}
.confirm{display:flex;align-items:flex-start;gap:12px;line-height:1.55;font-weight:740;margin:20px 0 9px}
.confirm input{accent-color:var(--teal);width:21px;height:21px;flex:0 0 21px;margin:2px 0 0}
.score{font-size:clamp(2.7rem,8vw,4.1rem);font-weight:900;color:var(--teal);line-height:1.1}
.essay{background:#f8fbfa;border:1px solid #dbe9e6;border-radius:15px;padding:16px;margin:17px 0}
.essay p{margin:0 0 15px}.essay p:last-child{margin:0}
.copied{min-height:1.2em;color:var(--green);font-weight:760;font-size:.9rem}
footer{text-align:center;font-size:.77rem;color:#6a8184;margin-top:20px}
@media(max-width:480px){.shell{padding:12px 10px 30px}.panel{border-radius:18px}.choice{padding:12px}.copycheck{padding:14px}.row>button{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{body{background:white}.shell{max-width:none}header,.no-print,footer{display:none!important}.panel{border:0;box-shadow:none}.essay{border:0;padding:0}}

/* Distinct point and elaboration stages */
.segment{margin:14px 0 11px;border-radius:13px;padding:12px 14px;background:#e8f3fc;border-left:5px solid #5795c1;font-weight:820;color:#2c5878}

.draft .built-sentence{display:block;line-height:1.7}
.essay-title{overflow-wrap:anywhere}

.vocab{position:relative;display:inline;border-bottom:2px dotted #23808b;color:#176773;font-weight:780;cursor:help;outline-offset:3px}
.vocab-tooltip{position:absolute;z-index:50;left:0;bottom:calc(100% + 7px);min-width:160px;max-width:min(230px,75vw);background:#193c49;color:white;border-radius:9px;padding:9px 11px;font:600 .81rem/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 16px #173d4930;opacity:0;visibility:hidden;pointer-events:none;text-align:left}
.vocab:hover .vocab-tooltip,.vocab:focus .vocab-tooltip,.vocab.is-open .vocab-tooltip{opacity:1;visibility:visible}
.vocab-guide{font-size:.83rem;color:#526b70;margin:7px 0 13px}
.vocab.c1{color:#7947a3;border-bottom-color:#8d63b0}.vocab.c1 .vocab-tooltip{background:#613c81}
.vocab:focus-visible{outline:2px solid #176773;border-radius:3px}
.vocab.vocab-c1{color:#74438d;border-bottom-color:#8958a9}
.vocab.vocab-c1 .vocab-tooltip{background:#49305b}
.vocab-tooltip strong{font-size:.73rem;padding:1px 5px;border-radius:4px;background:#ffffff33}

<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 3 · ARTICLE · NORMAL</span><h1>Elaboration Builder</h1><p class="subtitle">🌱 Eco-friendly Lifestyle · Article Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"Belief and Eco-friendly Practice","bullet":"Do you believe in an eco-friendly lifestyle? Tell us about an eco-friendly practice that you do.","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces BOTH environmental belief and eco-friendly practice?","hint":"Preview two distinct ideas without stating the first yet.","correct":1,"options":[["To begin with, there are several entertaining ways to celebrate our school sports day.","This choice does not support the required point or contradicts the eco-friendly lesson."],["To begin with, there are two important aspects of my eco-friendly lifestyle.","This previews belief and practice without merging the opening into Point 1."],["To begin with, there are two major reasons to use disposable products every day.","This choice does not support the required point or contradicts the eco-friendly lesson."]]},{"tag":"POINT 1 — Main point","question":"What does the writer believe about protecting nature?","hint":"Think about everyone's duty to protect the environment.","correct":2,"options":[["One is my belief that environmental protection is solely the government's duty.","This choice does not support the required point or contradicts the eco-friendly lesson."],["One is my belief that personal choices cannot influence the environment.","This choice does not support the required point or contradicts the eco-friendly lesson."],["One is my belief that everyone should take responsibility for protecting the environment.","The main belief is that protecting nature is everyone's responsibility."]]},{"tag":"POINT 1 — Elaboration 1 of 1","question":"Which sentence develops the writer's belief?","hint":"Explain the value of small daily actions.","correct":0,"options":[["Even small daily choices can reduce the pressure we place on nature.","This develops how everyday choices can help protect the environment."],["Even small daily choices cannot affect our use of natural resources.","This choice does not support the required point or contradicts the eco-friendly lesson."],["Using disposable containers everywhere helps to eliminate pollution.","This choice does not support the required point or contradicts the eco-friendly lesson."]]},{"tag":"POINT 2 — Second point","question":"What eco-friendly practice does the writer follow?","hint":"Identify the habit involving a reusable water bottle.","correct":1,"options":[["Another aspect is my habit of purchasing disposable bottles at every break.","This choice does not support the required point or contradicts the eco-friendly lesson."],["Another aspect is my habit of carrying a reusable water bottle to school.","The second point names a specific reusable-bottle habit."],["Another aspect is my decision to avoid bringing water to school.","This choice does not support the required point or contradicts the eco-friendly lesson."]]},{"tag":"POINT 2 — One elaboration","question":"How does this habit help the environment?","hint":"Connect the habit to avoiding disposable plastic bottles.","correct":2,"options":[["This has encouraged me to increase the number of plastic bottles I discard.","This choice does not support the required point or contradicts the eco-friendly lesson."],["This has made me less careful about the waste produced each day.","This choice does not support the required point or contradicts the eco-friendly lesson."],["This has made me more conscientious about avoiding single-use plastic.","The last sentence explains how the practice reduces plastic waste."]]}]},{"title":"What Inspired Me","bullet":"What inspired you to start?","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces ONE inspiring experience?","hint":"Start with the inspiration before giving its details.","correct":0,"options":[["Furthermore, there is one experience that inspired me to change my habits.","This opens the paragraph on what inspired the habit."],["Furthermore, there are several benefits of preparing for examinations.","This choice does not support the required point or contradicts the eco-friendly lesson."],["Furthermore, there is one reason I prefer watching sports online.","This choice does not support the required point or contradicts the eco-friendly lesson."]]},{"tag":"POINT 1 — Main point","question":"What incident inspired the writer to change their habit?","hint":"Remember the plastic litter seen after a school event.","correct":1,"options":[["One experience was seeing my school field completely free of litter after an event.","This choice does not support the required point or contradicts the eco-friendly lesson."],["One experience was seeing piles of discarded plastic bottles after our school sports day.","The example clearly identifies the school event and discarded bottles."],["One experience was discovering that my school never used plastic bottles.","This choice does not support the required point or contradicts the eco-friendly lesson."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"How did the writer feel or what did the writer realise?","hint":"Describe the emotional response or environmental lesson.","correct":2,"options":[["The sight convinced me that throwing plastic on the ground prevents pollution.","This choice does not support the required point or contradicts the eco-friendly lesson."],["The sight made me believe that more disposable waste would protect nature.","This choice does not support the required point or contradicts the eco-friendly lesson."],["The sight made me realise that small changes could mitigate the environmental impact of school activities.","This explains the emotional response or lesson from the sight."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"What change did the writer make afterwards?","hint":"Explain what the writer started doing every morning.","correct":0,"options":[["Consequently, I began bringing my own water bottle every morning.","This develops the result: starting a reusable-bottle habit."],["Consequently, I decided to purchase a new disposable bottle every morning.","This choice does not support the required point or contradicts the eco-friendly lesson."],["Consequently, I stopped considering the environmental impact of my habits.","This choice does not support the required point or contradicts the eco-friendly lesson."]]}]},{"title":"Reasons to Adopt a Green Lifestyle","bullet":"Why should we adapt to this way of life?","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces WHY we should live sustainably?","hint":"Introduce two benefits rather than naming just one.","correct":1,"options":[["Finally, there are several reasons why students should increase plastic consumption.","This choice does not support the required point or contradicts the eco-friendly lesson."],["Finally, there are several reasons why students should adopt an eco-friendly lifestyle.","This introduces multiple benefits of an eco-friendly lifestyle."],["Finally, there are many benefits of ignoring environmental protection.","This choice does not support the required point or contradicts the eco-friendly lesson."]]},{"tag":"POINT 1 — Main point","question":"What is the FIRST reason to adopt a greener lifestyle?","hint":"Focus on reducing plastic waste.","correct":2,"options":[["One reason is that disposable bottles always prevent plastic pollution.","This choice does not support the required point or contradicts the eco-friendly lesson."],["One reason is that buying single-use products never contributes to waste.","This choice does not support the required point or contradicts the eco-friendly lesson."],["One reason is that reusable products can curtail plastic pollution.","Reducing plastic waste is the first benefit."]]},{"tag":"POINT 1 — Elaboration 1 of 1","question":"Which sentence explains how reusable bottles help?","hint":"Explain how reusing bottles prevents extra waste.","correct":0,"options":[["For instance, carrying our own bottles reduces the number of containers thrown away each day.","This elaborates on reducing disposable bottles."],["For instance, purchasing new bottles daily eliminates unnecessary packaging.","This choice does not support the required point or contradicts the eco-friendly lesson."],["For instance, abandoning reusable containers is an effective way to reduce litter.","This choice does not support the required point or contradicts the eco-friendly lesson."]]},{"tag":"POINT 2 — Second point","question":"What is a DIFFERENT second reason?","hint":"Give a second benefit about daily spending.","correct":1,"options":[["Another reason is that buying expensive bottled drinks reduces our daily expenses.","This choice does not support the required point or contradicts the eco-friendly lesson."],["Another reason is that this habit can reduce our daily expenses.","Saving money gives a different second benefit."],["Another reason is that eco-friendly habits cannot influence personal spending.","This choice does not support the required point or contradicts the eco-friendly lesson."]]},{"tag":"POINT 2 — One elaboration","question":"How can a reusable bottle help students save money?","hint":"Describe refilling at home instead of buying new drinks.","correct":2,"options":[["By buying several new drinks each day, we can significantly lower our costs.","This choice does not support the required point or contradicts the eco-friendly lesson."],["By avoiding all reusable containers, students can save more money and reduce rubbish.","This choice does not support the required point or contradicts the eco-friendly lesson."],["By refilling our bottles at home, we can save money while protecting the environment.","This explains how refilling bottles saves money."]]}]}];
const vocab={"conscientious":["C1","teliti dan bersungguh-sungguh dalam menjalankan tanggungjawab"],"mitigate":["C1","mengurangkan kesan buruk sesuatu masalah"],"curtail":["C1","mengehadkan / mengurangkan sesuatu"],"environmental":["B2","berkaitan dengan alam sekitar"],"discarded":["B2","dibuang / ditinggalkan"],"reusable":["B2","boleh digunakan semula"],"pollution":["B2","pencemaran"],"expenses":["B2","perbelanjaan"],"responsibility":["B2","tanggungjawab"]};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const [level,bm]=vocab[word.toLowerCase()];return '<span class="vocab '+(level==="C1"?"c1":"b2")+'" tabindex="0" data-meaning="'+escapeHTML(bm)+'" aria-label="'+escapeHTML(word+" ("+level+"): "+bm)+'">'+word+'<span class="vocab-tooltip">'+level+' · '+escapeHTML(bm)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 3 · Article — Original Exam Task</strong><p>You recently saw this notice on the board outside the school library.</p><p><strong>Articles Wanted!</strong></p><p><strong>Adapting an Eco-friendly Lifestyle</strong></p><p>Do you believe in an eco-friendly lifestyle?</p><p>Tell us about an eco-friendly practice that you do.</p><p>What inspired you to start? Why should we adapt to this way of life?</p><p><strong>Write your article.</strong></p></div>";
const titleReminder=()=>"<div class=\"urgent-reminder\" role=\"note\"><div class=\"urgent-heading\">📕 STOP! WRITE THIS FIRST!</div><p>Write the <strong>ARTICLE TITLE</strong>, <strong>BYLINE</strong> and a <strong>THREE-SENTENCE INTRODUCTION</strong> in your exercise book.</p><div class=\"essay-title\">Adapting an Eco-friendly Lifestyle</div><p style=\"text-align:center\"><strong>Written by: Your Name</strong></p><p class=\"urgent-note\">Follow the Article lesson notes: introduce the environment, show why small actions matter, and preview your green habit, inspiration and reasons to adopt it.</p></div>";
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">🌱 Eco-friendly Lifestyle · NORMAL</span><span class="small">B1–B2 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Develop a richer SPM article, one meaningful sentence at a time.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the article title, byline and three-sentence introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over B2 vocabulary (teal) and C1 vocabulary (purple) on a computer, or tap the underlined words on your phone.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Conclusion</span></div><h2>Write Your Conclusion</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR CONCLUSION!</div><p>Write a <strong>THREE-SENTENCE CONCLUSION</strong>: (1) summarise benefits for people and the environment, (2) express hope that teenagers will make responsible choices, and (3) recommend schools encourage daily green habits.</p><p class="urgent-note">✍️ Complete your conclusion before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my conclusion in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full article in your notebook</strong><p>It should contain your title, byline, introduction, all three developed body paragraphs and conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — add ONE elaboration sentence for each point.</p>':'<p class="small">One main point — add TWO meaningful elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
