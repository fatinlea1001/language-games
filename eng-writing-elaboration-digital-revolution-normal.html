<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 3 · ARTICLE · NORMAL</span><h1>Elaboration Builder</h1><p class="subtitle">💬 The Digital Revolution · Article Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"How Technology Has Transformed Communication","bullet":"explain how technology has changed communication","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which sentence introduces the FIRST exam bullet as a topic?","hint":"Open generally with changes in communication, before stating Point 1.","correct":2,"options":[["To begin with, communication has always played a significant role in human society.","It overlooks the technological transformation required by the bullet."],["To begin with, digital devices have become increasingly attractive to young consumers.","It discusses device appeal rather than changes in communication."],["To begin with, there are various ways technology has transformed modern communication.","It previews multiple changes without merging in the first specific main point."]]},{"tag":"POINT 1 — First change","question":"Which first POINT describes a genuine change in communication?","hint":"Think about how people exchange written information today.","correct":0,"options":[["One significant change is the growing popularity of instant messaging.","Instant messaging identifies a specific shift in communication methods."],["One significant change is that teenagers can personalise their phone settings.","Phone settings are a device feature, not a way people communicate."],["One significant change is the increasing price of internet devices.","Device prices are not a communication method."]]},{"tag":"POINT 1 — Explanation","question":"Which explanation shows HOW instant messaging helps people?","hint":"Focus on exchanging information quickly across distances.","correct":1,"options":[["Platforms such as WhatsApp are popular because many people frequently use these popular platforms.","It repeats the popularity claim without explaining a communication benefit."],["Platforms such as WhatsApp facilitate rapid exchanges of information, even when users are in different locations.","It explains the practical improvement and correctly uses facilitate."],["Platforms such as WhatsApp provide entertainment because users can customise their display pictures.","Profile decoration is not how messaging improves information exchange."]]},{"tag":"POINT 1 — Example","question":"Which concrete EXAMPLE supports the first change?","hint":"Think about coordinating schoolwork without a physical meeting.","correct":2,"options":[["For instance, students can select colourful chat themes before studying with friends.","Changing app themes does not illustrate information exchange."],["For instance, students can communicate through messages because messaging applications send messages.","This circular example merely restates the definition of messaging."],["For instance, students can discuss group assignments and share important updates without meeting in person.","It gives a specific and believable school communication situation."]]},{"tag":"POINT 2 — Another change","question":"Which second point is genuinely DIFFERENT from instant messaging?","hint":"Choose a communication method with faces and voices.","correct":0,"options":[["Another major change is the widespread use of video calls.","Video calls add a different digital method of communication."],["Another major change is the increasing number of text-messaging applications.","More text-message apps repeat the first point."],["Another major change is that students enjoy watching educational videos.","Watching videos does not necessarily involve communicating with another person."]]},{"tag":"POINT 2 — Explanation","question":"Which explanation shows what VIDEO calls add?","hint":"Focus on visual and vocal cues instead of typed text.","correct":1,"options":[["Unlike ordinary text messages, video calls help users type short replies more efficiently.","Typing replies explains messaging, not the particular advantage of video calls."],["Unlike ordinary text messages, video calls allow people to see facial expressions and hear one another's voices.","Faces and voices clarify the distinct feature of video communication."],["Unlike ordinary text messages, video calls guarantee that every difficult conversation ends peacefully.","No communication technology can guarantee conflict-free conversations."]]},{"tag":"POINT 2 — Result","question":"What reasonable RESULT follows from more personal remote contact?","hint":"Think about maintaining relationships across distance.","correct":2,"options":[["Consequently, relatives who live overseas never need to meet face to face again.","It makes an exaggerated claim that personal visits become unnecessary."],["Consequently, students can avoid attending all school activities and lessons.","Avoiding school has no direct connection to family video calls."],["Consequently, family members living far apart can maintain closer and more personal connections.","It gives a proportionate social effect of regular video conversations."]]}]},{"title":"Benefits and Drawbacks of Digital Communication","bullet":"describe one positive and one negative effect of this change","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening sentence prepares the reader for TWO contrasting effects?","hint":"Echo the requirement for both a positive and a negative impact.","correct":0,"options":[["Furthermore, this change in communication has brought both positive and negative effects.","It presents the contrasting scope of the paragraph without choosing a point yet."],["Furthermore, the cost of different electronic devices continues to increase each year.","Device cost changes the topic away from communication's effects."],["Furthermore, online platforms are becoming popular among many different groups.","Popularity does not preview the positive and negative effects requested."]]},{"tag":"POINT 1 — Positive effect","question":"Which positive effect follows from faster communication?","hint":"Consider receiving useful information when time matters.","correct":1,"options":[["One positive effect is that students can decorate their phone cases more creatively.","Decorating devices is not an effect on communication."],["One positive effect is that people can receive important information almost immediately.","Fast access to important information is a distinct practical benefit."],["One positive effect is that all online information is completely reliable.","Online information is not always reliable; this claim is false."]]},{"tag":"POINT 1 — Example","question":"Which example demonstrates timely communication in a serious situation?","hint":"Use a clear emergency context involving a trusted adult.","correct":2,"options":[["For example, a teenager can adjust the notification sound before an emergency happens.","Changing sounds does not explain getting urgent help."],["For example, during an emergency, a teenager can share unrelated photographs with classmates.","Sending unrelated photographs does not support emergency communication."],["For example, during an emergency, a teenager can contact a parent and explain the situation without delay.","It illustrates useful, rapid contact in a believable situation."]]},{"tag":"POINT 1 — Result","question":"What result reasonably follows from being able to reach someone?","hint":"Connect quick contact to practical assistance and reduced anxiety.","correct":0,"options":[["As a result, help can be arranged more quickly, which may reduce worry and confusion.","It links the example to realistic help and emotional reassurance."],["As a result, every emergency can be resolved immediately without outside assistance.","It guarantees a perfect outcome that quick contact cannot ensure."],["As a result, people no longer need to make careful decisions during emergencies.","Fast contact does not remove the need for careful judgement."]]},{"tag":"POINT 2 — Negative effect","question":"Which contrasting point identifies a social DISADVANTAGE?","hint":"Move from fast access to the quality of in-person relationships.","correct":1,"options":[["However, another positive effect is the ability to share messages instantly.","This repeats a benefit rather than answering the negative side."],["However, one negative effect is the decline in meaningful face-to-face interaction.","It directly identifies a relevant social cost, with a logical contrast."],["However, one negative effect is that some phones have limited storage space.","Phone storage is a device limitation, not a negative effect on communication."]]},{"tag":"POINT 2 — Example","question":"Which example explains how face-to-face interaction can suffer?","hint":"Think about divided attention at home.","correct":2,"options":[["Some teenagers keep their phones away while listening carefully to family members.","Putting phones away would strengthen, not undermine, conversations."],["Some teenagers use video calls to remain connected to relatives abroad.","Contacting distant relatives is a positive effect, not this drawback."],["Some teenagers repeatedly check notifications while spending time with family, making others feel ignored.","Repeated notifications during family time show how personal interaction is disrupted."]]},{"tag":"POINT 2 — Result","question":"What realistic long-term RESULT may follow from repeated inattention?","hint":"Choose gradual relationship harm without claiming it always happens.","correct":0,"options":[["If this becomes a habit, their personal relationships may deteriorate over time.","It describes a plausible worsening of relationships using an appropriate C1 word."],["If this happens once, every family relationship will immediately be destroyed.","A single incident does not guarantee immediate relationship breakdown."],["If this becomes a habit, everyone will completely stop using smartphones.","Repeated distraction does not imply all phone use will stop."]]}]},{"title":"One Responsible Technology-Use Strategy","bullet":"suggest one way to ensure young people use technology responsibly","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the SINGLE required suggestion?","hint":"Echo the bullet about responsible technology use, before naming the strategy.","correct":1,"options":[["Finally, technological innovation has created numerous opportunities for the global economy.","The global economy is outside the scope of this advice bullet."],["Finally, there is one practical way to ensure young people use technology responsibly.","It previews one practical response to the specific question."],["Finally, there are several ways people can communicate with their classmates.","This restates the first bullet instead of introducing responsible use."]]},{"tag":"POINT 1 — Suggested method","question":"Which action offers a realistic way to use technology responsibly?","hint":"Choose balanced boundaries, not complete avoidance or spending.","correct":2,"options":[["One effective approach is to replace a smartphone with a newer and more expensive model.","Buying new devices does not address excessive use."],["One effective approach is to ban all communication between friends after school.","Banning communication entirely is extreme and unnecessary."],["One effective approach is to establish clear screen-time boundaries.","Clear time boundaries offer an actionable strategy with realistic flexibility."]]},{"tag":"POINT 1 — Explanation","question":"HOW does the suggested approach help balance responsibilities?","hint":"Explain the connection between limits and attention to studies and people.","correct":0,"options":[["By setting specific times for online activities, teenagers can manage their devices without neglecting studies or personal relationships.","It explains how scheduled use protects schoolwork and relationships."],["By setting specific times online, teenagers can use every remaining hour for entertainment.","This encourages excessive entertainment instead of balance."],["By setting specific times online, teenagers will automatically become successful in every subject.","Time limits alone cannot guarantee academic success in every subject."]]},{"tag":"POINT 1 — Example","question":"Which concrete example applies boundaries to everyday routines?","hint":"Think about concentrating during study and being present at meals.","correct":1,"options":[["For example, they could leave notifications on during revision to remain constantly connected.","Constant alerts undermine the purpose of focused study."],["For example, they could silence notifications during revision and keep their phones away at mealtimes.","It provides two realistic behaviours that demonstrate the same boundary."],["For example, they could buy a second device to use while studying.","An extra device does not reduce distraction or define a limit."]]},{"tag":"POINT 1 — Further elaboration","question":"Which sentence adds a deeper REASON for the same strategy?","hint":"Explain the value the habits help young people remember.","correct":2,"options":[["These small habits can reinforce the idea that online messages should always interrupt real conversations.","This reverses the intended priority and encourages interruptions."],["These small habits can reinforce the idea that students must avoid all digital communication permanently.","Permanent digital avoidance is an extreme, unsupported goal."],["These small habits can reinforce the idea that face-to-face communication deserves as much attention as online messages.","It links boundaries to respectful face-to-face relationships using reinforce accurately."]]},{"tag":"POINT 1 — Result","question":"What is a balanced and realistic final EFFECT?","hint":"Show that technology stays helpful when managed well.","correct":0,"options":[["Ultimately, such boundaries allow young people to benefit from technology while maintaining a healthier balance in daily life.","It captures the sensible overall outcome without rejecting digital tools."],["Ultimately, such boundaries ensure young people will never experience another distraction.","No single strategy can eliminate every distraction forever."],["Ultimately, such boundaries allow young people to avoid school and household responsibilities.","Avoiding responsibilities contradicts the goal of responsible technology use."]]}]}];
const vocab={"facilitate":["C1","memudahkan / melancarkan"],"deteriorate":["C1","merosot / menjadi semakin buruk"],"reinforce":["C1","mengukuhkan / memperteguh"],"transformed":["B2","mengubah secara besar"],"significant":["B2","penting / ketara"],"platforms":["B2","platform / saluran digital"],"rapid":["B2","pantas"],"widespread":["B2","meluas"],"consequently":["B2","oleh itu / akibatnya"],"meaningful":["B2","bermakna"],"interaction":["B2","interaksi"],"notifications":["B2","pemberitahuan"],"boundaries":["B2","had / batasan"],"neglecting":["B2","mengabaikan"],"maintaining":["B2","mengekalkan"],"responsibly":["B2","dengan bertanggungjawab"]};

}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full article in your notebook</strong><p>It should contain your title, byline, introduction, all three developed body paragraphs and conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — develop it with four detailed elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
