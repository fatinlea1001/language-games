.malay {

.green {

}

.instructions {

.result {

  margin: 18px 0;

}

.percentage {
  font-size: 32px;
  font-weight: bold;
  color: #178a46;
}

.progress {
  background: #c3e4ce;
  height: 10px;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: #31b76a;
  transition: width 0.3s;
}

.buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 20px 0;
}

button {
  background: #d65193;
  border: none;
  color: white;
  padding: 12px 17px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #b83d7a;
}

button.secondary {
  background: #9b7893;
}

.question {
  padding: 16px 0;
  border-bottom: 1px solid #f0dce5;
}

.question-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.number {
  background: #f8e5ef;
  border-radius: 8px;
  padding: 10px;
  min-width: 39px;
  text-align: center;
  font-weight: bold;
  color: #aa4680;
}

.verb {
  font-size: 17px;
}

.answer-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 10px 0 0 51px;
}

.answer-row input {
  flex: 1;
  min-width: 0;
  border: 2px solid #ead0de;
  border-radius: 8px;
  padding: 11px;
  font-size: 16px;
}

.answer-row input:focus {
  outline: none;
  border-color: #d65193;
}

.answer-row input.correct {
  border-color: #25a45a;
  background: #effff3;
}

.answer-row input.wrong {
  border-color: #e65a72;
  background: #fff0f2;
}

.status {
  font-size: 23px;
  font-weight: bold;
  min-width: 24px;
}

.correct-icon {
  color: #159447;
}

.wrong-icon {
  color: #df425c;
}

.answer-key {
  display: none;
  margin: 8px 0 0 51px;
  color: #168548;
  font-size: 14px;
  line-height: 1.6;
}

.footer {
  text-align: center;
  font-size: 12px;
  color: #a98799;
  margin-top: 25px;
}

@media (max-width:480px) {
  .container { padding: 15px; }
  .answer-row { margin-left: 0; }
  .answer-key { margin-left: 0; }
  button { flex: 1; }
  h1 { font-size: 24px; }
}
</style>
</head>

<body>
<div class="container">

<h1>🌸 Verb → Noun Quiz 🌸</h1>
<p class="subtitle">Set 2 | 20 Words | B1–B2</p>

<!-- CUTE CHIBI ILLUSTRATION -->

<p>Let's learn new words! ✨</p>

</div>

<!-- WORKED EXAMPLE -->
<div class="example">
  <h3>✨ Example / Contoh</h3>

  <strong>Verb:</strong> move<br>
  <span class="malay">Bergerak</span>
  <br>

  <strong>Noun:</strong>
  <span class="green">movement</span><br>
  <span class="malay">Pergerakan</span>
</div>

<p class="instructions">
  <strong>Instructions:</strong><br>
  Change each verb into its correct noun form.
  Type only the missing word.
  <br>
  <strong>Example:</strong> move → movement
</p>

<!-- RESULTS -->
<div class="result" id="result" aria-live="polite">
  <div id="scoreText"></div>
  <div class="percentage" id="percentage"></div>

  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- BUTTONS -->
<div class="buttons">
  <button onclick="checkAnswers()">✓ Check</button>
  <button id="answersBtn" onclick="toggleAnswers()">
    Answers
  </button>
  <button class="secondary" onclick="resetQuiz()">
    ↻ Reset
  </button>
</div>

<!-- QUESTIONS -->
<div id="quiz"></div>

<div class="buttons">
  <button onclick="checkAnswers()">
    Check My Answers
  </button>
</div>

<div class="footer">
  Keep practising! Every word counts. 🌷
</div>

</div>

<script>

const questionBank = [
  {
    verb: "achieve",
    noun: "achievement",
    article: "an",
    bm: "pencapaian"
  },
  {
    verb: "develop",
    noun: "development",
    article: "",
    bm: "perkembangan"
  },
  {
    verb: "improve",
    noun: "improvement",
    article: "an",
    bm: "penambahbaikan"
  },
  {
    verb: "protect",
    noun: "protection",
    article: "",
    bm: "perlindungan"
  },
  {
    verb: "educate",
    noun: "education",
    article: "",
    bm: "pendidikan"
  },
  {
    verb: "create",
    noun: "creation",
    article: "a",
    bm: "penciptaan"
  },
  {
    verb: "prepare",
    noun: "preparation",
    article: "",
    bm: "persediaan"
  },
  {
    verb: "celebrate",
    noun: "celebration",
    article: "a",
    bm: "perayaan"
  },
  {
    verb: "communicate",
    noun: "communication",
    article: "",
    bm: "komunikasi"
  },
  {
    verb: "compete",
    noun: "competition",
    article: "a",
    bm: "pertandingan"
  },
  {
    verb: "describe",
    noun: "description",
    article: "a",
    bm: "penerangan"
  },
  {
    verb: "perform",
    noun: "performance",
    article: "a",
    bm: "persembahan"
  },
  {
    verb: "discover",
    noun: "discovery",
    article: "a",
    bm: "penemuan"
  },
  {
    verb: "explore",
    noun: "exploration",
    article: "",
    bm: "penerokaan"
  },
  {
    verb: "inform",
    noun: "information",
    article: "",
    bm: "maklumat"
  },
  {
    verb: "encourage",
    noun: "encouragement",
    article: "",
    bm: "galakan"
  },
  {
    verb: "punish",
    noun: "punishment",
    article: "",
    bm: "hukuman"
  },
  {
    verb: "entertain",
    noun: "entertainment",
    article: "",
    bm: "hiburan"
  },
  {
    verb: "choose",
    noun: "choice",
    article: "a",
    bm: "pilihan"
  },
  {
    verb: "succeed",
    noun: "success",
    article: "",
    bm: "kejayaan"
  }
];

let questions = [...questionBank];
let answersVisible = false;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function clearMarks() {
  document.getElementById("result").style.display = "none";

  document.querySelectorAll(".answer-row input").forEach(input => {
    input.classList.remove("correct", "wrong");
  });

  document.querySelectorAll(".status").forEach(status => {
    status.textContent = "";
    status.className = "status";
  });
}

function loadQuiz() {
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";

  questions.forEach((q, index) => {
    const div = document.createElement("div");
    div.className = "question";

    div.innerHTML = `
      <div class="question-top">
        <span class="number">${index + 1}</span>
        <span class="verb">verb: <b>${q.verb}</b></span>
      </div>

      <div class="answer-row">
        <span>noun: ${q.article}</span>
        <input
          type="text"
          id="answer${index}"
          placeholder="Your answer"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >
        <span class="status" id="status${index}"></span>
      </div>

      <div class="answer-key" id="key${index}">
        <strong>Answer:</strong> ${q.noun}
        <br>
        <strong>BM:</strong> ${q.bm}
      </div>
    `;

    quiz.appendChild(div);

    document.getElementById("answer" + index)
      .addEventListener("input", clearMarks);

    document.getElementById("key" + index)
      .style.display = answersVisible ? "block" : "none";
  });

  document.getElementById("result").style.display = "none";
}

function checkAnswers() {
  let score = 0;

  questions.forEach((q, index) => {
    const input = document.getElementById("answer" + index);
    const status = document.getElementById("status" + index);

    const userAnswer = input.value.trim().toLowerCase();
    const correctAnswer = q.noun.toLowerCase();

    input.classList.remove("correct", "wrong");

    if (userAnswer === correctAnswer) {
      score++;
      input.classList.add("correct");
      status.textContent = "✓";
      status.className = "status correct-icon";
    } else {
      input.classList.add("wrong");
      status.textContent = "✕";
      status.className = "status wrong-icon";
    }
  });

  const percent = Math.round(
    (score / questions.length) * 100
  );

  document.getElementById("scoreText").innerHTML =
    `You have <b>${score}</b> correct answers
    from a possible <b>${questions.length}</b>.`;

  document.getElementById("percentage").textContent =
    percent + "%";

  document.getElementById("progressFill").style.width =
    percent + "%";

  document.getElementById("result").style.display = "block";

  document.getElementById("result").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function toggleAnswers() {
  answersVisible = !answersVisible;

  questions.forEach((q, index) => {
    document.getElementById("key" + index).style.display =
      answersVisible ? "block" : "none";
  });

  document.getElementById("answersBtn").textContent =
    answersVisible ? "Hide Answers" : "Answers";
}

function resetQuiz() {
  questions = shuffle([...questionBank]);
  answersVisible = false;

  document.getElementById("answersBtn").textContent = "Answers";

  loadQuiz();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

loadQuiz();

</script>
</body>
</html>
