<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#194d51"><meta name="description" content="Teenagers and Pets — EASY SPM Writing Part 3 Article Elaboration Builder with 4/5/5 sentence paragraphs and BM word hints."><title>SPM Elaboration Builder — Teenagers and Pets (EASY)</title><style>
:root{--ink:#253943;--muted:#617580;--teal:#237f80;--deep:#194d51;--border:#dce8e9;--soft:#f2f8f8;--mint:#e6f7ed;--green:#1e7450;--red:#a3344f;--rose:#fff0f2;--gold:#b47715}

.subtitle{margin:0;color:var(--muted)}

p,li{line-height:1.7}p{margin:9px 0}ol,ul{padding-left:23px}
.small{color:var(--muted);font-size:.9rem}.tiny{color:var(--muted);font-size:.78rem}
.exam{background:var(--soft);border:1px solid #d0e4e4;border-radius:17px;padding:16px 18px;margin:17px 0}
.exam strong{color:var(--deep)}.exam ul{margin:8px 0}.exam li{margin:5px 0}
label.name{display:block;margin-top:23px;margin-bottom:8px;font-weight:800}
input[type=text]{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid #bedbda;background:white}
textarea{width:100%;min-height:145px;resize:vertical;padding:15px;border-radius:13px;border:2px solid #bedbda;background:white;color:var(--ink);font:inherit;line-height:1.65}

.primary{background:var(--teal);color:white}.primary:hover:not(:disabled){background:#176264}
.secondary{background:#e6f4f2;color:var(--deep)}.secondary:hover:not(:disabled){background:#d5eeeb}

.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.065em;font-weight:850;color:#357d7a;margin-bottom:6px}

.urgent-reminder .essay-title{padding:11px 14px;background:white;border:1px solid #eeb4ba;border-radius:11px;font-size:1.12rem;font-weight:900;color:#952230;margin:13px 0}
.urgent-reminder .urgent-note{font-size:.92rem;font-weight:650;color:#863740;margin-top:10px}
.paper{background:#fff;border:1px solid #edd7a3;border-radius:14px;padding:15px 17px;margin:15px 0;line-height:1.85}
.confirm{display:flex;align-items:flex-start;gap:12px;line-height:1.55;font-weight:740;margin:20px 0 9px}
.confirm input{accent-color:var(--teal);width:21px;height:21px;flex:0 0 21px;margin:2px 0 0}
.score{font-size:clamp(2.7rem,8vw,4.1rem);font-weight:900;color:var(--teal);line-height:1.1}
.essay{background:#f8fbfa;border:1px solid #dbe9e6;border-radius:15px;padding:16px;margin:17px 0}
.essay p{margin:0 0 15px}.essay p:last-child{margin:0}
.copied{min-height:1.2em;color:var(--green);font-weight:760;font-size:.9rem}
footer{text-align:center;font-size:.77rem;color:#6a8184;margin-top:20px}
@media(max-width:480px){.shell{padding:12px 10px 30px}.panel{border-radius:18px}.choice{padding:12px}.copycheck{padding:14px}.row>button{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{body{background:white}.shell{max-width:none}header,.no-print,footer{display:none!important}.panel{border:0;box-shadow:none}.essay{border:0;padding:0}}

/* Set 2 — distinct point and elaboration stages */
.segment{margin:14px 0 11px;border-radius:13px;padding:12px 14px;background:#e8f3fc;border-left:5px solid #5795c1;font-weight:820;color:#2c5878}
.segment.second{background:#fff2db;border-left-color:#d9a33d;color:#805a20}
.draft p{margin:8px 0}
.draft .built-sentence{display:block;line-height:1.7}
.essay-title{overflow-wrap:anywhere}

.vocab{position:relative;display:inline;border-bottom:2px dotted #23808b;color:#176773;font-weight:780;cursor:help;outline-offset:3px}
.vocab-tooltip{position:absolute;z-index:50;left:0;bottom:calc(100% + 7px);min-width:160px;max-width:min(230px,75vw);background:#193c49;color:white;border-radius:9px;padding:9px 11px;font:600 .81rem/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 16px #173d4930;opacity:0;visibility:hidden;pointer-events:none;text-align:left}
.vocab:hover .vocab-tooltip,.vocab:focus .vocab-tooltip,.vocab.is-open .vocab-tooltip{opacity:1;visibility:visible}

.vocab.c1{color:#7947a3;border-bottom-color:#8d63b0}.vocab.c1 .vocab-tooltip{background:#613c81}
.vocab:focus-visible{outline:2px solid #176773;border-radius:3px}

<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 3 · ARTICLE · EASY</span><h1>Elaboration Builder</h1><p class="subtitle">🐾 Teenagers and Pets · Article Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"My Choice of Pet","bullet":"What animal would you choose as a pet?","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the choice of pet?","hint":"Start with a general opening about pet choices.","correct":1,"options":[["To begin with, there are many ways to keep a pet healthy.","This belongs to a different exam bullet rather than the idea required here."],["To begin with, there are many animals that people can keep as pets.","This opens the paragraph about choosing a pet."],["To begin with, pet ownership teaches teenagers good daily habits.","This shifts the paragraph away from its main point and does not develop it."]]},{"tag":"POINT 1 — Main point","question":"Which animal does the writer choose?","hint":"Name the ONE chosen animal, rather than a care method.","correct":2,"options":[["One way to look after a cat is to feed it on time.","This belongs to a different exam bullet rather than the idea required here."],["One benefit of owning a pet is learning to manage my time.","This shifts the paragraph away from its main point and does not develop it."],["One animal I would choose is a cat.","This states the choice of animal clearly."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"Why is this pet a suitable choice?","hint":"Explain what makes the cat a pleasant companion.","correct":0,"options":[["Cats are playful and can keep me company after school.","This develops why the chosen cat is suitable."],["Feeding cats regularly can help keep them healthy.","This belongs to a different exam bullet rather than the idea required here."],["Teenagers can become more responsible when they own pets.","This shifts the paragraph away from its main point and does not develop it."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which example develops the reason for choosing it?","hint":"Give a specific example of spending time with the cat.","correct":1,"options":[["For example, I could wash its blanket every weekend.","This belongs to a different exam bullet rather than the idea required here."],["For example, I could spend time playing with my cat in the living room.","This gives a concrete example related to the cat choice."],["For example, I could follow a timetable to remember my duties.","This shifts the paragraph away from its main point and does not develop it."]]}]},{"title":"Showing Love and Proper Care","bullet":"How do you show love and proper care for your pets?","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces proper pet care?","hint":"Begin by previewing care methods.","correct":2,"options":[["Furthermore, there are several reasons I would choose a cat.","This belongs to a different exam bullet rather than the idea required here."],["Furthermore, owning a pet can improve teenagers' responsibility.","This shifts the paragraph away from its main point and does not develop it."],["Furthermore, there are several ways to show love and proper care for a pet.","This opens the paragraph about caring for pets."]]},{"tag":"POINT 1 — Main point","question":"What is the FIRST way to care for the cat?","hint":"Focus on healthy food and clean water.","correct":0,"options":[["One way is to give my cat healthy food and clean water every day.","This is the first way to provide proper care."],["One reason to choose a cat is that it is friendly.","This belongs to a different exam bullet rather than the idea required here."],["One way to become responsible is to plan daily tasks.","This shifts the paragraph away from its main point and does not develop it."]]},{"tag":"POINT 1 — Elaboration 1 of 1","question":"How does this care benefit the cat, or how will it be provided?","hint":"Develop the first care method with a benefit or concrete detail.","correct":1,"options":[["This teaches teenagers the importance of being punctual.","This belongs to a different exam bullet rather than the idea required here."],["This helps it stay strong and healthy.","This elaborates on the first care method."],["This makes a cat suitable for families who enjoy playful animals.","This shifts the paragraph away from its main point and does not develop it."]]},{"tag":"POINT 2 — Second point","question":"What DIFFERENT second way shows proper care?","hint":"Move to hygiene and a clean sleeping space.","correct":2,"options":[["Another benefit of owning pets is learning patience.","This belongs to a different exam bullet rather than the idea required here."],["Another choice of pet would be a small rabbit.","This shifts the paragraph away from its main point and does not develop it."],["Another way is to keep its sleeping area clean.","This introduces a different second care method."]]},{"tag":"POINT 2 — One elaboration","question":"Which example explains the second way?","hint":"Mention cleaning bedding or the litter box.","correct":0,"options":[["For example, I would wash its blanket and clean the litter box regularly.","This elaborates on the second care method."],["For example, I would choose a cat because it keeps me company.","This belongs to a different exam bullet rather than the idea required here."],["For example, I would prepare a timetable for daily schoolwork.","This shifts the paragraph away from its main point and does not develop it."]]}]},{"title":"How Pets Develop Responsibility","bullet":"In what ways can owning a pet help teenagers become more responsible?","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the responsibility teenagers can develop?","hint":"Preview the connection between pets and responsibility.","correct":1,"options":[["Finally, there are many animals people can choose as pets.","This belongs to a different exam bullet rather than the idea required here."],["Finally, there are several ways owning a pet can make teenagers more responsible.","This opens the paragraph on responsibility."],["Finally, there are several ways to keep pets clean and healthy.","This shifts the paragraph away from its main point and does not develop it."]]},{"tag":"POINT 1 — Main point","question":"What is the FIRST benefit of owning a pet?","hint":"Think about daily habits and routines.","correct":2,"options":[["One way is to select a calm cat that lives indoors.","This belongs to a different exam bullet rather than the idea required here."],["One way is to give the cat fresh drinking water.","This shifts the paragraph away from its main point and does not develop it."],["One way is by teaching them to follow a daily routine.","This gives the first responsibility-related benefit."]]},{"tag":"POINT 1 — Elaboration 1 of 1","question":"How does that benefit work in daily life?","hint":"Give an example that requires consistent action.","correct":0,"options":[["For example, they must feed their pets before leaving for school.","This shows how that benefit develops through daily care."],["For example, a cat might play with me after school.","This belongs to a different exam bullet rather than the idea required here."],["For example, I could wash its food bowl after meals.","This shifts the paragraph away from its main point and does not develop it."]]},{"tag":"POINT 2 — Second point","question":"What is another distinct benefit or responsible habit?","hint":"Develop a second responsibility beyond following a routine.","correct":1,"options":[["Another way is to buy toys for my cat to enjoy.","This belongs to a different exam bullet rather than the idea required here."],["Another way is by encouraging teenagers to become conscientious pet owners.","This introduces a second responsibility-related benefit."],["Another way is to choose a cat instead of a rabbit.","This shifts the paragraph away from its main point and does not develop it."]]},{"tag":"POINT 2 — One elaboration","question":"Which explanation develops the second benefit?","hint":"Think about noticing a sick pet and responding properly.","correct":2,"options":[["They learn to select pets that look cute and playful.","This belongs to a different exam bullet rather than the idea required here."],["They learn to choose nutritious food for cats at the shop.","This shifts the paragraph away from its main point and does not develop it."],["They learn to notice when a pet is sick and ask an adult for help.","This develops the new benefit with a realistic response."]]}]}];
const vocab={"conscientious":["C1","teliti dan bersungguh-sungguh dalam menjalankan tanggungjawab"],"responsible":["B2","bertanggungjawab"],"regularly":["B2","secara tetap / kerap"],"routine":["B2","rutin / kegiatan harian"],"encouraging":["B2","menggalakkan"],"proper":["B2","sesuai / betul"]};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const [level,bm]=vocab[word.toLowerCase()];return '<span class="vocab '+(level==="C1"?"c1":"b2")+'" tabindex="0" data-meaning="'+escapeHTML(bm)+'" aria-label="'+escapeHTML(word+" ("+level+"): "+bm)+'">'+word+'<span class="vocab-tooltip">'+level+' · '+escapeHTML(bm)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 3 · Article — Original Exam Task</strong><p>You recently saw this notice in a teen magazine.</p><p><strong>Calling all animal lovers. Articles wanted!</strong></p><p><strong>TEENAGERS AND PETS</strong></p><p>What animal would you choose as a pet? How do you show love and proper care for your pets? In what ways can owning a pet help teenagers become more responsible?</p><p>The best article will be published in our teen magazine next month.</p><p><strong>Write your article.</strong></p></div>";
const titleReminder=()=>"<div class=\"urgent-reminder\" role=\"note\"><div class=\"urgent-heading\">📕 STOP! WRITE THIS FIRST!</div><p>Write the <strong>ARTICLE TITLE</strong>, <strong>BYLINE</strong> and a <strong>THREE-SENTENCE INTRODUCTION</strong> in your exercise book.</p><div class=\"essay-title\">Teenagers and Pets</div><p style=\"text-align:center\"><strong>Written by: Your Name</strong></p><p class=\"urgent-note\">Follow the Article lesson notes: introduce the topic, give a general statement, and preview the animal choice, proper care and responsible ownership.</p></div>";
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">🐾 Teenagers and Pets · EASY</span><span class="small">A2–B1 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Build a complete SPM article in your exercise book.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the article title, byline and three-sentence introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over underlined vocabulary on a computer, or tap the word on your phone to see its meaning.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Conclusion</span></div><h2>Write Your Conclusion</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR CONCLUSION!</div><p>Write a <strong>TWO-SENTENCE CONCLUSION</strong>: (1) summarise how pets can bring happiness while needing care and (2) advise teenagers to adopt pets only when ready to care for them daily.</p><p class="urgent-note">✍️ Complete your conclusion before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my conclusion in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full article in your notebook</strong><p>It should contain your title, byline, introduction, all three body paragraphs and conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — add ONE elaboration sentence for each point.</p>':'<p class="small">One main point — add TWO elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
