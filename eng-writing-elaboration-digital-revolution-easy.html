<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#194d51"><meta name="description" content="SPM Writing Part 3 EASY Digital Revolution article elaboration builder, with lesson-note paragraph structure and BM C1 vocabulary."><title>SPM Elaboration Builder — Digital Communication (EASY)</title><style>

p,li{line-height:1.7}p{margin:9px 0}ol,ul{padding-left:23px}
.small{color:var(--muted);font-size:.9rem}.tiny{color:var(--muted);font-size:.78rem}

.urgent-reminder .essay-title{padding:11px 14px;background:white;border:1px solid #eeb4ba;border-radius:11px;font-size:1.12rem;font-weight:900;color:#952230;margin:13px 0}
.urgent-reminder .urgent-note{font-size:.92rem;font-weight:650;color:#863740;margin-top:10px}
.paper{background:#fff;border:1px solid #edd7a3;border-radius:14px;padding:15px 17px;margin:15px 0;line-height:1.85}
.confirm{display:flex;align-items:flex-start;gap:12px;line-height:1.55;font-weight:740;margin:20px 0 9px}
.confirm input{accent-color:var(--teal);width:21px;height:21px;flex:0 0 21px;margin:2px 0 0}

.essay{background:#f8fbfa;border:1px solid #dbe9e6;border-radius:15px;padding:16px;margin:17px 0}
.essay p{margin:0 0 15px}.essay p:last-child{margin:0}
.copied{min-height:1.2em;color:var(--green);font-weight:760;font-size:.9rem}
footer{text-align:center;font-size:.77rem;color:#6a8184;margin-top:20px}
@media(max-width:480px){.shell{padding:12px 10px 30px}.panel{border-radius:18px}.choice{padding:12px}.copycheck{padding:14px}.row>button{flex:1 1 100%}}

.segment{margin:14px 0 11px;border-radius:13px;padding:12px 14px;background:#e8f3fc;border-left:5px solid #5795c1;font-weight:820;color:#2c5878}

.vocab:hover .vocab-tooltip,.vocab:focus .vocab-tooltip,.vocab.is-open .vocab-tooltip{opacity:1;visibility:visible}

.vocab.c1{color:#7947a3;border-bottom-color:#8d63b0}.vocab.c1 .vocab-tooltip{background:#613c81}

<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 3 · ARTICLE · EASY</span><h1>Elaboration Builder</h1><p class="subtitle">💬 The Digital Revolution · Article Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"How Technology Has Changed Communication","bullet":"explain how technology has changed communication","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which sentence OPENS the first content paragraph?","hint":"Use the exact bullet idea and a general opening, before Point 1.","correct":1,"options":[["To begin with, communication is something people have always needed.","This is too general and does not mention technology's changes."],["To begin with, there are several ways technology has changed communication.","The opening previews the changes in communication without introducing the first example."],["To begin with, technology is an important topic for teenagers.","This only says technology matters, without previewing changes in communication."]]},{"tag":"POINT 1 — First change","question":"What is ONE way communication has changed?","hint":"Choose a type of communication, not a general phone activity.","correct":0,"options":[["One change is instant messaging.","Instant messaging is a clear, specific change in how people communicate."],["One change is that teenagers like mobile phone covers.","Phone accessories are not a form of communication."],["One change is that students find it harder to write long essays.","Essay writing does not explain how everyday communication has changed."]]},{"tag":"POINT 1 — Explanation","question":"WHY has instant messaging changed communication?","hint":"Explain the real speed benefit without repeating the main point.","correct":2,"options":[["This is because instant messaging is a very quick way of sending messages quickly.","This repeats 'quick' without adding a useful reason or detail."],["This is because people can play games on smartphones at school.","Playing mobile games is unrelated to exchanging messages."],["This is because people can send messages to others within seconds.","It explains how messaging makes information exchange almost immediate."]]},{"tag":"POINT 1 — Example","question":"Which example shows instant messaging in real life?","hint":"Think of a school-related message between classmates.","correct":1,"options":[["For example, students can download WhatsApp wallpapers after school.","Changing wallpapers does not show communication."],["For example, students can use WhatsApp to discuss homework after school.","A familiar, specific example demonstrates a practical messaging use."],["For example, students can send messages, which are messages sent through apps.","This circles back to a definition instead of giving a specific situation."]]},{"tag":"POINT 2 — Second change","question":"Which sentence introduces a DIFFERENT communication change?","hint":"Move away from text messages to communication with sight and sound.","correct":0,"options":[["Another change is video calling.","Video calling is distinct from instant text messaging."],["Another change is that students can message friends using a different messaging app.","A second messaging app repeats the first change instead of adding a different one."],["Another change is that everyone now prefers paper letters.","The claim that everyone prefers letters is unsupported and does not fit the digital change."]]},{"tag":"POINT 2 — Explanation","question":"HOW does video calling help people?","hint":"Think about seeing a person who lives in another place.","correct":2,"options":[["People can now send more written messages using their phones.","Sending texts explains messaging again, not video calling."],["People can now watch online films without meeting their relatives.","Watching films is not the same as communicating with a relative."],["People can now see their loved ones even when they live far away.","This directly explains the visual connection made possible by a video call."]]},{"tag":"POINT 2 — Result","question":"What is a reasonable RESULT of video calls?","hint":"Think about keeping relationships strong despite distance.","correct":1,"options":[["As a result, families will never need to visit each other again.","It makes an exaggerated prediction about never visiting family."],["As a result, families can stay close without travelling.","This is a realistic relationship benefit that follows from video calls."],["As a result, teenagers can finish their maths homework more quickly.","Finishing maths homework is not the relevant result of family video calls."]]}]},{"title":"Positive and Negative Effects","bullet":"describe one positive and one negative effect of this change","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which sentence OPENS the effects paragraph?","hint":"Mention BOTH a positive and a negative effect before naming either one.","correct":0,"options":[["Furthermore, there are both positive and negative effects of this change in communication.","It previews both sides of the question in one general sentence."],["Furthermore, there are many interesting smartphones sold in shops.","Phone sales do not address the effects of changing communication."],["Furthermore, communication is very important to everyone in every situation.","This vague claim does not show the required positive-and-negative focus."]]},{"tag":"POINT 1 — Positive effect","question":"What is ONE POSITIVE effect of digital communication?","hint":"Choose a practical benefit to people, not a phone feature.","correct":2,"options":[["One positive effect is that phone screens can look attractive.","Screen appearance is unrelated to communication's effects."],["One positive effect is that people always have unlimited internet access.","Unlimited internet for everyone is an unsupported claim."],["One positive effect is that people can get help more quickly.","Getting help quickly is a clear benefit of faster communication."]]},{"tag":"POINT 1 — Example","question":"Which example shows someone getting help quickly?","hint":"Think of a teenager contacting a trusted adult.","correct":1,"options":[["For example, teenagers can change their phone background when they are worried.","Changing a wallpaper does not solve a communication problem."],["For example, teenagers can call their parents immediately when they have a problem.","Calling a parent during a problem directly illustrates the benefit."],["For example, teenagers can stop doing homework whenever their phone rings.","Interrupting homework does not show receiving timely help."]]},{"tag":"POINT 1 — Result","question":"What is a realistic RESULT of reaching parents quickly?","hint":"Focus on how help can affect a teenager's sense of safety.","correct":0,"options":[["Therefore, they can feel safer when they are away from home.","Feeling safer is a reasonable emotional result of being able to seek help."],["Therefore, they will never experience problems outside their homes.","It exaggerates the effect by claiming all problems disappear."],["Therefore, they can win every school competition they join.","Winning competitions does not follow from contacting parents."]]},{"tag":"POINT 2 — Negative effect","question":"Which sentence states the NEGATIVE effect?","hint":"Contrast the earlier benefit with a problem for relationships.","correct":2,"options":[["However, another positive effect is that people can send messages very quickly.","This introduces another benefit instead of the required negative effect."],["However, one negative effect is that the Internet sometimes loads slowly.","Internet speed is a technical inconvenience, not the chosen relationship problem."],["However, one negative effect is that people may spend less time talking face to face.","It identifies a social drawback and uses an appropriate contrasting link."]]},{"tag":"POINT 2 — Example","question":"What example shows reduced face-to-face interaction?","hint":"Think of phone use while relatives are sitting together.","correct":1,"options":[["Some teenagers choose to talk more politely during family meals.","Polite conversations would improve, not reduce, face-to-face contact."],["Some teenagers keep checking their phones during family meals.","Checking phones at the table shows how attention shifts away from relatives."],["Some teenagers enjoy video calling family members who live overseas.","Calling distant relatives illustrates a benefit, not this negative effect."]]},{"tag":"POINT 2 — Result","question":"What is a logical RESULT of regularly ignoring family members?","hint":"Choose a gradual, believable relationship effect; one advanced word is used here.","correct":0,"options":[["As a result, their family relationships may deteriorate over time.","The gradual worsening of relationships follows logically from repeated inattention."],["As a result, their family relationships are guaranteed to end immediately.","It overstates the effect as immediate and certain."],["As a result, their teachers will cancel their school examinations.","School examinations are unrelated to conversation during meals."]]}]},{"title":"One Way to Use Technology Responsibly","bullet":"suggest one way to ensure young people use technology responsibly","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which sentence OPENS the final advice paragraph?","hint":"The question requests ONE way to use technology responsibly.","correct":2,"options":[["Finally, there are several unrelated inventions in the world today.","Unrelated inventions do not preview responsible use."],["Finally, young people spend many hours using different social media apps.","Describing app use does not introduce a responsible-use strategy."],["Finally, there is one simple way to ensure young people use technology responsibly.","It previews a single practical suggestion in the question's wording."]]},{"tag":"POINT 1 — One suggestion","question":"Which ONE action encourages responsible technology use?","hint":"Think about limiting time rather than avoiding all technology.","correct":1,"options":[["One way is to buy a newer smartphone every year.","Buying newer devices does not control unhealthy use."],["One way is to set a daily screen-time limit.","A daily time limit is practical, measurable and relevant."],["One way is to stop speaking to friends at school.","Avoiding friends is harmful and not a responsible technology strategy."]]},{"tag":"POINT 1 — Explanation","question":"WHY is a screen-time limit helpful?","hint":"Think about making room for study and offline life.","correct":0,"options":[["This helps teenagers spend enough time on homework and other activities.","It explains how limits create time for important responsibilities."],["This helps teenagers spend more time choosing interesting phone cases.","Phone accessories have nothing to do with balancing time."],["This helps teenagers use their phones for every activity all day.","Using phones for everything contradicts the idea of limits."]]},{"tag":"POINT 1 — Example","question":"What is a REALISTIC example of a daily time limit?","hint":"Choose an action with a clear condition and duration.","correct":2,"options":[["For example, they can keep checking notifications while completing homework.","Constant notifications undermine concentration and set no limit."],["For example, they can buy several phones to use at the same time.","Owning multiple devices is not an example of limiting screen time."],["For example, they can use their phones for one hour after finishing their work.","The one-hour allowance after work gives a specific, workable rule."]]},{"tag":"POINT 1 — Further advice","question":"Which small habit strengthens the same responsible-use strategy?","hint":"Focus on paying attention to people during conversations.","correct":1,"options":[["They should also use their phones during every conversation.","Using phones during every conversation weakens face-to-face attention."],["They should also put their phones away when talking to family members.","Putting devices away extends the same boundary into family time."],["They should also ignore their parents when messages appear.","Ignoring parents directly contradicts respectful communication."]]},{"tag":"POINT 1 — Result","question":"What RESULT connects the screen-time advice to the topic?","hint":"Show balance: technology remains useful but does not replace people.","correct":0,"options":[["As a result, they can enjoy technology without ignoring the people around them.","The outcome describes balanced and responsible communication."],["As a result, they will never need to communicate online again.","It wrongly suggests abandoning online communication entirely."],["As a result, they can avoid all personal responsibilities.","Avoiding responsibilities is the opposite of responsible technology use."]]}]}];
const vocab={"deteriorate":["C1","merosot / menjadi semakin buruk"],"responsibly":["B2","dengan penuh tanggungjawab"],"screen-time":["B2","masa penggunaan skrin"],"instant messaging":["B2","pemesejan segera"],"video calling":["B2","panggilan video"],"negative":["B2","buruk / negatif"],"communication":["B2","komunikasi"],"relationships":["B2","hubungan"],"immediately":["B2","dengan segera"],"notifications":["B2","pemberitahuan"]};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const [level,bm]=vocab[word.toLowerCase()];return '<span class="vocab '+(level==="C1"?"c1":"b2")+'" tabindex="0" data-meaning="'+escapeHTML(bm)+'" aria-label="'+escapeHTML(word+" ("+level+"): "+bm)+'">'+word+'<span class="vocab-tooltip">'+level+' · '+escapeHTML(bm)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 3 · Article — Original Exam Task</strong><p><strong>Articles wanted!</strong></p><p><strong>The Digital Revolution: How We Talk Today</strong></p><p>Technology has significantly changed the way people communicate with each other. We want your views!</p><p>Write an article for the school magazine discussing the ways people communicate.</p><p><strong>You must:</strong></p><ul><li>explain how technology has changed communication</li><li>describe one positive and one negative effect of this change</li><li>suggest one way to ensure young people use technology responsibly</li></ul><p>The best article will be published in the school magazine.</p></div>";
const titleReminder=()=>"<div class=\"urgent-reminder\" role=\"note\"><div class=\"urgent-heading\">📕 STOP! WRITE THIS FIRST!</div><p>Write the <strong>ARTICLE TITLE, BYLINE (Written by: Your Name)</strong> and a <strong>THREE-SENTENCE INTRODUCTION</strong> in your exercise book.</p><div class=\"essay-title\">The Digital Revolution: How We Talk Today<br><small>Written by: Your Name</small></div><p class=\"urgent-note\">1. Topic introduction → 2. General statement → 3. Thesis covering the three bullets. Complete this in your notebook before starting.</p></div>";
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">💬 Digital Communication · EASY</span><span class="small">A2–B1 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Build a complete SPM article in your exercise book.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the article title, byline AND introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over underlined vocabulary on a computer, or tap the word on your phone to see its meaning.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Conclusion</span></div><h2>Write Your Conclusion</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR CONCLUSION!</div><p>Write a <strong>TWO-SENTENCE CONCLUSION</strong> about digital communication: (1) summary or judgement and (2) practical advice or action.</p><p class="urgent-note">✍️ Complete your conclusion before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my conclusion in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full article in your notebook</strong><p>It should contain your title, byline, introduction, all three body paragraphs and conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — add four elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
