<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#194d51"><meta name="description" content="SPM Writing Part 2 NORMAL e-books game with fuller elaborations and hoverable B2/C1 vocabulary."><title>SPM Elaboration Builder — E-books (NORMAL)</title><style>

p,li{line-height:1.7}p{margin:9px 0}ol,ul{padding-left:23px}
.small{color:var(--muted);font-size:.9rem}.tiny{color:var(--muted);font-size:.78rem}

.urgent-reminder .urgent-note{font-size:.92rem;font-weight:650;color:#863740;margin-top:10px}
.paper{background:#fff;border:1px solid #edd7a3;border-radius:14px;padding:15px 17px;margin:15px 0;line-height:1.85}
.confirm{display:flex;align-items:flex-start;gap:12px;line-height:1.55;font-weight:740;margin:20px 0 9px}
.confirm input{accent-color:var(--teal);width:21px;height:21px;flex:0 0 21px;margin:2px 0 0}
.score{font-size:clamp(2.7rem,8vw,4.1rem);font-weight:900;color:var(--teal);line-height:1.1}
.essay{background:#f8fbfa;border:1px solid #dbe9e6;border-radius:15px;padding:16px;margin:17px 0}
.essay p{margin:0 0 15px}.essay p:last-child{margin:0}

footer{text-align:center;font-size:.77rem;color:#6a8184;margin-top:20px}
@media(max-width:480px){.shell{padding:12px 10px 30px}.panel{border-radius:18px}.choice{padding:12px}.copycheck{padding:14px}.row>button{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{body{background:white}.shell{max-width:none}header,.no-print,footer{display:none!important}.panel{border:0;box-shadow:none}.essay{border:0;padding:0}}

/* Distinct point and elaboration stages */

.vocab:hover .vocab-tooltip,.vocab:focus .vocab-tooltip,.vocab.is-open .vocab-tooltip{opacity:1;visibility:visible}

</style></head>
<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 2 · NORMAL</span><h1>Elaboration Builder</h1><p class="subtitle">📚 E-books &amp; Teenage Reading · Guided Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"Benefits of Reading E-books","bullet":"benefits of reading e-books","plural":true,"steps":[{"tag":"POINT 1 — Choose the first benefit","question":"Which sentence clearly introduces the FIRST benefit?","hint":"Focus on the convenience of carrying and reading books.","correct":1,"options":[["To begin with, e-books make printed books completely unnecessary.","This makes an extreme claim rather than identifying a balanced benefit."],["To begin with, e-books are convenient because teenagers can carry an entire collection on one device.","This explains the first benefit, portability, in a clear and developed sentence."],["To begin with, teenagers should use electronic devices at all times.","Constant device use is not an advantage of e-book reading."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"HOW does this convenience help students?","hint":"Contrast carrying printed books with storing books electronically.","correct":2,"options":[["These books are useful because electronic books are very useful.","This simply repeats a general idea instead of explaining it."],["E-books are all free, so students never spend money on books.","Not every e-book is free, so the claim is inaccurate."],["Instead of carrying several heavy books, students can keep dozens of novels on their phones and read them whenever they have spare time.","This adds a specific explanation and contrasts e-books with printed books."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which EXAMPLE best illustrates portable reading?","hint":"Think of a short moment when someone is away from home.","correct":0,"options":[["For instance, a student could continue a favourite story while waiting for the bus, making good use of an otherwise idle moment.","This presents a realistic example of how portable reading fits into daily life."],["For instance, students can watch funny videos while waiting for the bus.","Watching videos is not an example of e-book reading."],["For instance, everyone can finish an entire novel in one minute.","This is unrealistic and does not help develop the point."]]},{"tag":"POINT 2 — Choose a different benefit","question":"Which sentence introduces a SECOND benefit?","hint":"Move away from portability and think about readers' different needs.","correct":2,"options":[["Another benefit is that teenagers can carry e-books easily.","This repeats the first benefit, which is portability."],["Another benefit is that e-books can replace every teacher.","Reading technology does not replace teachers."],["Another significant advantage is that e-books can be more accessible to students with different reading needs.","This adds accessibility as a distinct benefit."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW can e-books support readers with different needs?","hint":"Consider tools for understanding challenging texts.","correct":1,"options":[["Students can make their bags lighter by keeping books on one device.","This returns to portability instead of explaining accessibility."],["Many reading apps allow users to enlarge the text or check unfamiliar words instantly, which helps them understand demanding passages.","This names specific accessibility features and shows why they matter."],["Students must avoid dictionaries when reading on their phones.","This contradicts the useful digital tools available."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What is a meaningful RESULT of those features?","hint":"Think about reading confidence and independence.","correct":0,"options":[["Consequently, these flexible features can build confidence and encourage teenagers to explore new books independently.","This connects helpful reading tools to greater confidence and independent learning."],["Consequently, everyone will earn perfect marks in every examination.","This makes an unrealistic promise about academic performance."],["Consequently, students will have to carry even heavier textbooks.","This does not logically follow from accessible digital reading tools."]]}]},{"title":"How Schools Can Promote E-book Reading","bullet":"how school can promote the habit of reading e-books among teenagers","plural":true,"steps":[{"tag":"POINT 1 — Choose the first initiative","question":"Which FIRST step could schools take?","hint":"Choose a regular school activity that makes reading a habit.","correct":0,"options":[["Furthermore, schools could introduce a short weekly digital reading session to cultivate a consistent reading habit.","A scheduled session is a practical initiative, and the purpose is clearly stated."],["Furthermore, schools could stop all reading lessons immediately.","This would discourage reading rather than promote it."],["Furthermore, schools could require every student to buy an expensive tablet.","Compulsory costly purchases may exclude students and are not needed for reading."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"WHAT could happen during these sessions?","hint":"Explain how students and teachers would take part.","correct":2,"options":[["During these sessions, students could only discuss the latest online games.","This does not develop the proposed reading activity."],["During these sessions, teachers could ask students to memorise entire novels.","This is unrealistic and may discourage students from reading."],["During these sessions, teachers could let students choose suitable e-books and share their opinions in small groups.","This explains how the sessions can make reading active and enjoyable."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which long-term EFFECT is most logical?","hint":"Consider how regular exposure can influence students' attitudes.","correct":1,"options":[["As a result, students will no longer need to attend any other classes.","This result is unrealistic and unrelated to a balanced timetable."],["As reading becomes part of the school timetable, students may gradually regard it as an enjoyable activity rather than another chore.","This explains how repeated practice can shape positive reading habits."],["As a result, the school library will be closed permanently.","Weekly reading sessions do not require closing a library."]]},{"tag":"POINT 2 — Choose a different initiative","question":"Which is another method, not a repetition of the first?","hint":"Think of an activity that motivates students through recognition.","correct":1,"options":[["In addition, schools should provide the same reading session twice a week.","This repeats the first method instead of introducing a distinct approach."],["In addition, schools could launch a digital reading challenge that rewards students for reading regularly.","A reading challenge is a different initiative focused on motivation."],["In addition, schools should stop students from borrowing printed books.","Restricting paper books is unnecessary and may discourage readers."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"Which SPECIFIC EXAMPLE explains how the challenge would work?","hint":"Imagine a simple way for classes to share reading progress.","correct":0,"options":[["For example, each class could maintain a shared reading journal where students record completed books and recommend their favourites.","This gives a clear method for tracking and sharing progress."],["For example, students could compete to type the fastest.","Typing speed is different from reading and understanding e-books."],["For example, schools could cancel their sports competitions.","Cancelling sports does not explain a reading challenge."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"HOW might the school attract reluctant readers?","hint":"Think of recognition that encourages students to participate.","correct":2,"options":[["Schools should give everyone a certificate even when they do not take part.","This does not recognise genuine reading effort."],["Schools should make students read for hours without any breaks.","Excessive compulsory reading could reduce their interest."],["By recognising their efforts with certificates, schools could foster friendly competition and motivate even reluctant readers to participate.","This provides a realistic incentive and describes its positive effect."]]}]},{"title":"Teenagers' Future Reading Preference","bullet":"teenagers’ preference in future; to read e-books or paper books? Why?","plural":false,"opening":"Finally, I believe e-books will become more popular than printed books among teenagers in the future.","steps":[{"tag":"Explanation 1 of 4","question":"WHY might teenagers prefer e-books in the future?","hint":"Consider how familiar teenagers already are with digital devices.","correct":1,"options":[["Teenagers will choose e-books because more teenagers will choose them.","This repeats the prediction without giving a reason."],["Since teenagers are already familiar with smartphones and tablets, digital reading can fit naturally into their everyday routines.","This gives a clear reason based on existing technology habits."],["Teenagers will choose e-books because paper cannot be produced anymore.","Paper is still produced, so this is an incorrect assumption."]]},{"tag":"Example 2 of 4","question":"Which realistic EXAMPLE supports this prediction?","hint":"Think about obtaining a book from home.","correct":0,"options":[["For instance, they could borrow an e-book from an online library within minutes rather than travelling to a bookshop.","This illustrates convenient access with a specific everyday example."],["For instance, some teenagers keep paper textbooks on their shelves.","This does not develop the preference for e-books."],["For instance, every e-book on the internet is free.","Many e-books cost money, so the statement is inaccurate."]]},{"tag":"Additional reason 3 of 4","question":"Which NEW DETAIL strengthens your preference?","hint":"Consider features beyond downloading books.","correct":2,"options":[["Moreover, teenagers will prefer e-books because they prefer electronic reading.","This is circular reasoning that does not add useful information."],["Moreover, e-books will turn every reader into an expert overnight.","Reading technology cannot guarantee instant expertise."],["Moreover, adjustable fonts and built-in dictionaries make e-books an adaptable option for readers with different abilities.","This adds accessibility as a distinct, convincing reason."]]},{"tag":"Balanced opinion 4 of 4","question":"Which sentence provides a thoughtful CONTRAST?","hint":"Acknowledge the continued appeal of printed books.","correct":1,"options":[["Nevertheless, paper books will become illegal in the near future.","This is an unsupported and extreme prediction."],["Nevertheless, printed books are unlikely to disappear altogether because many readers still value the tangible experience of turning real pages.","This offers a balanced contrast and a believable reason why paper books may remain popular."],["Nevertheless, printed books and digital books offer exactly the same experience.","This ignores important differences between the two formats."]]}]}];
const vocab={"convenient":{"level":"B2","meaning":"practical and easy to use"},"collection":{"level":"B2","meaning":"a group of books kept together"},"idle":{"level":"C1","meaning":"not being used or occupied"},"significant":{"level":"B2","meaning":"important or noticeable"},"accessible":{"level":"B2","meaning":"easy for people to use or understand"},"unfamiliar":{"level":"B2","meaning":"not known before"},"instantly":{"level":"B2","meaning":"immediately; without delay"},"demanding":{"level":"B2","meaning":"requiring a lot of effort"},"consequently":{"level":"B2","meaning":"as a result"},"flexible":{"level":"B2","meaning":"able to change to suit different needs"},"independently":{"level":"B2","meaning":"without needing help"},"cultivate":{"level":"C1","meaning":"develop something through care and effort"},"consistent":{"level":"B2","meaning":"regular and steady"},"gradually":{"level":"B2","meaning":"little by little"},"regard":{"level":"B2","meaning":"think of or consider"},"chore":{"level":"C1","meaning":"an unpleasant task that must be done"},"launch":{"level":"B2","meaning":"start a new programme or activity"},"maintain":{"level":"B2","meaning":"keep something going"},"recognising":{"level":"B2","meaning":"acknowledging someone's effort"},"foster":{"level":"C1","meaning":"help something grow or develop"},"reluctant":{"level":"C1","meaning":"unwilling or not eager"},"participate":{"level":"B2","meaning":"take part"},"adjustable":{"level":"B2","meaning":"able to be changed"},"adaptable":{"level":"C1","meaning":"able to change for different needs"},"tangible":{"level":"C1","meaning":"physical and able to be touched"},"altogether":{"level":"B2","meaning":"completely"},"routines":{"level":"B2","meaning":"activities people do regularly"}};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const info=vocab[word.toLowerCase()],level=info.level,meaning=info.meaning;return '<span class="vocab vocab-'+level.toLowerCase()+'" role="button" tabindex="0" aria-label="'+escapeHTML(word+' ('+level+'): '+meaning)+'">'+word+'<span class="vocab-tooltip"><strong>'+level+'</strong> · '+escapeHTML(meaning)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>'<div class="exam"><strong>Question 2 · Original Exam Task</strong><p>Your class has been discussing the usage of electronic reading materials among teenagers. Your teacher has asked you to write an essay on it.</p><p>In your essay, you should write about:</p><ul><li>benefits of reading e-books</li><li>how school can promote the habit of reading e-books among teenagers</li><li>teenagers’ preference in future; to read e-books or paper books? Why?</li></ul><p><strong>Use all the notes above and give reasons for your point of view.</strong></p></div>';
const titleReminder=()=>'<div class="urgent-reminder" role="note"><div class="urgent-heading"><span class="urgent-icon" aria-hidden="true">📕</span><span>STOP! WRITE THIS FIRST!</span></div><p>Write the <strong>ESSAY TITLE</strong> and your <strong>INTRODUCTION PARAGRAPH</strong> in your exercise book.</p><div class="essay-title">SUGGESTED TITLE: Reading E-books Among Teenagers</div><p class="urgent-note">✍️ Complete both in your notebook before starting Body Paragraph 1.</p></div>';
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">📚 E-books · NORMAL</span><span class="small">B1–B2 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Develop a richer SPM essay, one meaningful sentence at a time.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the essay title AND my introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over B2 vocabulary (teal) and C1 vocabulary (purple) on a computer, or tap the underlined words on your phone.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Conclusion</span></div><h2>Write Your Conclusion</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR CONCLUSION!</div><p>Write a <strong>CONCLUSION PARAGRAPH</strong> in your exercise book about e-books and teenagers. End with your opinion or hope.</p><p class="urgent-note">✍️ Complete your conclusion before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my conclusion in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full essay in your notebook</strong><p>It should contain your title, introduction, all three developed body paragraphs and conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — develop it with four detailed elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT "),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(isPoint?'Choose a new point':'Develop the point')+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
