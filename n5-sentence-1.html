<title>N5 Sentence Scramble 🌸</title>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, "Noto Sans JP", sans-serif;
  background: #fff7fb;
  color: #353238;
}

.game {
  max-width: 680px;
  margin: auto;
}

/* HEADER */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.tag {
  color: #e44c96;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 3px;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.score {
  background: white;
  padding: 11px 16px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.score small {
  display: block;
  color: #888;
}

.score strong {
  font-size: 20px;
}

/* PROGRESS */

.progress-bg {
  height: 10px;
  background: #f1dce7;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 20px;
}

.progress {
  height: 100%;
  width: 5%;
  background: #ed5ca6;
  transition: width .3s;
}

.status {
  display: flex;
  justify-content: space-between;
  margin: 11px 3px 18px;
  color: #777;
  font-size: 14px;
}

/* CARD */

.card {
  background: white;
  border-radius: 24px;
  padding: 23px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.instruction {
  color: #888;
  font-size: 14px;
  margin-bottom: 8px;
}

.meaning {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.5;
  margin-bottom: 24px;
}

/* ZONES */

.zone-title {
  font-size: 12px;
  font-weight: bold;
  color: #999;
  letter-spacing: 1px;
  margin: 15px 0 8px;
}

.zone {
  min-height: 82px;
  padding: 12px;
  border-radius: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  align-content: flex-start;
}

.answer-zone {
  border: 2px dashed #e2bfd1;
  background: #fffafd;
}

.bank-zone {
  background: #f9f3f6;
}

/* WORD BOXES */

.word {
  border: 1px solid #e1d7dc;
  background: white;
  padding: 12px 15px;
  border-radius: 12px;
  font-size: 18px;
  cursor: grab;
  user-select: none;
  box-shadow: 0 2px 6px rgba(0,0,0,.04);
}

.word:active {
  cursor: grabbing;
  transform: scale(.97);
}

.sortable-ghost {
  opacity: .3;
}

.sortable-chosen {
  border-color: #ed5ca6;
  background: #fff0f7;
}

/* FEEDBACK */

.feedback {
  margin-top: 17px;
  padding: 15px;
  border-radius: 14px;
  line-height: 1.55;
  display: none;
}

.feedback.good {
  display: block;
  background: #e5f8ed;
  color: #256b43;
}

.feedback.bad {
  display: block;
  background: #fff0f0;
  color: #9a3f3f;
}

/* BUTTONS */

.controls {
  display: flex;
  gap: 10px;
  margin-top: 17px;
}

button {
  border: none;
  min-height: 49px;
  border-radius: 13px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.secondary {
  flex: 1;
  background: #f0e9ed;
  color: #555;
}

.primary {
  flex: 2;
  background: #e95a9f;
  color: white;
}

.next {
  width: 100%;
  background: #e95a9f;
  color: white;
  margin-top: 12px;
  display: none;
}

.help {
  text-align: center;
  font-size: 12px;
  color: #999;
  margin-top: 13px;
}

/* RESULTS */

.results {
  background: white;
  border-radius: 24px;
  text-align: center;
  padding: 38px 25px;
  display: none;
}

.results .emoji {
  font-size: 60px;
}

.results h2 {
  font-size: 28px;
  margin-bottom: 5px;
}

.final-score {
  font-size: 48px;
  font-weight: bold;
  margin: 15px 0;
}

.restart {
  width: 100%;
  background: #e95a9f;
  color: white;
  margin-top: 15px;
}

/* PHONE */

@media (max-width: 500px) {

  body {
    padding: 14px;
  }

  h1 {
    font-size: 25px;
  }

  .card {
    padding: 18px;
  }

  .meaning {
    font-size: 18px;
  }

  .word {
    font-size: 17px;
    padding: 11px 13px;
  }
}

ruby{ruby-position:over}rt{font-size:10px;color:#a44a7d;font-weight:400}
.word{line-height:1.85}
.feedback .note{background:#ffffffaa;color:#4a4146;border-radius:10px;padding:11px;margin-top:10px}
.feedback .model{font-size:20px;line-height:2.2;margin:7px 0;color:#276244}
.feedback .mini{font-size:13px;line-height:1.65}
</style>

/* FURIGANA, GRAMMAR NOTES, AND CURATED ALTERNATIVE WORD ORDERS */
const readingByWord = {"毎日":"{毎日|まいにち}","学校へ":"{学校|がっこう}へ","行きます。":"{行|い}きます。","毎朝":"{毎朝|まいあさ}","六時に":"{六時|ろくじ}に","起きます。":"{起|お}きます。","図書館で":"{図書館|としょかん}で","本を":"{本|ほん}を","読みます。":"{読|よ}みます。","友達と":"{友達|ともだち}と","公園で":"{公園|こうえん}で","遊びます。":"{遊|あそ}びます。","飲みます。":"{飲|の}みます。","日本語を":"{日本語|にほんご}を","勉強します。":"{勉強|べんきょう}します。","駅へ":"{駅|えき}へ","机の":"{机|つくえ}の","上に":"{上|うえ}に","部屋に":"{部屋|へや}に","猫が":"{猫|ねこ}が","弟は":"{弟|おとうと}は","好きです。":"{好|す}きです。","母は":"{母|はは}は","料理が":"{料理|りょうり}が","上手です。":"{上手|じょうず}です。","昨日":"{昨日|きのう}","映画を":"{映画|えいが}を","見ました。":"{見|み}ました。","明日":"{明日|あした}","友達に":"{友達|ともだち}に","会います。":"{会|あ}います。","今日は":"{今日|きょう}は","天気が":"{天気|てんき}が","飲みません。":"{飲|の}みません。","昼ご飯を":"{昼|ひる}ご{飯|はん}を","食べましょう。":"{食|た}べましょう。","写真を":"{写真|しゃしん}を","撮っても":"{撮|と}っても","宿題を":"{宿題|しゅくだい}を","寝ます。":"{寝|ね}ます。","日本へ":"{日本|にほん}へ","行きたいです。":"{行|い}きたいです。"};
const guidance = [{"valid":[[0,1,2,3],[1,0,2,3],[0,2,1,3]],"grammar":"{毎日|まいにち} means 'every day'. へ shows the destination. {行|い}きます comes from {行|い}く (to go).","vocab":"{学校|がっこう} = school; {毎日|まいにち} = every day"},{"valid":[[0,1,2]],"grammar":"に marks a specific time. Japanese usually uses the present form for habitual actions.","vocab":"{毎朝|まいあさ} = every morning; {六時|ろくじ} = six o'clock"},{"valid":[[0,1,2],[1,0,2]],"grammar":"で shows where an action happens; を marks the thing you read. {読|よ}みます is the polite form of {読|よ}む.","vocab":"{図書館|としょかん} = library; {本|ほん} = book"},{"valid":[[0,1,2],[1,0,2]],"grammar":"と means 'with' a person. で marks the place where you play.","vocab":"{友達|ともだち} = friend; {公園|こうえん} = park"},{"valid":[[0,1,2],[1,0,2]],"grammar":"を marks the drink. {毎朝|まいあさ} describes how often something happens.","vocab":"コーヒー = coffee; {飲|の}む = to drink"},{"valid":[[0,1,2],[1,0,2]],"grammar":"を marks the subject being studied. {勉強|べんきょう}する means 'to study'.","vocab":"{日本語|にほんご} = Japanese language; {毎日|まいにち} = every day"},{"valid":[[0,1,2],[1,0,2]],"grammar":"で marks how you travel (by bus). へ marks where you are going.","vocab":"バス = bus; {駅|えき} = station"},{"valid":[[0,1,2,3],[2,0,1,3]],"grammar":"Noun + の + {上|うえ}に means 'on top of'. あります is used for nonliving things.","vocab":"{机|つくえ} = desk; {本|ほん} = book"},{"valid":[[0,1,2],[1,0,2]],"grammar":"Use います for living things. に shows where someone or an animal is located.","vocab":"{部屋|へや} = room; {猫|ねこ} = cat"},{"valid":[[0,1,2,3]],"grammar":"この must come directly before a noun. とても means 'very' and describes the adjective.","vocab":"りんご = apple; おいしい = delicious"},{"valid":[[0,1,2]],"grammar":"The pattern A は B が {好|す}きです means 'A likes B'. {好|す}き is a な-adjective.","vocab":"{弟|おとうと} = my younger brother; サッカー = soccer"},{"valid":[[0,1,2]],"grammar":"A は B が {上手|じょうず}です describes someone being good at something.","vocab":"{母|はは} = my mother; {料理|りょうり} = cooking"},{"valid":[[0,1,2],[1,0,2]],"grammar":"The ending ました is the polite past tense, used for completed actions.","vocab":"{昨日|きのう} = yesterday; {映画|えいが} = movie"},{"valid":[[0,1,2],[1,0,2]],"grammar":"に marks the person you meet. Japanese present forms can express future plans with words like {明日|あした}.","vocab":"{明日|あした} = tomorrow; {会|あ}う = to meet"},{"valid":[[0,1,2]],"grammar":"{天気|てんき}がいい is a common expression meaning the weather is good.","vocab":"{今日|きょう} = today; {天気|てんき} = weather"},{"valid":[[0,1,2]],"grammar":"ません is the polite negative verb ending: {飲|の}みます → {飲|の}みません.","vocab":"{飲|の}む = to drink; コーヒー = coffee"},{"valid":[[0,1,2],[1,0,2]],"grammar":"ましょう is a friendly invitation: 'let's ...'. いっしょに means 'together'.","vocab":"{昼|ひる}ご{飯|はん} = lunch; {食|た}べる = to eat"},{"valid":[[0,1,2,3],[1,0,2,3]],"grammar":"The pattern verb て-form + もいいですか asks permission to do something. Keep て-form and いいですか together.","vocab":"{写真|しゃしん} = photo; {撮|と}る = to take (a photo)"},{"valid":[[0,1,2]],"grammar":"Verb て-form + から means 'after doing ...'. Keep してから together before the second action.","vocab":"{宿題|しゅくだい} = homework; {寝|ね}る = to sleep"},{"valid":[[0,1,2]],"grammar":"Verb stem + たいです means 'want to'. へ marks the destination.","vocab":"{日本|にほん} = Japan; {行|い}きたい = want to go"}];
questions.forEach(function(q,i){q.validOrders=guidance[i].valid;q.grammar=guidance[i].grammar;q.vocab=guidance[i].vocab;});
function escapeJapaneseHTML(s){
 return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});
}
function withFurigana(s){
 return escapeJapaneseHTML(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g,"<ruby>$1<rt>$2</rt></ruby>");
}
function wordRuby(word){return withFurigana(readingByWord[word]||word);}


/* =====================================================
   GAME VARIABLES
===================================================== */

let quiz = [];

let current = 0;

let score = 0;

let streak = 0;

let bestStreak = 0;

let firstTry = true;

let solved = false;


/* =====================================================
   ELEMENTS
===================================================== */

const bankZone =
document.getElementById("bankZone");

const answerZone =
document.getElementById("answerZone");

const meaning =
document.getElementById("meaning");

const feedback =
document.getElementById("feedback");

const checkButton =
document.getElementById("checkButton");

const resetButton =
document.getElementById("resetButton");

const nextButton =
document.getElementById("nextButton");


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

  const copy = [...array];

  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
    Math.floor(
      Math.random() * (i + 1)
    );

    [
      copy[i],
      copy[j]
    ]
    =
    [
      copy[j],
      copy[i]
    ];

  }

  return copy;

}


/* =====================================================
   SORTABLE DRAGGING
===================================================== */

new Sortable(
  bankZone,
  {
    group: "words",
    animation: 170,
    ghostClass: "sortable-ghost",
    chosenClass: "sortable-chosen"
  }
);

new Sortable(
  answerZone,
  {
    group: "words",
    animation: 170,
    ghostClass: "sortable-ghost",
    chosenClass: "sortable-chosen"
  }
);


/* =====================================================
   CREATE WORD BOX
===================================================== */

function makeWord(word) {

  const box =
  document.createElement("div");

  box.className = "word";

  box.innerHTML = wordRuby(word);
  box.dataset.word = word;

  /*
    TAP ALTERNATIVE

    Bank → answer
    Answer → bank
  */

  box.addEventListener(
    "click",
    function () {

      if (solved) return;

      if (
        box.parentElement === bankZone
      ) {

        answerZone.appendChild(box);

      }

      else {

        bankZone.appendChild(box);

      }

    }
  );

  return box;

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

  solved = false;

  firstTry = true;

  feedback.className =
  "feedback";

  feedback.innerHTML = "";

  nextButton.style.display =
  "none";

  checkButton.style.display =
  "block";

  resetButton.disabled =
  false;


  const q =
  quiz[current];


  meaning.textContent =
  "💬 " + q.meaning;


  bankZone.innerHTML = "";

  answerZone.innerHTML = "";


  const shuffledWords =
  shuffle(q.words);


  shuffledWords.forEach(
    word => {

      bankZone.appendChild(
        makeWord(word)
      );

    }
  );


  updateStatus();

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus() {

  document.getElementById(
    "questionNumber"
  ).textContent =
  `Question ${current + 1} / ${quiz.length}`;


  document.getElementById(
    "score"
  ).textContent =
  `${score} / ${quiz.length}`;


  document.getElementById(
    "streak"
  ).textContent =
  `🔥 ${streak} streak`;


  document.getElementById(
    "progress"
  ).style.width =
  `${((current + 1) / quiz.length) * 100}%`;

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer() {

  if (solved) return;


  const q =
  quiz[current];


  const chosen =
  [...answerZone.children]
  .map(
    box => box.dataset.word
  );


  /*
    Not all blocks used
  */

  if (
    chosen.length !==
    q.answer.length
  ) {

    feedback.className =
    "feedback bad";

    feedback.innerHTML =
    "👀 Move all the word boxes into your sentence first.";

    return;

  }


  const correct =
  q.validOrders.some(
    order => order.every(
      (wordIndex, i) => q.words[wordIndex] === chosen[i]
    )
  );


  if (correct) {

    solved = true;


    if (firstTry) {

      score++;

      streak++;

    }

    else {

      streak = 0;

    }


    if (
      streak > bestStreak
    ) {

      bestStreak =
      streak;

    }


    feedback.className =
    "feedback good";

    feedback.innerHTML =
    "✨ <strong>正解！ Correct!</strong>" +
    "<div class='note'><strong>Model sentence</strong>" +
    "<div class='model'>" + q.answer.map(wordRuby).join(" ") + "</div>" +
    "<div class='mini'><strong>📘 Grammar:</strong> " + withFurigana(q.grammar) + "</div>" +
    "<div class='mini'><strong>🔎 Vocabulary:</strong> " + withFurigana(q.vocab) + "</div></div>";


    checkButton.style.display =
    "none";

    nextButton.style.display =
    "block";

    resetButton.disabled =
    true;


    updateStatus();

  }

  else {

    firstTry = false;

    streak = 0;


    feedback.className =
    "feedback bad";

    feedback.innerHTML =
    `
    💡 Not quite.
    Rearrange the boxes and try again!
    `;


    updateStatus();

  }

}


/* =====================================================
   RESET CURRENT SENTENCE
===================================================== */

function resetQuestion() {

  if (solved) return;

  const boxes =
  [...answerZone.children];

  boxes.forEach(
    box =>
    bankZone.appendChild(box)
  );


  feedback.className =
  "feedback";

  feedback.innerHTML = "";

}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion() {

  current++;

  if (
    current <
    quiz.length
  ) {

    loadQuestion();

  }

  else {

    showResults();

  }

}


/* =====================================================
   RESULTS
===================================================== */

function showResults() {

  document.getElementById(
    "playArea"
  ).style.display =
  "none";


  document.getElementById(
    "results"
  ).style.display =
  "block";


  document.getElementById(
    "finalScore"
  ).textContent =
  `${score} / ${quiz.length}`;


  document.getElementById(
    "bestStreak"
  ).textContent =
  `Best first-try streak: 🔥 ${bestStreak}`;


  let emoji;
  let message;


  if (score >= 18) {

    emoji = "🏆";

    message =
    "すごい！ Excellent sentence order!";

  }

  else if (score >= 15) {

    emoji = "🌸";

    message =
    "よくできました！ Very good!";

  }

  else if (score >= 10) {

    emoji = "✨";

    message =
    "Good progress! Keep practising Japanese word order.";

  }

  else {

    emoji = "🌱";

    message =
    "がんばって！ Replay and try to beat your score.";

  }


  document.getElementById(
    "resultEmoji"
  ).textContent =
  emoji;


  document.getElementById(
    "finalMessage"
  ).textContent =
  message;

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

  quiz =
  shuffle(questions);

  current = 0;

  score = 0;

  streak = 0;

  bestStreak = 0;


  document.getElementById(
    "playArea"
  ).style.display =
  "block";


  document.getElementById(
    "results"
  ).style.display =
  "none";


  loadQuestion();

}


/* =====================================================
   BUTTONS
===================================================== */

checkButton.addEventListener(
  "click",
  checkAnswer
);


resetButton.addEventListener(
  "click",
  resetQuestion
);


nextButton.addEventListener(
  "click",
  nextQuestion
);


document.getElementById(
  "restartButton"
).addEventListener(
  "click",
  startGame
);


/* START */

startGame();

</script>

</html>
