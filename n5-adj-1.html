function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(){let order=shuffle(rows.map((_,i)=>i));if(order.join()===lastOrder)order.push(order.shift());lastOrder=order.join();deck=order.map(id=>{let [art,s,a,d,m,t,n]=rows[id],choices=shuffle([a,...d]);if(choices.join('|')===lastChoices[id])choices.push(choices.shift());lastChoices[id]=choices.join('|');return{art,s,a,m,t,n,choices}});position=0;score=0;mistakes=[];$('results').classList.add('hidden');$('game').classList.remove('hidden');render();}
function render(){locked=false;const q=deck[position];$('counter').textContent=`Question ${position+1} / 20`;$('points').textContent=`🌸 ${score} correct`;$('fill').style.width=`${position*5}%`;$('progress').setAttribute('aria-valuenow',position);$('art').innerHTML=illustration(q.art);$('sentence').innerHTML=jp(q.s).replace('（　）','<span class="blank">?</span>');$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('options').replaceChildren();q.choices.forEach((v,i)=>{const b=document.createElement('button');b.className='option';b.lang='ja';b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span>${jp(v)}</span>`;b.onclick=()=>answer(v);$('options').appendChild(b)});}
function answer(v){if(locked)return;locked=true;const q=deck[position],right=v===q.a;if(right)score++;else mistakes.push({...q,chosen:v});[...$('options').children].forEach((b,i)=>{b.disabled=true;b.classList.add(q.choices[i]===q.a?'correct':q.choices[i]===v?'wrong':'dim')});$('sentence').innerHTML=jp(q.s).replace('（　）',`<span class="blank">${jp(q.a)}</span>`);$('points').textContent=`🌸 ${score} correct`;$('fill').style.width=`${(position+1)*5}%`;$('progress').setAttribute('aria-valuenow',position+1);$('feedback').innerHTML=`<strong>${right?'🌷 Lovely! That’s correct.':'🌱 A new word to grow.'}</strong><p>${jp(q.a)} — ${q.m}</p><p>${q.t}</p><p class="muted">${q.n}</p>`;$('feedback').classList.remove('hidden');$('next').textContent=position===19?'See my results 🌸':'Next question →';$('next').classList.remove('hidden');}
function finish(){$('game').classList.add('hidden');$('results').classList.remove('hidden');$('results').innerHTML=`<div class="tag">ROUND COMPLETE</div><h2>${score===20?'In full bloom!':'Your Japanese is growing.'}</h2><div class="big">${score}<small> / 20</small></div><div class="flowers" aria-hidden="true">${'🌸'.repeat(score)+'🌱'.repeat(20-score)}</div><p class="muted">One blossom for every correct answer.</p><button class="primary" id="replay">↻ Replay — shuffle all 20</button><p class="muted">New question order · New answer positions · Fresh score</p><div class="review"><h3>${mistakes.length?'Words to practise':'All 20 correct. Beautiful work! 🌷'}</h3>${mistakes.map(q=>`<article><div class="jp" lang="ja">${jp(q.s.replace('（　）',q.a))}</div><div>You chose ${plain(q.chosen)} → <b>${plain(q.a)}</b> (${q.m})</div><div class="muted">${q.t}</div></article>`).join('')}</div>`;$('replay').onclick=()=>{start();window.scrollTo(0,0)};window.scrollTo(0,0);}
$('next').onclick=()=>{if(!locked)return;position++;if(position===20)finish();else{render();$('options').firstElementChild.focus({preventScroll:true})}};$('furigana').onclick=()=>{let off=document.body.classList.toggle('off');$('furigana').textContent='Furigana: '+(off?'OFF':'ON');$('furigana').setAttribute('aria-pressed',String(!off))};start();
</script></html>
