<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 3 · REVIEW · EASY</span><h1>Elaboration Builder</h1><p class="subtitle">🛍️ Batu Pahat Mall · Review</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"Name and Location of BP Mall","bullet":"the name and location of the shopping mall","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the MALL NAME and LOCATION?","hint":"Start with a general sentence about two pieces of information.","correct":1,"options":[["To begin with, there are several things I bought at the shopping mall.","This does not match the approved review or the required idea in this paragraph."],["To begin with, there are two things to know about the shopping mall.","This opens the paragraph without merging it into the name."],["To begin with, there are two important reasons to enjoy watching movies.","This does not match the approved review or the required idea in this paragraph."]]},{"tag":"POINT 1 — Main point","question":"What is the name of the shopping mall?","hint":"Name the real mall selected for this review, including its short name.","correct":2,"options":[["One is its name, AEON Mall Kulaijaya, which I visited in Johor Bahru.","This does not match the approved review or the required idea in this paragraph."],["One is its name, a small shopping centre beside the beach.","This does not match the approved review or the required idea in this paragraph."],["One is its name, Batu Pahat Mall, which is also called BP Mall.","This correctly identifies Batu Pahat Mall."]]},{"tag":"POINT 1 — Elaboration 1 of 1","question":"How is this shopping mall described?","hint":"Describe it as a place for shopping and relaxation.","correct":0,"options":[["It is a popular place where people can shop and relax.","This develops the name point with a general description."],["It is a quiet office building where customers cannot buy anything.","This does not match the approved review or the required idea in this paragraph."],["It is a school library used only by students and teachers.","This does not match the approved review or the required idea in this paragraph."]]},{"tag":"POINT 2 — Second point","question":"Where is the mall located?","hint":"Give Jalan Kluang, Batu Pahat, Johor.","correct":1,"options":[["Another thing is its location in Bukit Bintang, Kuala Lumpur.","This does not match the approved review or the required idea in this paragraph."],["Another thing is its location along Jalan Kluang in Batu Pahat, Johor.","This introduces the second required point: location."],["Another thing is its location beside KLCC in the city centre.","This does not match the approved review or the required idea in this paragraph."]]},{"tag":"POINT 2 — One elaboration","question":"How does its location help local visitors?","hint":"Explain the advantage of being accessible to nearby residents.","correct":2,"options":[["The mall is far away from Batu Pahat and difficult for locals to reach.","This does not match the approved review or the required idea in this paragraph."],["The mall is open only to visitors from outside Johor.","This does not match the approved review or the required idea in this paragraph."],["The mall is easy to reach for people living nearby.","This explains how the location benefits visitors."]]}]},{"title":"Facilities and Services","bullet":"the facilities and services at the shopping mall","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces the FACILITIES and SERVICES?","hint":"Introduce the two kinds of facilities and services.","correct":0,"options":[["Furthermore, there are several facilities and services at the mall.","This opens the facilities and services paragraph."],["Furthermore, there are many ways to travel to Batu Pahat Mall.","This does not match the approved review or the required idea in this paragraph."],["Furthermore, there are several reasons I enjoy school holidays.","This does not match the approved review or the required idea in this paragraph."]]},{"tag":"POINT 1 — Main point","question":"What is the first facility mentioned?","hint":"Mention the mall's cinema.","correct":1,"options":[["One facility is a large football stadium for school competitions.","This does not match the approved review or the required idea in this paragraph."],["One facility is Paragon Cinemas, where visitors can watch movies.","Paragon Cinemas is one facility at the mall."],["One facility is a swimming pool with Olympic diving boards.","This does not match the approved review or the required idea in this paragraph."]]},{"tag":"POINT 1 — Elaboration 1 of 1","question":"How does the writer describe the cinema experience?","hint":"Provide an example or benefit of watching a movie.","correct":2,"options":[["For example, we watched a football match after buying tickets.","This does not match the approved review or the required idea in this paragraph."],["For example, my family went bowling on the mall's rooftop.","This does not match the approved review or the required idea in this paragraph."],["For example, my family and I enjoyed watching a film after shopping.","This develops the cinema facility with a specific experience or benefit."]]},{"tag":"POINT 2 — Second point","question":"What different service or facility does the mall offer?","hint":"Add a different point about shops and food outlets.","correct":0,"options":[["Another service is the variety of shops and food outlets.","Shops and food outlets form a different second point."],["Another service is a free bus to airports in Kuala Lumpur.","This does not match the approved review or the required idea in this paragraph."],["Another service is a hospital emergency department inside the mall.","This does not match the approved review or the required idea in this paragraph."]]},{"tag":"POINT 2 — One elaboration","question":"How can visitors use the shops and dining outlets?","hint":"Mention book-shopping and having a family meal.","correct":1,"options":[["Visitors can use the library to borrow textbooks for free.","This does not match the approved review or the required idea in this paragraph."],["Visitors can buy books at Popular Bookstore and enjoy a meal with their families.","This develops what visitors can do at the shops and restaurants."],["Visitors can attend university lectures in the mall every weekend.","This does not match the approved review or the required idea in this paragraph."]]}]},{"title":"Recommendation and Suggestion","bullet":"whether you would recommend the shopping mall to others and why","plural":false,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces a RECOMMENDATION?","hint":"Introduce whether the mall is worth visiting.","correct":2,"options":[["Finally, there are many reasons to avoid leaving home at weekends.","This does not match the approved review or the required idea in this paragraph."],["Finally, there are different ways to shop online from home.","This does not match the approved review or the required idea in this paragraph."],["Finally, there are good reasons to recommend Batu Pahat Mall to others.","This opens the recommendation paragraph."]]},{"tag":"POINT 1 — Main point","question":"Would the writer recommend the shopping mall, and why?","hint":"Give a positive recommendation and reason.","correct":0,"options":[["I would recommend it to my friends because it has many useful facilities.","The sentence clearly states the writer's positive recommendation."],["I would never recommend it because it has no shops or restaurants.","This does not match the approved review or the required idea in this paragraph."],["I would suggest the mall only to people who dislike shopping.","This does not match the approved review or the required idea in this paragraph."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"What example supports the recommendation?","hint":"Show shopping, dining and entertainment in one place.","correct":1,"options":[["For example, there is nothing visitors can do apart from sleeping.","This does not match the approved review or the required idea in this paragraph."],["For example, they can shop, eat and watch a movie in one place.","This gives a concrete reason to recommend the mall."],["For example, visitors can only pay bills and cannot watch films.","This does not match the approved review or the required idea in this paragraph."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"What improvement does the writer suggest while recommending the mall?","hint":"Give a polite, practical suggestion for additional benches.","correct":2,"options":[["However, I hope the management will remove all the resting areas.","This does not match the approved review or the required idea in this paragraph."],["However, I hope the mall will stop allowing shoppers to rest.","This does not match the approved review or the required idea in this paragraph."],["However, I hope the management will rectify the shortage of benches for tired visitors.","This makes a balanced improvement suggestion about seating."]]}]}];
const vocab={"rectify":["C1","membetulkan / memperbaiki sesuatu masalah"],"facilities":["B2","kemudahan"],"management":["B2","pihak pengurusan"],"visitors":["B2","pengunjung"],"variety":["B2","pelbagai pilihan"],"recommend":["B2","mengesyorkan"]};

actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
