<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 2 · NORMAL</span><h1>Elaboration Builder</h1><p class="subtitle">💻 Cyberbullying &amp; Online Safety · Guided Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"One Example of Cyberbullying on Social Media","bullet":"one example of cyberbullying on social media","plural":false,"steps":[{"tag":"POINT — Choose an example","question":"Which opening introduces ONE detailed example?","hint":"Choose a specific incident involving public comments.","correct":0,"options":[["To begin with, one example of cyberbullying on social media is a group of students posting humiliating comments beneath a classmate's photo.","It gives one specific humiliating incident involving a classmate."],["To begin with, social media has several advantages and disadvantages.","This is broad background information, not a cyberbullying incident."],["To begin with, teenagers should always follow internet rules.","This is general advice rather than an example."]]},{"tag":"Explanation 1 of 4","question":"HOW do the offenders behave?","hint":"Describe repeated insults visible to other students.","correct":1,"options":[["The comments are humiliating because they humiliate the student.","This simply repeats the main point."],["Instead of giving respectful feedback, they repeatedly mock the person's appearance where many other students can see it.","The sentence explains repeated public mockery and why it matters."],["Most teenagers share pictures of meals and holidays.","Ordinary posting does not develop the bullying example."]]},{"tag":"Explanation 2 of 4","question":"Which concrete EXAMPLE shows the attack spreading?","hint":"Think about screenshots shared in group chats.","correct":2,"options":[["For instance, every classmate will certainly forward the post.","This makes an unsubstantiated claim about everyone."],["For instance, messaging apps have colourful backgrounds.","App appearance does not explain how attacks spread."],["For instance, the comments may spread when classmates share screenshots in group chats, allowing the humiliation to continue even after the original post is deleted.","It gives a believable mechanism that can prolong public humiliation."]]},{"tag":"Explanation 3 of 4","question":"What emotional or behavioural CONSEQUENCE is realistic?","hint":"Think about fear of more ridicule at school and online.","correct":0,"options":[["As a consequence, the targeted student may become reluctant to post online or participate in class discussions, fearing further ridicule.","It connects public ridicule to reluctance and fear."],["As a consequence, the student's grades immediately fall to zero.","This is an unreasonable certainty."],["As a consequence, every social media account closes.","A personal incident cannot close every account."]]},{"tag":"Explanation 4 of 4","question":"Which sentence DEVELOPS the lasting emotional impact?","hint":"Think about safety and confidence over time.","correct":1,"options":[["Bullying is public because other people can see the comments.","This only defines the situation without adding a new effect."],["Such repeated public attacks can gradually undermine the student's confidence and sense of safety.","It explains gradual damage to confidence and a sense of safety."],["The incident always makes the student more confident.","This dismisses possible harm and makes an absolute claim."]]}]},{"title":"Why Online Bullying Happens","bullet":"why online bullying happens","plural":true,"steps":[{"tag":"POINT 1 — Choose a reason","question":"What convincing FIRST cause can you identify?","hint":"Consider peer pressure and wanting approval.","correct":1,"options":[["Moreover, online bullying happens simply because phones exist.","Having a device alone does not explain bullying."],["Moreover, online bullying happens partly because some teenagers seek approval from their peers.","It gives the desire for approval as a specific social motive."],["Moreover, bullies should be punished by schools.","This expresses a response rather than identifying a cause."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"WHY could online reactions encourage the bully?","hint":"Explain what likes and laughter signal to the offender.","correct":2,"options":[["The reactions are important because they are reactions.","This merely repeats words from the question."],["Every hurtful joke is immediately removed by social media.","This unrealistic claim does not explain peer influence."],["When a hurtful joke attracts likes or laughing reactions, the bully may interpret this attention as encouragement to continue.","It shows how positive reactions may reinforce abusive behaviour."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which SPECIFIC SCENARIO illustrates peer approval?","hint":"Use an example involving insulting a classmate in a chat.","correct":0,"options":[["For example, a student might repeatedly insult a classmate in a group chat simply to impress friends, even when the comments cause distress.","It connects repeated insults with impressing friends and causing distress."],["For example, teenagers discuss their favourite music in chats.","This ordinary conversation does not show bullying."],["For example, the internet contains millions of websites.","This general fact does not illustrate the cause."]]},{"tag":"POINT 2 — Choose another reason","question":"Which SECOND cause is distinct from seeking approval?","hint":"Think about fake accounts and responsibility.","correct":1,"options":[["Another reason is that students want more likes.","This repeats the first cause about social approval."],["Another reason is that the anonymity of fake accounts can make people feel less accountable for their actions.","It introduces anonymity and perceived lack of accountability."],["Another reason is that students enjoy watching films.","Entertainment preferences do not explain harassment."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW does hidden identity affect the offender's decisions?","hint":"Describe the mistaken idea that adults cannot find them.","correct":2,"options":[["Anonymous accounts are anonymous because their owners are unknown.","This only defines anonymity and adds no explanation."],["A hidden account means all its actions are legal.","Anonymity does not remove legal or social responsibility."],["Since their real identities are hidden, they may assume that their teachers and parents will never discover what they have posted.","It explains the false belief that a bully can avoid discovery."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What LOGICAL RESULT might follow from that belief?","hint":"Connect feeling safe from consequences to harsher abuse.","correct":0,"options":[["Consequently, this false sense of security can lead to harsher messages and repeated harassment.","It shows how misplaced confidence can lead to escalating harassment."],["Consequently, no person can ever be identified online.","This is an inaccurate absolute claim."],["Consequently, bullying becomes an approved school activity.","This result is illogical and contradicts school rules."]]}]},{"title":"Ways Students Can Stop Cyberbullying","bullet":"ways students can stop cyberbullying","plural":true,"steps":[{"tag":"POINT 1 — Choose a way","question":"Which is the FIRST practical way to stop cyberbullying?","hint":"Look for reporting and preserving evidence.","correct":2,"options":[["Finally, students should publicly insult the offenders.","Retaliation can increase harm rather than resolve it."],["Finally, students should never communicate online.","Avoiding all online contact is not a realistic solution."],["Finally, one of the ways students can stop cyberbullying is by reporting abusive posts and keeping evidence of what happened.","The sentence gives two connected steps for safe reporting."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"HOW can reporting be carried out effectively?","hint":"Think of screenshots and a reporting feature.","correct":0,"options":[["For instance, saving screenshots before using a platform's reporting feature gives adults clearer information if the behaviour continues.","Screenshots and platform reports help adults understand continued abuse."],["For instance, share the cruel screenshots with the whole school.","This spreads humiliation instead of protecting the victim."],["For instance, delete all evidence before speaking to teachers.","Deleting evidence makes it harder for adults to investigate."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"WHY is reporting better than sharing the abusive post?","hint":"Explain how the attack can be contained.","correct":1,"options":[["Forwarding the post always guarantees the offender's punishment.","Forwarding may spread humiliation and guarantees nothing."],["By taking action rather than sharing the post, students can help limit its spread and make it easier for the school to respond appropriately.","The answer links reporting to reduced spread and a more informed response."],["Reporting once ensures bullying never happens again.","This greatly overstates what one report can achieve."]]},{"tag":"POINT 2 — Choose another way","question":"Which SECOND approach is different from reporting?","hint":"Think about personal support and trusted adults.","correct":2,"options":[["In addition, students should submit the same report repeatedly.","This merely repeats the first method."],["In addition, students should start a public argument online.","Public confrontation may worsen conflict."],["In addition, they can support the victim and encourage them to speak to a trusted teacher or parent.","This introduces emotional support and adult assistance."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"WHAT would thoughtful support look like?","hint":"Consider a private message and help choosing a next step.","correct":0,"options":[["A private message offering reassurance can remind the student that they are not alone, while an adult can help them decide what to do next.","The answer explains emotional reassurance and practical adult guidance."],["Tell the victim that the insults do not matter at all.","This dismisses feelings rather than offering reassurance."],["Promise never to tell any adult about the attack.","This may block access to proper support."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"Which RESULT connects both prevention strategies?","hint":"Think about the wider effect of reporting and helping.","correct":1,"options":[["Together, these steps remove all harmful content instantly.","This makes an impossible guarantee."],["Together, these practical steps can create a more supportive online community and discourage further bullying.","It offers a balanced result for the online community."],["Together, these steps show that victims must face abuse alone.","This contradicts the emphasis on support."]]}]}];
const vocab={"humiliating":{"level":"B2","meaning":"memalukan dan menjatuhkan maruah"},"respectful":{"level":"B2","meaning":"penuh hormat"},"mock":{"level":"B2","meaning":"mengejek"},"humiliation":{"level":"C1","meaning":"penghinaan yang memalukan"},"reluctant":{"level":"C1","meaning":"berasa berat hati atau enggan"},"ridicule":{"level":"C1","meaning":"ejekan atau cemuhan"},"undermine":{"level":"C1","meaning":"melemahkan secara beransur-ansur"},"approval":{"level":"B2","meaning":"penerimaan atau persetujuan"},"peers":{"level":"B2","meaning":"rakan sebaya"},"interpret":{"level":"B2","meaning":"mentafsir"},"distress":{"level":"B2","meaning":"tekanan emosi atau penderitaan"},"anonymity":{"level":"C1","meaning":"keadaan identiti tidak diketahui"},"accountable":{"level":"C1","meaning":"bertanggungjawab atas tindakan"},"harassment":{"level":"C1","meaning":"gangguan berulang"},"abusive":{"level":"B2","meaning":"menghina atau menyakitkan hati"},"evidence":{"level":"B2","meaning":"bukti"},"reassurance":{"level":"C1","meaning":"kata-kata yang menenangkan"},"discourage":{"level":"B2","meaning":"menghalang atau mengurangkan dorongan"},"responsibly":{"level":"B2","meaning":"secara bertanggungjawab"},"practical":{"level":"B2","meaning":"boleh dilaksanakan"},"repeated":{"level":"B2","meaning":"berulang kali"}};

}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full essay in your notebook</strong><p>It should contain your title, introduction, all three developed body paragraphs and conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — develop it with four detailed elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<div class="choice-card '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" data-choice="'+i+'"><button type="button" class="choice-pick" data-action="choose" data-choice="'+i+'" aria-label="Select option '+String.fromCharCode(65+i)+': '+escapeHTML(o[0])+'" aria-pressed="'+(selected===i)+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span></button><div class="choice-text">'+withVocab(o[0])+'</div></div>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT "),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(isPoint?'Choose a new point':'Develop the point')+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const card=e.target.closest(".choice-card");if(card&&!state.checked){state.selected=Number(card.dataset.choice);render();return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
document.addEventListener("click",e=>{if(!e.target.closest(".vocab"))root.querySelectorAll(".vocab.is-open").forEach(el=>el.classList.remove("is-open"));});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
