<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#194d51"><meta name="description" content="SPM Writing Part 2: Canteen Day cake sale, with three elaborations for a singular point, two developed points for plural bullets, and notebook copying checkpoints."><title>SPM Elaboration Builder — Canteen Day Cake Sale</title><style>
:root{--ink:#253943;--muted:#617580;--teal:#237f80;--deep:#194d51;--border:#dce8e9;--soft:#f2f8f8;--mint:#e6f7ed;--green:#1e7450;--red:#a3344f;--rose:#fff0f2;--gold:#b47715}

.shell{max-width:790px;margin:auto;padding:18px 14px 42px}
header{text-align:center;margin:6px auto 22px}
.kicker{display:inline-block;padding:7px 14px;background:white;border-radius:100px;color:var(--teal);font-size:.76rem;font-weight:850;letter-spacing:.045em}

.subtitle{margin:0;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--border);border-radius:24px;padding:clamp(18px,4vw,31px);box-shadow:0 13px 38px #4d857e18}
h2{font-size:1.32rem;margin:0 0 12px;line-height:1.4}h3{font-size:1.05rem;margin:0 0 10px}
p,li{line-height:1.7}p{margin:9px 0}ol,ul{padding-left:23px}
.small{color:var(--muted);font-size:.9rem}.tiny{color:var(--muted);font-size:.78rem}
.exam{background:var(--soft);border:1px solid #d0e4e4;border-radius:17px;padding:16px 18px;margin:17px 0}
.exam strong{color:var(--deep)}.exam ul{margin:8px 0}.exam li{margin:5px 0}
label.name{display:block;margin-top:23px;margin-bottom:8px;font-weight:800}
input[type=text]{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid #bedbda;background:white}
textarea{width:100%;min-height:145px;resize:vertical;padding:15px;border-radius:13px;border:2px solid #bedbda;background:white;color:var(--ink);font:inherit;line-height:1.65}
.writing-tip{background:#eaf6f4;border:1px solid #d0e7e1;border-radius:14px;padding:14px 16px;margin:15px 0;line-height:1.65}
.writing-tip ul{margin:7px 0 0}
.writing-meta{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:.83rem}
.essay p{white-space:pre-wrap}
button{font:inherit;cursor:pointer;font-weight:780;border:0;border-radius:12px;padding:13px 17px}
button:focus-visible,input:focus-visible{outline:3px solid #7bc6c2;outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.primary{background:var(--teal);color:white}.primary:hover:not(:disabled){background:#176264}
.secondary{background:#e6f4f2;color:var(--deep)}.secondary:hover:not(:disabled){background:#d5eeeb}
.full{width:100%}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}.row>button{flex:1 1 180px}
.chip{display:inline-block;border-radius:99px;background:#e8f5f2;color:#286a66;font-size:.8rem;font-weight:850;padding:6px 11px}
.progress{display:flex;gap:6px;margin:12px 0 22px}.progress span{flex:1;height:8px;background:#e8f0ef;border-radius:99px}.progress .done{background:#42a58e}.progress .active{background:#d6a03b}
.point{background:#f2f8f8;border:1px solid #d6e5e4;border-radius:16px;padding:17px 18px;margin:14px 0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.065em;font-weight:850;color:#357d7a;margin-bottom:6px}
.point p{font-weight:730;font-size:1.08rem;margin:0}
.step-title{margin:20px 0 8px;font-size:1.22rem}
.choice-list{display:grid;gap:10px;margin-top:15px}
.choice{width:100%;background:white;border:2px solid #d8e5e4;display:flex;gap:12px;align-items:flex-start;text-align:left;color:var(--ink);line-height:1.55}
.choice:hover:not(:disabled){border-color:#67ada7;background:#f5fcfa}
.choice.selected{border-color:var(--teal);background:#eaf8f5}
.choice.good{border-color:#4fba83;background:#eaf9ef}
.choice.bad{border-color:#e3a1af;background:var(--rose)}
.letter{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:#e5f3f0;color:#266b68;display:grid;place-items:center;font-weight:850}
.feedback{border-radius:14px;padding:14px 16px;margin:16px 0;line-height:1.65}
.feedback.good{background:var(--mint);color:var(--green);border:1px solid #a6dcbf}
.feedback.bad{background:var(--rose);color:var(--red);border:1px solid #eec5ce}
.draft{background:#f8fbff;border:1px solid #dbe6f1;border-radius:15px;padding:13px 16px;margin:17px 0}
.draft p{margin:7px 0;font-size:.95rem}
.missing{color:#84939b;font-style:italic}
.copycheck{background:#fff3d4;border:3px solid #dfa736;border-radius:18px;padding:19px 18px;margin:18px 0}
.copycheck h2{color:#80530d;margin-bottom:5px}
.urgent-reminder{background:#fff0f0;border:3px solid #d52e3e;border-left:9px solid #d52e3e;border-radius:17px;padding:20px 19px;margin:20px 0;box-shadow:0 5px 0 #f9d7da}
.urgent-reminder .urgent-heading{display:flex;align-items:center;gap:10px;font-size:clamp(1.27rem,5.2vw,1.65rem);line-height:1.25;font-weight:950;color:#a71e30;margin:0 0 12px}
.urgent-reminder .urgent-icon{font-size:1.7rem;line-height:1}
.urgent-reminder p{font-size:clamp(1.03rem,3.9vw,1.18rem);font-weight:730;line-height:1.65;margin:9px 0;color:#79212d}
.urgent-reminder .essay-title{padding:11px 14px;background:white;border:1px solid #eeb4ba;border-radius:11px;font-size:1.12rem;font-weight:900;color:#952230;margin:13px 0}
.urgent-reminder .urgent-note{font-size:.92rem;font-weight:650;color:#863740;margin-top:10px}
.paper{background:#fff;border:1px solid #edd7a3;border-radius:14px;padding:15px 17px;margin:15px 0;line-height:1.85}
.confirm{display:flex;align-items:flex-start;gap:12px;line-height:1.55;font-weight:740;margin:20px 0 9px}
.confirm input{accent-color:var(--teal);width:21px;height:21px;flex:0 0 21px;margin:2px 0 0}
.score{font-size:clamp(2.7rem,8vw,4.1rem);font-weight:900;color:var(--teal);line-height:1.1}
.essay{background:#f8fbfa;border:1px solid #dbe9e6;border-radius:15px;padding:16px;margin:17px 0}
.essay p{margin:0 0 15px}.essay p:last-child{margin:0}
.copied{min-height:1.2em;color:var(--green);font-weight:760;font-size:.9rem}
footer{text-align:center;font-size:.77rem;color:#6a8184;margin-top:20px}
@media(max-width:480px){.shell{padding:12px 10px 30px}.panel{border-radius:18px}.choice{padding:12px}.copycheck{padding:14px}.row>button{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{body{background:white}.shell{max-width:none}header,.no-print,footer{display:none!important}.panel{border:0;box-shadow:none}.essay{border:0;padding:0}}

/*  — distinct point and elaboration stages */
.segment{margin:14px 0 11px;border-radius:13px;padding:12px 14px;background:#e8f3fc;border-left:5px solid #5795c1;font-weight:820;color:#2c5878}
.segment.second{background:#fff2db;border-left-color:#d9a33d;color:#805a20}
.draft p{margin:8px 0}
.draft .built-sentence{display:block;line-height:1.7}
.essay-title{overflow-wrap:anywhere}
</style></head>
<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PAPER 2</span><h1>Elaboration Builder</h1><p class="subtitle">🧁 Selling Cakes on Canteen Day · Guided Writing</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"The Cake We Want to Sell","bullet":"a type of cake your class wants to sell","plural":false,"opening":"To begin with, our class wants to sell chocolate cupcakes.","steps":[{"tag":"Explanation 1 of 3","question":"Why are chocolate cupcakes suitable for the sale?","hint":"Think about their taste and how students can carry them.","correct":1,"options":[["Cupcakes can be promoted through colourful posters.","This is a promotion method, not a reason for choosing this type of cake."],["They are tasty and easy to carry.","This explains why cupcakes are a practical and appealing choice."],["Working together will teach us to share tasks.","This concerns teamwork, not the cake itself."]]},{"tag":"Example 2 of 3","question":"Which example develops your choice of cupcakes?","hint":"Think about an appealing feature we can add to the cupcakes.","correct":0,"options":[["For example, we can add colourful sprinkles.","This gives a specific example of how the cupcakes can look appealing."],["For example, we can promote them in WhatsApp groups.","This is a promotional method, not an example describing the cakes."],["For example, classmates can take turns selling.","This describes teamwork rather than a feature of the cupcakes."]]},{"tag":"Result 3 of 3","question":"What is a logical result of selling attractive cupcakes?","hint":"Think about what interested students may decide to do.","correct":2,"options":[["As a result, our team will prepare posters.","This is another activity, not an outcome of the cupcakes' appeal."],["As a result, our classmates can divide the work.","This is a teamwork benefit, not the result of attractive cupcakes."],["As a result, more students may buy them.","This links the cupcakes' appeal to students' purchasing decisions."]]}]},{"title":"Ways to Promote Our Cakes","bullet":"the ways to promote your cakes","plural":true,"steps":[{"tag":"POINT 1 — Choose the first way","question":"Which is an effective first way to promote our cakes?","hint":"Choose an action that lets students see information about the sale.","correct":1,"options":[["Firstly, we can prepare cupcake ingredients early.","This prepares the cakes, but does not promote them to buyers."],["Firstly, we can display colourful posters.","Posters are a clear promotional method."],["Firstly, we can share the baking duties fairly.","This develops teamwork, not promotion."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"HOW will the posters help attract buyers?","hint":"What useful information should an advertisement provide?","correct":0,"options":[["They will show flavours and prices.","This explains what the posters tell potential buyers."],["They will help us bake cupcakes faster.","Posters do not improve baking speed."],["They will teach us how to manage our money.","This is not their promotional purpose."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which example shows WHERE to display the posters?","hint":"Where will students notice announcements at school?","correct":2,"options":[["For example, we can practise baking after school.","This describes preparation, not poster placement."],["For example, we can ask classmates to package cakes.","This is a teamwork task, not a poster location."],["For example, we can use school noticeboards.","This gives a practical place to display advertisements."]]},{"tag":"POINT 2 — Choose another way","question":"Which is a DIFFERENT way to promote our cakes?","hint":"Choose a method that reaches students through their phones.","correct":1,"options":[["Secondly, we can make more colourful posters.","This repeats Point 1 instead of introducing another way."],["Secondly, we can advertise through WhatsApp.","This adds a distinct digital way to promote the sale."],["Secondly, we can prepare extra cupcakes.","Making more cupcakes is production, not advertising."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW does WhatsApp help promote our sale?","hint":"Think about when students could receive the announcement.","correct":0,"options":[["This reaches students before Canteen Day.","Messages can inform students about the sale in advance."],["This makes each cupcake easier to bake.","WhatsApp does not make baking easier."],["This helps us choose the cake flavours.","This concerns planning, not reaching customers."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"Which example supports our WhatsApp promotion?","hint":"Think of something visual we can send with an announcement.","correct":2,"options":[["We can also count the number of cake trays.","Counting trays does not demonstrate WhatsApp advertising."],["We can also ask classmates to wash dishes.","This is a practical task, not digital promotion."],["We can also share attractive cake photos.","Photos are a relevant example of appealing digital promotion."]]}]},{"title":"Benefits of Working Together","bullet":"the benefits of working together as a class","plural":true,"steps":[{"tag":"POINT 1 — Choose the first benefit","question":"Which is one benefit of working together as a class?","hint":"Think about how a group can handle different jobs.","correct":1,"options":[["Furthermore, our cupcakes should have colourful toppings.","This describes the product, not a benefit of teamwork."],["Furthermore, teamwork helps us share tasks.","Dividing responsibilities is a direct benefit of working together."],["Furthermore, we can advertise with posters.","This is a promotion method rather than a teamwork benefit."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"Give a specific EXAMPLE of sharing tasks.","hint":"Think about two different jobs needed for a cake sale.","correct":0,"options":[["Some classmates bake while others sell.","This shows how students can take on different responsibilities."],["Some cupcakes contain chocolate and sprinkles.","This describes the cakes, not division of work."],["Some students prefer posters to online messages.","This compares advertising preferences, not tasks."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"What is a practical RESULT of sharing tasks?","hint":"How does dividing work affect the group's workload?","correct":2,"options":[["This makes the cupcakes sweeter.","Sharing tasks does not directly change their flavour."],["This gives the posters brighter colours.","Division of duties does not automatically improve poster colours."],["This makes our work more manageable.","Sharing responsibilities reduces the burden on individual students."]]},{"tag":"POINT 2 — Choose another benefit","question":"Which is a DIFFERENT benefit of class teamwork?","hint":"Think about relationships, rather than dividing jobs.","correct":1,"options":[["Besides, teamwork makes our tasks easier.","This repeats the first benefit instead of offering a new one."],["Besides, working together strengthens our friendships.","This introduces a different social benefit of teamwork."],["Besides, our posters can reach more students.","This is about promotion, not class relationships."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"HOW can working together improve friendships?","hint":"Think about the social skills used when making decisions together.","correct":0,"options":[["We learn to listen and cooperate.","This explains the communication habits that strengthen friendships."],["We learn to decorate cakes with sprinkles.","This develops decorating skills, not relationships."],["We learn to display prices on posters.","This is an advertising skill, not the social benefit."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What positive RESULT may come from cooperating?","hint":"What might happen to classmates' relationships?","correct":2,"options":[["As a result, our cakes need fewer ingredients.","Cooperation does not necessarily change the recipe."],["As a result, our posters become more colourful.","This is about poster design, not friendship."],["As a result, our class becomes closer.","This is a direct social outcome of listening and cooperating."]]}]}];
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");
const countWords=s=>s.trim().split(/\s+/).filter(Boolean).length;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>'<div class="exam"><strong>Original SPM Task · SABK Selangor</strong><p>In your class, you have been discussing about selling cakes during the Canteen Day to raise some money. Your teacher has asked you to write an essay about it.</p><p>In your essay, you should:</p><ul><li>a type of cake your class wants to sell</li><li>the ways to promote your cakes</li><li>the benefits of working together as a class</li></ul><p><strong>Use all the notes above and give reasons for your point of view.</strong></p><p>Write your essay in <strong>125–150 words</strong> in an appropriate style.</p></div>';
const titleReminder=()=>'<div class="urgent-reminder" role="note"><div class="urgent-heading"><span class="urgent-icon" aria-hidden="true">📕</span><span>STOP! WRITE THIS FIRST!</span></div><p>Write the <strong>ESSAY TITLE</strong> and your <strong>INTRODUCTION PARAGRAPH</strong> in your exercise book.</p><div class="essay-title">SUGGESTED TITLE: Selling Cakes on Canteen Day</div><p class="urgent-note">✍️ Write both in your notebook before starting Body Paragraph 1.</p></div>';
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">🧁 Canteen Day</span><span class="small">B1 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Build a complete SPM essay in your exercise book.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the essay title AND my introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Conclusion</span></div><h2>Write Your Conclusion</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR CONCLUSION!</div><p>Write a <strong>CONCLUSION PARAGRAPH</strong> in your exercise book about the cake sale. End with your opinion or hope.</p><p class="urgent-note">✍️ Complete your conclusion before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my conclusion in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 body paragraphs · '+countWords(bodyParagraphs())+' body words</span></div><div class="writing-tip"><strong>Check your full essay in your notebook</strong><p>It should contain your title, introduction, all three developed body paragraphs and conclusion. Aim for <strong>125–150 words altogether</strong>. The game cannot count the words in your handwritten introduction or conclusion.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+escapeHTML(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — each point needs two elaborations/examples.</p>':'<p class="small">One main point — add three elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+escapeHTML(paragraph(state.index))+'</div><p class="small">'+countWords(paragraph(state.index))+' words</p><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+escapeHTML(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+escapeHTML(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+escapeHTML(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT "),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+escapeHTML(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+escapeHTML(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(isPoint?'Choose a new point':'Develop the point')+'</span></div><h3 class="step-title">'+escapeHTML(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
render();</script></body></html>
