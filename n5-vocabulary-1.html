<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>N5 Vocabulary Quiz 🌸</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, "Noto Sans JP", sans-serif;
  background: #fff7fb;
  color: #363238;
}

.game {
  max-width: 680px;
  margin: auto;
}


/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.level {
  color: #e34f98;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 4px;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.score-box {
  background: white;
  border-radius: 16px;
  padding: 11px 16px;
  text-align: center;
  min-width: 92px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.score-box small {
  display: block;
  color: #888;
  font-size: 12px;
}

.score-box strong {
  font-size: 20px;
}


/* PROGRESS */

.progress-bg {
  height: 10px;
  background: #f0dae6;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 20px;
}

.progress {
  height: 100%;
  width: 5%;
  background: #eb5da6;
  transition: width .3s;
}

.status {
  display: flex;
  justify-content: space-between;
  margin: 11px 3px 17px;
  color: #777;
  font-size: 14px;
}


/* QUIZ CARD */

.card {
  background: white;
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}


/* ILLUSTRATION */

.illustration-box {
  min-height: 190px;
  border-radius: 22px;
  background:
    radial-gradient(
      circle at 50% 45%,
      #ffffff 0%,
      #fff1f7 70%
    );

  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.illustration-box::before {
  content: "";
  width: 130px;
  height: 130px;
  background: #ffe3f0;
  border-radius: 50%;
  position: absolute;
}

.illustration {
  font-size: 92px;
  position: relative;
  z-index: 2;
  filter: drop-shadow(
    0 5px 5px rgba(0,0,0,.08)
  );
}


/* QUESTION */

.category {
  font-size: 12px;
  color: #df5598;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 5px;
}

.question {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.5;
  margin-bottom: 20px;
}


/* ANSWERS */

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.answer {
  border: 1px solid #e1d9dd;
  background: white;
  border-radius: 15px;
  min-height: 65px;
  font-size: 19px;
  font-weight: 600;
  cursor: pointer;
  padding: 12px;
  transition:
    transform .1s,
    background .2s,
    border .2s;
}

.answer:active {
  transform: scale(.97);
}

.answer.correct {
  background: #e0f7ea;
  border-color: #60ba88;
  color: #22653f;
}

.answer.wrong {
  background: #ffe4e4;
  border-color: #e57f7f;
  color: #973f3f;
}

.answer:disabled {
  cursor: default;
}


/* FEEDBACK */

.feedback {
  display: none;
  margin-top: 17px;
  padding: 15px;
  border-radius: 15px;
  line-height: 1.55;
}

.feedback.correct-feedback {
  display: block;
  background: #e8f8ef;
  color: #286843;
}

.feedback.wrong-feedback {
  display: block;
  background: #fff0f0;
  color: #8d4040;
}

.jp-answer {
  font-size: 20px;
  font-weight: bold;
}


/* NEXT */

.next {
  display: none;
  width: 100%;
  margin-top: 13px;
  border: none;
  border-radius: 14px;
  min-height: 50px;
  background: #e85ba1;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}


/* RESULTS */

.results {
  display: none;
  background: white;
  border-radius: 24px;
  padding: 38px 25px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.result-emoji {
  font-size: 65px;
}

.results h2 {
  font-size: 29px;
  margin-bottom: 5px;
}

.final-score {
  font-size: 50px;
  font-weight: bold;
  margin: 15px 0;
}

.restart {
  border: none;
  width: 100%;
  min-height: 50px;
  margin-top: 17px;
  border-radius: 14px;
  background: #e85ba1;
  color: white;
  font-size: 17px;
  font-weight: bold;
}


/* MOBILE */

@media (max-width: 500px) {

  body {
    padding: 14px;
  }

  h1 {
    font-size: 25px;
  }

  .card {
    padding: 17px;
  }

  .illustration-box {
    min-height: 165px;
  }

  .illustration {
    font-size: 80px;
  }

  .answers {
    grid-template-columns: 1fr;
  }

  .answer {
    min-height: 57px;
  }

}

</style>
</head>


<body>

<div class="game">

<div id="playArea">

  <div class="header">

    <div>
      <div class="level">
        🌸 JLPT N5
      </div>

      <h1>
        Vocabulary Quiz
      </h1>
    </div>


    <div class="score-box">

      <small>
        SCORE
      </small>

      <strong id="score">
        0 / 20
      </strong>

    </div>

  </div>


  <div class="progress-bg">

    <div
      id="progress"
      class="progress">
    </div>

  </div>


  <div class="status">

    <span id="questionNumber">
      Question 1 / 20
    </span>

    <span id="streak">
      🔥 0 streak
    </span>

  </div>


  <div class="card">


    <div class="illustration-box">

      <div
        id="illustration"
        class="illustration">
        🍎
      </div>

    </div>


    <div
      id="category"
      class="category">
      NOUN
    </div>


    <div
      id="question"
      class="question">

      What is this in Japanese?

    </div>


    <div
      id="answers"
      class="answers">
    </div>


    <div
      id="feedback"
      class="feedback">
    </div>


    <button
      id="nextButton"
      class="next">

      Next →

    </button>


  </div>

</div>


<div
  id="results"
  class="results">

  <div
    id="resultEmoji"
    class="result-emoji">
    🌸
  </div>


  <h2>
    Finished!
  </h2>


  <div
    id="finalScore"
    class="final-score">
  </div>


  <p id="finalMessage">
  </p>


  <p id="bestStreak">
  </p>


  <button
    id="restartButton"
    class="restart">

    Play Again 🔄

  </button>

</div>

</div>


<script>

/* ==================================================

const questions = [

options: [

]
},

{

category: "NOUN • PLACE",

meaning: "school",
options: [

},

{
illustration: "🌊",

answer: "うみ",

meaning: "sea",
options: [
"うみ",

},

{
illustration: "☂️",
category: "NOUN • OBJECT",
question: "What is this in Japanese?",
answer: "かさ",

meaning: "umbrella",

},

category: "NOUN • WEATHER",
question: "Which Japanese word matches the weather?",
answer: "あめ",

meaning: "rain",
options: [

},

{

question: "What is this in Japanese?",
answer: "みず",
kanji: "水（みず）",
meaning: "water",
options: [

"おちゃ",
"ぎゅうにゅう",
"コーヒー"
]
},

{
illustration: "🐟",
category: "NOUN • FOOD",
question: "What is this in Japanese?",
answer: "さかな",
kanji: "魚（さかな）",
meaning: "fish",
options: [
"さかな",
"にく",
"やさい",
"くだもの"
]
},

{
illustration: "🌸",
category: "NOUN • NATURE",
question: "What is this in Japanese?",
answer: "はな",
kanji: "花（はな）",
meaning: "flower",
options: [
"はな",
"き",
"いえ",
"みち"
]
},

{
illustration: "⏰",
category: "NOUN • OBJECT",
question: "What is this in Japanese?",
answer: "とけい",
kanji: "時計（とけい）",
meaning: "clock / watch",
options: [
"とけい",

]
},

{
illustration: "🍜",
category: "VERB",
question: "Which Japanese verb matches this action?",
answer: "たべる",
kanji: "食べる（たべる）",
meaning: "to eat",
options: [
"たべる",

]
},

{
illustration: "🥤",
category: "VERB",
question: "Which Japanese verb matches this action?",
answer: "のむ",
kanji: "飲む（のむ）",
meaning: "to drink",
options: [
"のむ",
"たべる",
"かう",

]
},

{
illustration: "📖",
category: "VERB",
question: "Which Japanese verb matches this action?",
answer: "よむ",
kanji: "読む（よむ）",
meaning: "to read",
options: [
"よむ",
"かく",
"みる",
"はなす"
]
},

{
illustration: "✍️",
category: "VERB",
question: "Which Japanese verb matches this action?",
answer: "かく",
kanji: "書く（かく）",
meaning: "to write",
options: [
"かく",
"よむ",
"きく",
"あるく"
]
},

{
illustration: "🛍️",
category: "VERB",
question: "Which Japanese verb matches this action?",
answer: "かう",
kanji: "買う（かう）",
meaning: "to buy",
options: [
"かう",
"いく",
"くる",
"まつ"
]
}

];


/* ==================================================
   VARIABLES
================================================== */

let quiz = [];

let current = 0;

let score = 0;

let streak = 0;

let bestStreak = 0;

let answered = false;


/* ==================================================
   ELEMENTS
================================================== */

const illustration =
document.getElementById("illustration");

const category =
document.getElementById("category");

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const feedback =
document.getElementById("feedback");

const nextButton =
document.getElementById("nextButton");


/* ==================================================
   SHUFFLE
================================================== */

function shuffle(array) {

  const copy = [...array];

  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
    Math.floor(
      Math.random() * (i + 1)
    );

    [
      copy[i],
      copy[j]
    ]
    =
    [
      copy[j],
      copy[i]
    ];

  }

  return copy;

}


/* ==================================================
   START
================================================== */

function startGame() {

  quiz =
  shuffle(questions);

  current = 0;

  score = 0;

  streak = 0;

  bestStreak = 0;


  document.getElementById(
    "playArea"
  ).style.display =
  "block";


  document.getElementById(
    "results"
  ).style.display =
  "none";


  loadQuestion();

}


/* ==================================================
   LOAD QUESTION
================================================== */

function loadQuestion() {

  answered = false;


  const q =
  quiz[current];


  illustration.textContent =
  q.illustration;


  category.textContent =
  q.category;


  question.textContent =
  q.question;


  answers.innerHTML = "";


  feedback.className =
  "feedback";


  feedback.innerHTML = "";


  nextButton.style.display =
  "none";


  /*
     RANDOMISE ANSWER POSITIONS
  */

  const shuffledOptions =
  shuffle(q.options);


  shuffledOptions.forEach(
    option => {

      const button =
      document.createElement("button");

      button.className =
      "answer";

      button.textContent =
      option;


      button.addEventListener(
        "click",
        function () {

          chooseAnswer(
            option,
            button
          );

        }
      );


      answers.appendChild(
        button
      );

    }
  );


  updateStatus();

}


/* ==================================================
   CHOOSE ANSWER
================================================== */

function chooseAnswer(
  selected,
  selectedButton
) {

  if (answered) return;


  answered = true;


  const q =
  quiz[current];


  const buttons =
  answers.querySelectorAll(
    ".answer"
  );


  buttons.forEach(
    button => {

      button.disabled = true;


      if (
        button.textContent ===
        q.answer
      ) {

        button.classList.add(
          "correct"
        );

      }

    }
  );


  /*
     CORRECT
  */

  if (
    selected ===
    q.answer
  ) {

    score++;

    streak++;


    if (
      streak >
      bestStreak
    ) {

      bestStreak =
      streak;

    }


    feedback.className =
    "feedback correct-feedback";


    feedback.innerHTML =
    `
    ✨ <strong>正解！ Correct!</strong>

    <br><br>

    <span class="jp-answer">
      ${q.kanji}
    </span>

    <br>

    ${q.meaning}
    `;

  }


  /*
     WRONG
  */

  else {

    streak = 0;


    selectedButton.classList.add(
      "wrong"
    );


    feedback.className =
    "feedback wrong-feedback";


    feedback.innerHTML =
    `
    💡 The answer is

    <br><br>

    <span class="jp-answer">
      ${q.kanji}
    </span>

    <br>

    ${q.meaning}
    `;

  }


  updateStatus();


  nextButton.style.display =
  "block";


  if (
    current ===
    quiz.length - 1
  ) {

    nextButton.textContent =
    "See Results 🏆";

  }

  else {

    nextButton.textContent =
    "Next →";

  }

}


/* ==================================================
   STATUS
================================================== */

function updateStatus() {

  document.getElementById(
    "score"
  ).textContent =
  `${score} / ${quiz.length}`;


  document.getElementById(
    "streak"
  ).textContent =
  `🔥 ${streak} streak`;


  document.getElementById(
    "questionNumber"
  ).textContent =
  `Question ${current + 1} / ${quiz.length}`;


  document.getElementById(
    "progress"
  ).style.width =
  `${((current + 1) / quiz.length) * 100}%`;

}


/* ==================================================
   NEXT
================================================== */

nextButton.addEventListener(
  "click",
  function () {

    current++;


    if (
      current <
      quiz.length
    ) {

      loadQuestion();

    }

    else {

      showResults();

    }

  }
);


/* ==================================================
   RESULTS
================================================== */

function showResults() {

  document.getElementById(
    "playArea"
  ).style.display =
  "none";


  document.getElementById(
    "results"
  ).style.display =
  "block";


  document.getElementById(
    "finalScore"
  ).textContent =
  `${score} / ${quiz.length}`;


  document.getElementById(
    "bestStreak"
  ).textContent =
  `Best streak: 🔥 ${bestStreak}`;


  let emoji;

  let message;


  if (
    score === 20
  ) {

    emoji = "🏆";

    message =
    "Perfect! N5 vocabulary master!";

  }

  else if (
    score >= 17
  ) {

    emoji = "🌸";

    message =
    "すごい！ Excellent vocabulary!";

  }

  else if (
    score >= 14
  ) {

    emoji = "✨";

    message =
    "よくできました！ Very good!";

  }

  else if (
    score >= 10
  ) {

    emoji = "🌱";

    message =
    "Good progress! Keep practising.";

  }

  else {

    emoji = "💪";

    message =
    "がんばって！ Play again and beat your score.";

  }


  document.getElementById(
    "resultEmoji"
  ).textContent =
  emoji;


  document.getElementById(
    "finalMessage"
  ).textContent =
  message;

}


/* ==================================================
   REPLAY
================================================== */

document.getElementById(
  "restartButton"
).addEventListener(
  "click",
  startGame
);


/* START GAME */

startGame();

</script>

</html>
