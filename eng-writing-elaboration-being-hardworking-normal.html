<body><main class="shell"><header><span class="kicker">✍️ SPM WRITING PART 2 · NORMAL</span><h1>Elaboration Builder</h1><p class="subtitle">💪 Being Hardworking · Guided Essay</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Free, rule-based practice · No AI or account required · Work stays in this browser</footer></main><script>"use strict";
const tasks=[{"title":"Characteristics of a Hardworking Person","bullet":"describe the characteristics of a hardworking person","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which sentence OPENS the characteristics paragraph without naming a characteristic yet?","hint":"Introduce the general qualities before giving Point 1.","correct":1,"options":[["To begin with, hard work improves academic performance and confidence.","This previews benefits, which is the second bullet rather than characteristics."],["To begin with, hardworking people show several important characteristics.","Correct. This is a separate general topic-opening before the first point."],["To begin with, conscientious people always perform every task perfectly.","This narrows the overview to one quality and makes an unrealistic promise."]]},{"tag":"POINT 1 — Main point","question":"Which FIRST characteristic describes continuing despite difficulty?","hint":"Choose determination, rather than talent or praise.","correct":0,"options":[["One characteristic is being conscientious about their responsibilities.","Correct. This introduces the first distinct idea."],["One characteristic is being naturally gifted in every school subject.","Natural ability is not evidence of conscientious effort."],["One characteristic is being praised by teachers for every assignment.","Praise may follow good work but is not a quality of the person."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"What does determination mean in practice?","hint":"It involves continuing when work is hard.","correct":2,"options":[["They rush to complete tasks because speed matters more than quality.","Rushing may create mistakes, while conscientiousness involves care."],["They check their work only if a teacher asks them to.","Conscientiousness involves taking care without always needing reminders."],["They check their work carefully because they know that small mistakes can affect the final result.","Correct. This explains the first idea rather than merely repeating it."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which example demonstrates determination in school?","hint":"Think of trying Maths questions again after mistakes.","correct":1,"options":[["For instance, a student submits a copied essay that has no spelling errors.","Accurate copied work is not evidence of their own careful effort."],["For instance, a student may review an essay and correct unclear sentences before submitting it.","Correct. This specific example or development supports the first idea."],["For instance, a student submits an essay quickly without checking any of the sentences.","The example leaves out the careful review that demonstrates conscientiousness."]]},{"tag":"POINT 2 — Second point","question":"What distinct SECOND characteristic should follow determination?","hint":"Focus on commitment to duties, not persistence again.","correct":0,"options":[["Another characteristic is determination when facing difficulties.","Correct. This supplies a different second point."],["Another characteristic is proofreading every answer twice.","Proofreading repeats the first quality rather than introducing determination."],["Another characteristic is expecting good marks after every attempt.","An expectation about results is not determination through setbacks."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"How can dedication be demonstrated?","hint":"Consider completing responsibilities seriously and on time.","correct":2,"options":[["Instead of giving up, they keep repeating the same mistakes without checking why.","Persistent effort should include learning from mistakes."],["Instead of learning from a poor result, they blame the examiner.","Blaming others avoids identifying weaknesses and improving."],["Instead of giving up after a poor result, they identify their weaknesses and practise again.","Correct. This explains how the second point works in practice."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What is a realistic result when someone finishes duties reliably?","hint":"Think of earning people's trust.","correct":1,"options":[["As a result, their scores can never fall below previous results.","Learning is not always a straight line; the realistic outcome is gradual progress."],["As a result, they gradually become more skilled and prepared for future challenges.","Correct. This provides a reasonable effect or further development of the second point."],["As a result, they are certain to win every academic competition.","Progress is plausible; guaranteed victories are not."]]}]},{"title":"Why Hard Work Is Important","bullet":"explain why being hardworking is important","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces WHY hard work matters in general?","hint":"Introduce a range of reasons; do not state the first reason yet.","correct":0,"options":[["Furthermore, being hardworking offers several benefits in teenagers' lives.","Correct. This is a separate general topic-opening before the first point."],["Furthermore, one benefit of hard work is academic improvement.","This introduces the first benefit rather than previewing several."],["Furthermore, hardworking teenagers can develop several useful habits.","This discusses how to develop hard work, not why the quality is important."]]},{"tag":"POINT 1 — Main point","question":"What is the FIRST reason hard work matters for students?","hint":"Consider improvement in school.","correct":2,"options":[["One benefit is receiving excellent results without understanding the lesson.","Academic performance should reflect learning, not just unexplained marks."],["One benefit is having fewer responsibilities to complete.","Working harder does not mean students necessarily have fewer responsibilities."],["One benefit is better academic performance.","Correct. This introduces the first distinct idea."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"Why does regular effort improve learning?","hint":"Connect practice with understanding lessons.","correct":1,"options":[["Regular revision means memorising all information without needing to think.","Revision should improve understanding, not just mechanical memorisation."],["Regular revision helps students understand difficult topics instead of relying on last-minute preparation.","Correct. This explains the first idea rather than merely repeating it."],["Regular revision matters because students can copy every answer and skip learning.","Copying answers does not develop understanding through revision."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which example supports the benefit of regular learning?","hint":"Choose an everyday English reading activity.","correct":0,"options":[["For example, practising essay writing each week can improve both accuracy and the use of vocabulary.","Correct. This specific example or development supports the first idea."],["For example, writing one essay the night before an examination guarantees higher marks.","A last-minute attempt is not evidence of regular skill-building."],["For example, students can complete one worksheet and avoid writing again.","One isolated activity does not show weekly writing practice."]]},{"tag":"POINT 2 — Second point","question":"What is a distinct SECOND benefit beyond academic progress?","hint":"Think about belief in one's ability.","correct":2,"options":[["Another benefit is remembering more information in tests.","This is another academic benefit, rather than the distinct confidence benefit."],["Another benefit is more accurate spelling in examination essays.","Spelling belongs to academic performance, so it repeats the first benefit."],["Another benefit is greater confidence when dealing with demanding tasks.","Correct. This supplies a different second point."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"How can finishing a challenging task build confidence?","hint":"Connect a completed task with a sense of achievement.","correct":1,"options":[["Completing a project through luck alone proves students need not work hard.","The sentence removes the effort that should explain the confidence gained."],["Completing a difficult project through dedication shows teenagers what their own effort can achieve.","Correct. This explains how the second point works in practice."],["Completing a project proves that difficult work will always become effortless.","Dedication supports achievement but does not make future work effortless."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"How might that confidence affect future behaviour?","hint":"Think about trying the next challenge.","correct":0,"options":[["This experience can make them more willing to take on new responsibilities.","Correct. This provides a reasonable effect or further development of the second point."],["This experience ensures they will succeed at every task without preparation.","Confidence can increase willingness but not guarantee success."],["This experience makes demanding projects disappear from their schedules.","Hard work supports readiness, not the disappearance of difficult work."]]}]},{"title":"How Teenagers Can Become Hardworking","bullet":"suggest how teenagers can develop this quality","plural":true,"steps":[{"tag":"OPEN PARAGRAPH","question":"Which opening introduces ways teenagers can BECOME hardworking?","hint":"Preview several ways before naming Point 1.","correct":2,"options":[["Finally, one useful approach is to set realistic study goals.","The sentence gives Point 1 before the separate paragraph opener."],["Finally, hardworking people often show several valuable characteristics.","This is about identifying qualities, not developing habits."],["Finally, teenagers can develop this quality through several practical habits.","Correct. This is a separate general topic-opening before the first point."]]},{"tag":"POINT 1 — Main point","question":"What is the FIRST practical method?","hint":"Think of a manageable study plan.","correct":1,"options":[["One useful approach is to make every goal impossible to reach.","Unrealistic goals can discourage effort and are hard to sustain."],["One useful approach is to set realistic goals and organise their study time.","Correct. This introduces the first distinct idea."],["One useful approach is to accept as many tasks as possible without planning.","Taking on too many unplanned tasks can undermine steady work."]]},{"tag":"POINT 1 — Elaboration 1 of 2","question":"How can a teenager follow that study plan?","hint":"Choose a regular time for homework.","correct":0,"options":[["Dividing large assignments into smaller tasks makes them easier to manage.","Correct. This explains the first idea rather than merely repeating it."],["Dividing an assignment means the student can skip the difficult sections.","Breaking work down makes it manageable; it does not remove required sections."],["Dividing large assignments is useful because teachers will finish the difficult parts.","Small tasks help students manage their work, not transfer it to teachers."]]},{"tag":"POINT 1 — Elaboration 2 of 2","question":"Which everyday example follows the plan?","hint":"Think about prioritising homework before phone time.","correct":2,"options":[["For example, a student can revise an entire term of Science in one evening.","This is the last-minute approach that the schedule is meant to avoid."],["For example, a student can leave all Science revision until the examination morning.","This contradicts gradual preparation and time organisation."],["For example, a student can revise one Science topic each evening rather than leaving everything until the last minute.","Correct. This specific example or development supports the first idea."]]},{"tag":"POINT 2 — Second point","question":"What is a different SECOND method?","hint":"Think of acting without reminders.","correct":1,"options":[["Another approach is to keep rewriting goals without attempting them.","Repeated goal-setting without action does not demonstrate initiative."],["Another approach is to show initiative in completing daily duties.","Correct. This supplies a different second point."],["Another approach is to add more subjects to the study timetable.","That repeats the first planning method instead of developing initiative."]]},{"tag":"POINT 2 — Elaboration 1 of 2","question":"What does showing initiative mean in practice?","hint":"Teenagers can begin useful tasks independently.","correct":0,"options":[["Teenagers can put their phones away and begin homework without waiting for repeated reminders.","Correct. This explains how the second point works in practice."],["Teenagers can keep their phones beside their books to answer every notification.","Frequent notifications distract from the independent task."],["Teenagers can wait for several reminders before opening their books.","This contradicts independent initiative and reducing distractions."]]},{"tag":"POINT 2 — Elaboration 2 of 2","question":"What may develop after practising these actions repeatedly?","hint":"Think of greater personal responsibility.","correct":2,"options":[["Over time, these actions mean students will never need rest or teacher feedback.","Focused routines can build responsibility without eliminating rest and guidance."],["Over time, students become responsible only when adults monitor every step.","Lasting responsibility involves increasingly independent action."],["Over time, these actions help them stay focused and take greater responsibility for their learning.","Correct. This provides a reasonable effect or further development of the second point."]]}]}];
const vocab={"determination":["B2","keazaman"],"responsibilities":["B2","tanggungjawab"],"academic":["B2","berkaitan dengan akademik"],"performance":["B2","prestasi"],"confidence":["B2","keyakinan diri"],"demanding":["B2","mencabar dan memerlukan usaha"],"approach":["B2","pendekatan / kaedah"],"realistic":["B2","realistik / munasabah"],"conscientious":["C1","teliti dan bersungguh-sungguh"],"dedication":["C1","dedikasi / kesungguhan"],"initiative":["C1","inisiatif / bertindak tanpa disuruh"]};
const root=document.getElementById("app");
const state={stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]};
const correctText=(step)=>step.options[step.correct][0];
const paragraph=(i)=>[...(tasks[i].opening?[tasks[i].opening]:[]),...tasks[i].steps.map(correctText)].join(" ");
const bodyParagraphs=()=>state.finished.join("\n\n");

const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const vocabRx=new RegExp("\\b("+Object.keys(vocab).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
const withVocab=s=>escapeHTML(s).replace(vocabRx,word=>{const [level,bm]=vocab[word.toLowerCase()];return '<span class="vocab '+(level==="C1"?"c1":"b2")+'" tabindex="0" data-meaning="'+escapeHTML(bm)+'" aria-label="'+escapeHTML(word+" ("+level+"): "+bm)+'">'+word+'<span class="vocab-tooltip">'+level+' · '+escapeHTML(bm)+'</span></span>';});
const task=()=>tasks[state.index],part=()=>task().steps[state.step];
const overallTotal=tasks.reduce((n,t)=>n+t.steps.length,0);
const progress=()=>'<div class="progress" aria-label="Body paragraph '+(state.index+1)+' of three">'+tasks.map((_,i)=>'<span class="'+(i<state.index?'done':i===state.index?'active':'')+'"></span>').join("")+'</div>';
const examTask=()=>"<div class=\"exam\"><strong>SPM Writing Part 2 · Guided Essay — Original Exam Task</strong><p>Your class has been talking about being a hardworking person. Your teacher has asked you to write an essay about it.</p><p><strong>In your essay, you should write about:</strong></p><ul><li>describe the characteristics of a hardworking person</li><li>explain why being hardworking is important</li><li>suggest how teenagers can develop this quality</li></ul></div>";
const titleReminder=()=>"<div class=\"urgent-reminder\" role=\"note\"><div class=\"urgent-heading\">📕 STOP! WRITE THIS FIRST!</div><p>Write the <strong>ESSAY TITLE</strong> and a <strong>THREE-SENTENCE INTRODUCTION</strong> in your exercise book.</p><div class=\"essay-title\">Being a Hardworking Person</div><p class=\"urgent-note\">Sentence 1: introduce hard work. Sentence 2: state its wider importance. Sentence 3: preview its characteristics, importance, and how teenagers can develop it.</p></div>";
const preview=()=>[...(task().opening?[task().opening]:[]),...task().steps.slice(0,state.step).map(correctText)].join(" ");
function resetChoice(){state.selected=-1;state.checked=false;state.tries=0;state.hint=false;}
function render(){
if(state.stage==="welcome"){
root.innerHTML='<div class="row between"><span class="chip">💪 Hard Work · NORMAL</span><span class="small">B1–B2 · '+overallTotal+' challenges</span></div><h2 style="margin-top:17px">Develop a richer SPM guided essay, one meaningful sentence at a time.</h2>'+examTask()+titleReminder()+'<label class="name" for="student">Student name / Nama murid</label><input type="text" id="student" maxlength="60" autocomplete="name" placeholder="Enter your name"><label class="confirm"><input type="checkbox" id="confirmIntro" '+(state.introConfirmed?'checked':'')+'><span>I have written the essay title and introduction in my exercise book.</span></label><button class="primary full" type="button" data-action="start" '+(state.introConfirmed?'':'disabled')+'>Start Elaboration Activities →</button><p id="nameError" class="tiny" role="alert"></p><p class="vocab-guide">🔎 Hover over B2 vocabulary (teal) and C1 vocabulary (purple) on a computer, or tap the underlined words on your phone.</p><p class="tiny">Each sentence has three options. Copy each completed paragraph into your notebook before progressing. Guided score: '+overallTotal+' marks.</p>';
return;
}
if(state.stage==="conclusion"){
root.innerHTML='<div class="row between"><span class="chip">✍️ FINAL WRITING TASK</span><span class="small">Conclusion</span></div><h2>Write Your Conclusion</h2><div class="urgent-reminder"><div class="urgent-heading">📕 STOP! WRITE YOUR CONCLUSION!</div><p>Write a <strong>THREE-SENTENCE CONCLUSION</strong>: (1) summarise the qualities and value of hard work, (2) express hope that teenagers will recognise the importance of steady effort, and (3) suggest that parents and teachers help them set manageable goals and get enough rest.</p><p class="urgent-note">✍️ Complete your conclusion before finishing.</p></div><label class="confirm"><input type="checkbox" id="confirmConclusion" '+(state.closingConfirmed?'checked':'')+'><span>I have written my conclusion in my exercise book.</span></label><button type="button" class="primary full" data-action="finishConclusion" '+(state.closingConfirmed?'':'disabled')+'>Finish My Writing Practice →</button>';
return;
}
if(state.stage==="finished"){
root.innerHTML='<div style="text-align:center"><div style="font-size:42px">🏆</div><h2>Writing Practice Completed!</h2><p class="small" id="displayName"></p><div class="score">'+state.score+' / '+overallTotal+'</div><p class="small">First-attempt guided marks</p><span class="chip">3 completed body paragraphs</span></div><div class="writing-tip"><strong>Check your full essay in your notebook</strong><p>It should contain your title, introduction, all three developed body paragraphs and conclusion. Check that you have explained each point clearly and connected your ideas naturally.</p></div><h2 style="margin-top:25px">Your Three Completed Body Paragraphs</h2><div class="essay">'+state.finished.map((p,i)=>'<p><span class="label" style="display:block">BODY PARAGRAPH '+(i+1)+'</span>'+withVocab(p)+'</p>').join("")+'</div><p class="small">Your handwritten introduction and conclusion are not included in the copy below.</p><div class="row no-print"><button type="button" class="primary" data-action="copyAll">📋 Copy All Body Paragraphs</button><button type="button" class="secondary" data-action="restart">↻ Play Again</button></div><p id="copyMessage" class="copied" role="status"></p>';
document.getElementById("displayName").textContent=state.name;
return;
}
const t=task(),p=part();
const head='<div class="row between"><span class="chip">PARAGRAPH '+(state.index+1)+' OF 3</span><strong>Score: '+state.score+'/'+overallTotal+'</strong></div>'+progress()+'<h2>'+t.title+'</h2><div class="exam"><div class="label">EXAM REQUIREMENT · BULLET '+(state.index+1)+'</div><strong>'+t.bullet+'</strong>'+(t.plural?'<p class="small"><strong>Two different points</strong> — give TWO elaborations for each point.</p>':'<p class="small">One main point — add TWO meaningful elaboration/example sentences.</p>')+'</div>';
if(state.stage==="copy"){
root.innerHTML=head+'<div class="copycheck"><h2>✍️ STOP! COPY YOUR PARAGRAPH</h2><p>Write the complete paragraph in your exercise book before moving to the next bullet point.</p><div class="paper"><div class="label">YOUR COMPLETED PARAGRAPH</div>'+withVocab(paragraph(state.index))+'</div><button type="button" class="secondary full" data-action="copyParagraph">📋 Copy Paragraph to Clipboard</button><p id="copyMessage" class="copied" role="status"></p><label class="confirm"><input type="checkbox" id="confirmCopy" '+(state.confirmed?'checked':'')+'><span>I have copied this paragraph into my exercise book.</span></label><button class="primary full" type="button" data-action="next" '+(state.confirmed?'':'disabled')+'>'+(state.index===2?'Write My Conclusion →':'Continue to Paragraph '+(state.index+2)+' →')+'</button><p class="tiny" style="text-align:center">🔒 Confirm that you have copied the paragraph to unlock the next part.</p></div>';
return;
}
const selected=state.selected,good=selected===p.correct;
const buttons=p.options.map((o,i)=>'<button class="choice '+(selected===i?(state.checked?(good?'good':'bad'):'selected'):'')+'" type="button" data-action="choose" data-choice="'+i+'" '+(state.checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+withVocab(o[0])+'</span></button>').join("");
let actions;
if(state.checked){
actions='<div class="feedback '+(good?'good':'bad')+'" role="status"><strong>'+(good?'✓ Correct! Your paragraph is developing.':'↻ This does not develop the required idea.')+'</strong><p>'+withVocab(p.options[selected][1])+'</p></div><button class="primary full" type="button" data-action="'+(good?'advance':'retry')+'">'+(good?(state.step===t.steps.length-1?'View & Copy My Paragraph →':'Continue to Next Sentence →'):'Try Again ↻')+'</button>';
}else{
actions='<div class="row between" style="margin-top:17px"><button class="secondary" type="button" data-action="hint">'+(state.hint?'Hide Hint':'💡 Need a Hint?')+'</button><span class="tiny">'+(state.tries?'Retry':'First attempt · 1 mark')+'</span></div>'+(state.hint?'<div class="draft"><strong>Hint:</strong> '+withVocab(p.hint)+'</div>':'')+'<button class="primary full" type="button" data-action="check" '+(selected<0?'disabled':'')+'>Check My Answer ✓</button>';
}
const isPoint=p.tag.startsWith("POINT ")||p.tag.startsWith("OPEN"),isSecond=p.tag.startsWith("POINT 2");
root.innerHTML=head+(t.opening?'<div class="point"><div class="label">GIVEN POINT</div><p>'+withVocab(t.opening)+'</p></div>':'')+(state.step>0?'<div class="draft"><div class="label">YOUR PARAGRAPH SO FAR</div><p>'+withVocab(preview())+'</p></div>':'')+(t.plural?'<div class="segment '+(isSecond?'second':'')+'">'+escapeHTML(p.tag)+'</div>':'<div class="segment">'+escapeHTML(p.tag)+'</div>')+'<div class="row between"><span class="chip">SENTENCE '+(state.step+1)+' OF '+t.steps.length+'</span><span class="tiny">'+(p.tag.startsWith('OPEN')?'Open the paragraph':(isPoint?'Choose a new point':'Develop the point'))+'</span></div><h3 class="step-title">'+withVocab(p.question)+'</h3><div class="choice-list">'+buttons+'</div>'+actions;
}
function start(){
if(!state.introConfirmed)return;
const field=document.getElementById("student");
const val=field.value.trim();
if(!val){document.getElementById("nameError").textContent="Please enter your name. / Sila masukkan nama.";field.focus();return;}
state.name=val;state.stage="play";render();
}
function check(){
if(state.selected<0)return;
if(state.tries===0&&state.selected===part().correct)state.score++;
state.tries++;state.checked=true;render();
}
function advance(){
if(!state.checked||state.selected!==part().correct)return;
if(state.step===task().steps.length-1){state.stage="copy";state.confirmed=false;}
else state.step++;
resetChoice();render();
}
function next(){
if(!state.confirmed||state.stage!=="copy")return;
state.finished.push(paragraph(state.index));state.confirmed=false;
if(state.index===tasks.length-1)state.stage="conclusion";
else{state.index++;state.stage="play";}
state.step=0;resetChoice();render();
}
async function copyText(text){
const status=document.getElementById("copyMessage");
try{
if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
else{const ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(!ok)throw Error("Clipboard failed");}
if(status)status.textContent="✓ Copied! You can paste it into your notes.";
}catch(e){if(status)status.textContent="Copy unavailable here. Select the text and copy it manually.";}
}
root.addEventListener("click",e=>{
const word=e.target.closest(".vocab");
if(word){e.preventDefault();e.stopPropagation();root.querySelectorAll(".vocab.is-open").forEach(el=>{if(el!==word)el.classList.remove("is-open")});word.classList.toggle("is-open");return;}
const b=e.target.closest("button[data-action]");if(!b||b.disabled)return;
const action=b.dataset.action;
if(action==="start")return start();
if(action==="finishConclusion"){if(state.closingConfirmed){state.stage="finished";render();}return;}
if(action==="choose"){if(!state.checked){state.selected=Number(b.dataset.choice);render();}return;}
if(action==="hint"){state.hint=!state.hint;render();return;}
if(action==="check")return check();
if(action==="retry"){state.checked=false;state.selected=-1;render();return;}
if(action==="advance")return advance();
if(action==="next")return next();
if(action==="copyParagraph"){copyText(paragraph(state.index));return;}
if(action==="copyAll"){copyText(bodyParagraphs());return;}
if(action==="restart"){Object.assign(state,{stage:"welcome",name:"",introConfirmed:false,closingConfirmed:false,index:0,step:0,selected:-1,checked:false,tries:0,score:0,hint:false,confirmed:false,finished:[]});render();}
});
root.addEventListener("change",e=>{
const id=e.target.id;
const btn=id==="confirmIntro"?'[data-action="start"]':id==="confirmCopy"?'[data-action="next"]':id==="confirmConclusion"?'[data-action="finishConclusion"]':null;
if(!btn)return;
const prop=id==="confirmIntro"?"introConfirmed":id==="confirmCopy"?"confirmed":"closingConfirmed";
state[prop]=e.target.checked;
const control=root.querySelector(btn);if(control)control.disabled=!state[prop];
});
root.addEventListener("keydown",e=>{if(e.target.classList?.contains("vocab")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
render();</script></body></html>
